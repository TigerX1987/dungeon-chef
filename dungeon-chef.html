// ---- Texture images for FP rendering ----
const _wallTex=new Image();_wallTex.src=IMG_SRC['_wallTex']||'';
const _floorTex=new Image();_floorTex.src=IMG_SRC['_floorTex']||'';
const _ceilTex=new Image();_ceilTex.src=IMG_SRC['_ceilTex']||'';
const _texReady=()=>_wallTex.complete&&_wallTex.naturalWidth>0&&_floorTex.complete&&_floorTex.naturalWidth>0&&_ceilTex.complete&&_ceilTex.naturalWidth>0;

// ---- Input ----
let mx=0,my=0,mc=false;
const keys={};
cv.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY;mc=true;AC()});
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('mouseup',()=>{});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];mx=t.clientX;my=t.clientY;mc=true;AC()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mx=t.clientX;my=t.clientY},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();mc=true;AC()}if((e.key==='r'||e.key==='R')&&(G.state==='dead'||G.state==='win'))newRun()});
addEventListener('keyup',e=>{keys[e.key]=false});

// ---- Audio ----
let AC_=null;
function AC(){if(AC_)return;AC_=new(AudioContext||webkitAudioContext)()}
function tn(f,d,t='square',v=.1){if(!AC_)return;const o=AC_.createOscillator(),g=AC_.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC_.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC_.currentTime+d);o.connect(g);g.connect(AC_.destination);o.start();o.stop(AC_.currentTime+d)}
function ns(d,v=.06){if(!AC_)return;const s=AC_.sampleRate*d,b=AC_.createBuffer(1,s,AC_.sampleRate),dt=b.getChannelData(0);for(let i=0;i<s;i++)dt[i]=Math.random()*2-1;const n=AC_.createBufferSource();n.buffer=b;const g=AC_.createGain();g.gain.setValueAtTime(v,AC_.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC_.currentTime+d);n.connect(g);g.connect(AC_.destination);n.start();n.stop(AC_.currentTime+d)}
const S={
  draw:()=>tn(440,.06,'triangle',.05), play:()=>tn(330,.1,'square',.06),
  hit:()=>{ns(.1,.04);tn(120,.1,'sawtooth',.06)},
  hurt:()=>{tn(80,.2,'sawtooth',.08);ns(.15,.04)},
  def:()=>tn(200,.12,'triangle',.05),
  kill:()=>{tn(200,.06);setTimeout(()=>tn(150,.08,'sawtooth'),60);setTimeout(()=>tn(100,.12,'sawtooth'),120)},
  cookP:()=>{tn(523,.06);setTimeout(()=>tn(659,.06),60);setTimeout(()=>tn(784,.1),120)},
  cookG:()=>tn(440,.12,'triangle',.06), cookB:()=>{ns(.2,.06);tn(60,.2,'sawtooth',.06)},
  eat:()=>{tn(300,.06,'triangle',.04);setTimeout(()=>tn(400,.06,'triangle',.04),60)},
  clk:()=>tn(660,.03,'square',.03),
  win:()=>{tn(523,.08);setTimeout(()=>tn(659,.08),80);setTimeout(()=>tn(784,.08),160);setTimeout(()=>tn(1047,.15),240)},
  die:()=>{tn(200,.2,'sawtooth',.06);setTimeout(()=>tn(150,.2,'sawtooth'),200);setTimeout(()=>tn(100,.3,'sawtooth'),400)},
  bell:()=>{tn(880,.08,'triangle',.04);setTimeout(()=>tn(660,.08,'triangle',.03),80)},
  step:()=>tn(80,.04,'sine',.02),
  combat:()=>{tn(440,.05);setTimeout(()=>tn(330,.08,'sawtooth'),50)},
  pet:()=>{tn(440,.06,'triangle',.05);setTimeout(()=>tn(554,.06,'triangle',.05),60);setTimeout(()=>tn(659,.08,'triangle',.05),120)},
};
let bgmI=null,bi=0;const bgmN=[220,0,277,0,330,277,220,0,196,0,220,0,277,330,0,277];
function bgmOn(){if(bgmI)return;bgmI=setInterval(()=>{if(!AC_)return;const n=bgmN[bi%16];if(n>0)tn(n,.2,'triangle',.015);bi++},400)}
function bgmOff(){if(bgmI){clearInterval(bgmI);bgmI=null}}

// ---- Draw helpers ----
function rr(x,y,w,h,r,f,s){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=2;ctx.stroke()}}
function dt(t,x,y,sz,col,al='center',wt='normal'){ctx.font=`${wt} ${sz}px 'Segoe UI',Tahoma,sans-serif`;ctx.textAlign=al;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(t,x+1,y+1);ctx.fillStyle=col;ctx.fillText(t,x,y)}
function wrap(t,mw,sz){ctx.font=`${sz}px 'Segoe UI',Tahoma,sans-serif`;const out=[];let c='';for(const ch of t){if(ctx.measureText(c+ch).width>mw&&c){out.push(c);c=ch}else c+=ch}if(c)out.push(c);return out}
function hitBtn(x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h}
function btn(x,y,w,h,lbl,col,sub){const hv=hitBtn(x,y,w,h);rr(x,y,w,h,6,hv?'#2a2a2a':'#1a1a1a',col);dt(lbl,x+w/2,y+h/2+(sub?-3:5),sub?14:16,hv?col:'#ccc','center','bold');if(sub)dt(sub,x+w/2,y+h-9,9,'#888');return hv}

// ================================================================
//  MAP GENERATION (grid-based dungeon)
// ================================================================
function genMap(floorIdx){
  if(floorIdx>=FLOORS.length)return null;
  const f=FLOORS[floorIdx];
  const w=12,h=12;
  const m=[];
  for(let y=0;y<h;y++){m[y]=[];for(let x=0;x<w;x++)m[y][x]=1} // all walls
  
  // Carve rooms via random walk — V20: narrower rooms, longer corridors for corridor feel
  let cx=1,cy=1;
  const visited=new Set();
  for(let i=0;i<f.rooms*4;i++){
    const rw=ri(1,3),rh=ri(1,3); // V20: smaller rooms (was 2-4)
    for(let dy=0;dy<rh;dy++)for(let dx=0;dx<rw;dx++){
      const x2=cx+dx,y2=cy+dy;
      if(x2>0&&x2<w-1&&y2>0&&y2<h-1)m[y2][x2]=0;
    }
    // Connect to next room with corridor — V20: longer corridors (was 2-4)
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const d=pick(dirs);
    const dist=ri(3,6); // V20: longer corridors
    for(let s=0;s<dist;s++){
      cx=clamp(cx+d[0],1,w-2);cy=clamp(cy+d[1],1,h-2);
      m[cy][cx]=0;
    }
  }
  // V20: Ensure a long eastward corridor from start (at least 5 tiles)
  for(let dx=1;dx<=6;dx++){
    if(1+dx<w-1) m[1][1+dx]=0; // carve east from (1,1)
  }
  // Ensure start area is open
  for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)if(dy<h&&dx<w)m[dy][dx]=0;
  
  // Place boss room at far corner
  const bx=w-2,by=h-2;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x2=bx+dx,y2=by+dy;if(x2>0&&x2<w&&y2>0&&y2<h)m[y2][x2]=0;
  }
  m[by][bx]=2; // boss marker
  
  // BFS flood-fill from start (1,1) to find all reachable tiles
  const reachable=new Set();
  const queue=[[1,1]];
  reachable.add('1,1');
  while(queue.length){
    const [qx,qy]=queue.shift();
    for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx2=qx+ddx,ny2=qy+ddy;
      const key2=ny2+','+nx2;
      if(nx2<0||nx2>=w||ny2<0||ny2>=h)continue;
      if(reachable.has(key2))continue;
      if(m[ny2][nx2]===1)continue; // wall
      reachable.add(key2);
      queue.push([nx2,ny2]);
    }
  }
  // Wall off any unreachable floor tiles (fixes air-wall issue)
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x]===0&&!reachable.has(y+','+x))m[y][x]=1;
  }

  // Find open REACHABLE positions for monsters and chests
  // V15: Only use positions with at least 2 open neighbors (not dead-ends)
  const opens=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x]===0){
      // Count open neighbors
      let openCount=0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx2=x+dx,ny2=y+dy;
        if(nx2>=0&&nx2<w&&ny2>=0&&ny2<h&&m[ny2][nx2]!==1)openCount++;
      }
      // Only add tiles with 2+ open neighbors (corridor or room, not dead-end)
      if(openCount>=2)opens.push([x,y]);
    }
  }
  
  // Place monsters (normal wandering)
  const mons=[];
  const monCount=Math.min(f.rooms,opens.length-5);
  for(let i=0;i<monCount;i++){
    const idx=ri(3,opens.length-1);
    const [mx2,my2]=opens[idx];
    // Keep monsters at least 4 tiles from start position (1.5,1.5)
    const distFromStart=Math.sqrt((mx2-1.5)**2+(my2-1.5)**2);
    if(distFromStart<4)continue; // not too close to start
    const key=pick(f.pool);
    mons.push({x:mx2+0.5,y:my2+0.5,key,dir:rand(0,Math.PI*2),alive:true,isElite:false});
  }
  // Place 1-2 elite monsters
  if(f.elite){
    const eCount=Math.min(f.elite.length,2);
    for(let i=0;i<eCount;i++){
      const idx=ri(opens.length/2|0,opens.length-1);
      const [mx2,my2]=opens[idx];
      mons.push({x:mx2+0.5,y:my2+0.5,key:f.elite[i%f.elite.length],dir:rand(0,Math.PI*2),alive:true,isElite:true});
    }
  }
  
  // Place chests (0-1 only, far from start for exploration reward)
  const chests=[];
  const chCount=Math.random()<0.6?1:0; // 60% chance for 1 chest, 40% for none
  if(chCount>0){
    // Pick a reachable open tile far from start
    let bestTile=null,bestDist=0;
    for(const [cx2,cy2] of opens){
      const d=Math.sqrt((cx2-1.5)**2+(cy2-1.5)**2);
      if(d>bestDist&&d>4){bestDist=d;bestTile=[cx2,cy2]}
    }
    if(bestTile)chests.push({x:bestTile[0],y:bestTile[1],opened:false,gold:ri(5,20)});
  }
  
  // Fog of war
  const explored=[];
  for(let y=0;y<h;y++){explored[y]=[];for(let x=0;x<w;x++)explored[y][x]=false}
  
  return{map:m,w,h,bx,by,mons,chests,explored};
}

function enterFloor(floorIdx){
  G.floor=floorIdx;
  if(floorIdx>=FLOORS.length){G.state='win';S.win();save();return}
  const d=genMap(floorIdx);
  if(!d)return;
  G.map=d.map;G.mapW=d.w;G.mapH=d.h;
  G.explored=d.explored;
  G.mapMons=d.mons;
  G.mapChests=d.chests;
  G.bossDishKey=FLOORS[floorIdx].boss;
  G.bossDefeated=false;G.bossFed=false;G.bossFirstKill=false;G.hasBossDish=false;
  G.px=1.5;G.py=1.5;G.pdir=Math.PI/2; // face south (into corridor depth)
  G.state='explore';
  revealFog(); // reveal initial area around player
  showMsg('进入 '+FLOORS[floorIdx].n,60); // V41: shorter message
}

function showMsg(t,dur){G.msg=t;G.msgT=dur||60}

function isWall(x,y){
  const mx=Math.floor(x),my=Math.floor(y);
  if(mx<0||mx>=G.mapW||my<0||my>=G.mapH)return true;
  const v=G.map[my][mx];
  return v===1; // 0=floor,1=wall,2=boss(floor)
}

// ================================================================
//  FIRST-PERSON CORRIDOR RENDERING (shared by explore & battle)
// ================================================================

// Raycast-like FP view: cast rays from player facing direction
// V9: Stronger depth fog gradient (warm→cool purple, not pure black), smoother floor,
//     seamless wall texturing, bigger torches, subtle ceiling gradient
function renderFP(t,isBattle){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  // V54f: Darker background — green-brown black for sewer tone (was purple #060410)
  ctx.fillStyle='#060a06';
  ctx.fillRect(0,0,W,H);

  const horizonY=Math.floor(H*0.42);
  const fov=Math.PI/2.8;
  const numRays=Math.min(W,200);
  const colW=W/numRays;
  const maxDist=18;
  const dir=G.pdir||0;
  const hasTex=_texReady();

  // ================================================================
  // 1. FLOOR — per-pixel perspective via low-res ImageData (1/3 res)
  // ================================================================
  const floorTop=horizonY;

  if(hasTex){
    // Cache floor texture pixel data
    if(!window._floorTexData||window._floorTexData.key!=='f36'){
      const tc=document.createElement('canvas');tc.width=_floorTex.naturalWidth;tc.height=_floorTex.naturalHeight;
      const tctx=tc.getContext('2d');tctx.drawImage(_floorTex,0,0);
      window._floorTexData={data:tctx.getImageData(0,0,tc.width,tc.height),w:tc.width,h:tc.height,key:'f36'};
    }
    const fData=window._floorTexData.data.data;
    const fW=window._floorTexData.w, fH=window._floorTexData.h;

    const scale=2; // V43: higher resolution floor rendering (was 3)
    const rW=Math.ceil(W/scale);

    // Floor: render rows from horizonY down to H
    const rFloorTop=Math.ceil(floorTop/scale);
    const rFloorBot=Math.ceil(H/scale);
    const rFH=rFloorBot-rFloorTop;
    if(rFH>0&&rW>0){
      if(!window._rFCV||window._rFCV.width!==rW||window._rFCV.height!==rFH){
        window._rFCV=document.createElement('canvas');window._rFCV.width=rW;window._rFCV.height=rFH;
      }
      const rctx=window._rFCV.getContext('2d');
      if(!window._floorImgData||window._floorImgData.width!==rW||window._floorImgData.height!==rFH){
        window._floorImgData=rctx.createImageData(rW,rFH);
      }
      const pixels=window._floorImgData.data;
      const texScale=1.4; // V46: larger flagstone slabs for more visible texture

      // Pre-calculate cos/sin per column (cache arrays)
      if(!window._fCosArr||window._fCosArr.length!==rW){
        window._fCosArr=new Float32Array(rW);
        window._fSinArr=new Float32Array(rW);
      }
      const fCosArr=window._fCosArr, fSinArr=window._fSinArr;
      for(let rx=0;rx<rW;rx++){
        const screenAngle=(rx*scale/W-0.5)*fov;
        fCosArr[rx]=Math.cos(dir+screenAngle);
        fSinArr[rx]=Math.sin(dir+screenAngle);
      }

      for(let ry=0;ry<rFH;ry++){
        const y=(ry+rFloorTop)*scale;
        let p=y-horizonY;
        if(p<=0)continue;
        const rowDist=0.5/(p/H);
        // V33: Stronger floor brightness and warmth
      const fogFactor=Math.max(0.25, Math.exp(-rowDist*0.12)); // V54b: stronger fog falloff for darker floor (was 0.06)
        const desatT=Math.min(0.3, Math.max(0, (rowDist-3)/12)); // V42: less desaturation
        const warmth=Math.max(0, 1-rowDist/9); // V42: warmth extends further
        const coolT=1-warmth;
      const fBase=0.85*fogFactor; // V54b: much lower floor brightness (was 1.3, caused bright overlay)
      const fWarmR=warmth*30, fWarmG=warmth*15; // V54b: less warm tint (was 55/28)
      // V54e: Sewer color - suppress red/blue, boost green channel
      const fCoolR=coolT*4, fCoolG=coolT*20, fCoolB=coolT*6; // V54e2: stronger green tint
      const grayMix=0.30*desatT; // blend toward gray for distant floor

      for(let rx=0;rx<rW;rx++){
        const wx=G.px+fCosArr[rx]*rowDist;
        const wy=G.py+fSinArr[rx]*rowDist;

        const tu=((wx*texScale)%1+1)%1;
        const tv=((wy*texScale)%1+1)%1;
        const tx=Math.floor(tv*fH)*fW+Math.floor(tu*fW);
        const tx4=tx*4;
        const idx=(ry*rW+rx)*4;

        if(tx4>=0&&tx4+3<fData.length){
          // V54b: Reduced floor brightness to prevent bright overlay artifact
          const fBoost=1.2; // V54b: reduced (was 1.5, 103*1.3*1.5=200 too bright)
            let r=fData[tx4]*fBase*fBoost*0.92+fWarmR+fCoolR; // V54e2: suppress red channel
            let g=fData[tx4+1]*fBase*fBoost*1.05+fWarmG+fCoolG; // V54e2: boost green channel
            let b=fData[tx4+2]*fBase*fBoost*0.88+fCoolB; // V54e2: suppress blue channel
            // V14: desaturate distant floor
            if(grayMix>0.01){
              const gray=(r+g+b)/3;
              r=r*(1-grayMix)+gray*grayMix;
              g=g*(1-grayMix)+gray*grayMix;
              b=b*(1-grayMix)+gray*grayMix;
            }
            pixels[idx]=r>255?255:r;
            pixels[idx+1]=g>255?255:g;
            pixels[idx+2]=b>255?255:b;
            pixels[idx+3]=255;
          }
        }
      }
      rctx.putImageData(window._floorImgData,0,0);
      ctx.drawImage(window._rFCV,0,0,rW,rFH,0,floorTop,W,H-floorTop);
    }

    // ================================================================
    // 2. CEILING — V23: Per-pixel perspective via low-res ImageData (same as floor)
    // This gives true 3D perspective depth to the ceiling
    // ================================================================
    if(_ceilTex && _ceilTex.naturalWidth>0){
      // Cache ceiling texture pixel data
      if(!window._ceilTexData||window._ceilTexData.key!=='c34'){
        const tc2=document.createElement('canvas');tc2.width=_ceilTex.naturalWidth;tc2.height=_ceilTex.naturalHeight;
        const tctx2=tc2.getContext('2d');tctx2.drawImage(_ceilTex,0,0);
        window._ceilTexData={data:tctx2.getImageData(0,0,tc2.width,tc2.height),w:tc2.width,h:tc2.height,key:'c34'};
      }
      const cData=window._ceilTexData.data.data;
      const cW=window._ceilTexData.w, cH=window._ceilTexData.h;

      const cscale=2; // V43: higher resolution ceiling rendering (was 3)
      const crW=Math.ceil(W/cscale);
      const ceilTop=0;
      const ceilBot=horizonY;
      const rCeilTop=Math.floor(ceilTop/cscale);
      const rCeilBot=Math.ceil(ceilBot/cscale);
      const rCH=rCeilBot-rCeilTop;
      if(rCH>0&&crW>0){
        if(!window._rCCV||window._rCCV.width!==crW||window._rCCV.height!==rCH){
          window._rCCV=document.createElement('canvas');window._rCCV.width=crW;window._rCCV.height=rCH;
        }
        const rctx2=window._rCCV.getContext('2d');
        if(!window._ceilImgData||window._ceilImgData.width!==crW||window._ceilImgData.height!==rCH){
          window._ceilImgData=rctx2.createImageData(crW,rCH);
        }
        const cpixels=window._ceilImgData.data;
        const ctexScale=1.4; // V46: larger ceiling tiles

        // Pre-calculate cos/sin per column
        if(!window._cCosArr||window._cCosArr.length!==crW){
          window._cCosArr=new Float32Array(crW);
          window._cSinArr=new Float32Array(crW);
        }
        const cCosArr=window._cCosArr, cSinArr=window._cSinArr;
        for(let rx=0;rx<crW;rx++){
          const screenAngle=(rx*cscale/W-0.5)*fov;
          cCosArr[rx]=Math.cos(dir+screenAngle);
          cSinArr[rx]=Math.sin(dir+screenAngle);
        }

        for(let ry=0;ry<rCH;ry++){
          const y=(ry+rCeilTop)*cscale;
          let p=horizonY-y; // distance from horizon (upward)
          if(p<=0)continue;
          // Perp distance for ceiling (same formula as floor but inverted)
          const rowDist=0.5/(p/H);
          // V33: Stronger fog and warmth for ceiling
          const fogFactor=Math.max(0.35, Math.exp(-rowDist*0.10)); // V55: brighter ceiling (was 0.25/exp 0.12)
          const warmth=Math.max(0, 1-rowDist/10); // V42: warmth extends further
          const coolT=1-warmth;
          const cBase=1.15*fogFactor; // V55: brighter ceiling (was 0.8)
          const cWarmR=warmth*40, cWarmG=warmth*18; // V54b: less warm tint (was 65/32)
          const cCoolR=coolT*6, cCoolG=coolT*22, cCoolB=coolT*8; // V54e2: stronger green tint
          // V54b: Reduced brightBoost
          const brightBoost=1.25; // V55: brighter ceiling (was 1.0)
          // V42: Less aggressive horizon fade — min 0.55 instead of 0.30
          const horizonFade=Math.max(0.70, Math.min(1, p/50)); // V55: brighter near horizon (was 0.55)
          // V54e: Fog blend - dark green-brown for sewer tone
          const fogBlendR=22, fogBlendG=28, fogBlendB=20; // V54e: greenish fog (was 30/22/18 brown)
          const fogAmt=1-horizonFade;

          for(let rx=0;rx<crW;rx++){
            const wx=G.px+cCosArr[rx]*rowDist;
            const wy=G.py+cSinArr[rx]*rowDist;

            const tu=((wx*ctexScale)%1+1)%1;
            const tv=((wy*ctexScale)%1+1)%1;
            const tx=Math.floor(tv*cH)*cW+Math.floor(tu*cW);
            const tx4=tx*4;
            const idx=(ry*crW+rx)*4;

            if(tx4>=0&&tx4+3<cData.length){
              // V55: Brighter sewer ceiling — keep green-brown tint but lift overall brightness
              const texR=cData[tx4]*cBase*brightBoost*0.90+cWarmR*0.7+cCoolR; // V55: was 0.80
              const texG=cData[tx4+1]*cBase*brightBoost*1.05+cWarmG*0.8+cCoolG; // V55: was 1.02
              const texB=cData[tx4+2]*cBase*brightBoost*0.82+cCoolB; // V55: was 0.72
              let r=texR*horizonFade+fogBlendR*fogAmt;
              let g=texG*horizonFade+fogBlendG*fogAmt;
              let b=texB*horizonFade+fogBlendB*fogAmt;
              cpixels[idx]=r>255?255:r<0?0:r;
              cpixels[idx+1]=g>255?255:g<0?0:g;
              cpixels[idx+2]=b>255?255:b<0?0:b;
              cpixels[idx+3]=255;
            }
          }
        }
        rctx2.putImageData(window._ceilImgData,0,0);
        ctx.drawImage(window._rCCV,0,0,crW,rCH,0,0,W,horizonY);
        // V55: Lighter arch vault shadow for visible ceiling structure
        const archGrad=ctx.createLinearGradient(0,0,0,horizonY);
        archGrad.addColorStop(0,'rgba(5,8,6,0.25)'); // V55: lighter (was 0.45)
        archGrad.addColorStop(0.3,"rgba(8,12,6,0.12)"); // V55: lighter (was 0.25)
        archGrad.addColorStop(0.6,"rgba(12,16,8,0.05)"); // V55: lighter (was 0.10)
        archGrad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=archGrad;ctx.fillRect(0,0,W,horizonY);
      }
    }else{
      // V54e: Sewer fallback - green-brown tones
      const ceilGrad=ctx.createLinearGradient(0,0,0,horizonY+20);
      ceilGrad.addColorStop(0,'#040806');ceilGrad.addColorStop(.5,'#0a1208');ceilGrad.addColorStop(1,'#0e1810');
      ctx.fillStyle=ceilGrad;ctx.fillRect(0,0,W,horizonY+20);
      const floorGrad=ctx.createLinearGradient(0,horizonY,0,H);
      floorGrad.addColorStop(0,'#080c06');floorGrad.addColorStop(.25,'#101608');floorGrad.addColorStop(.55,'#181c0c');floorGrad.addColorStop(1,'#1c1e10');
      ctx.fillStyle=floorGrad;ctx.fillRect(floorTop,0,W,H-floorTop);
    }

  } // close if(hasTex)

  // ================================================================
  // 3. WALLS — raycast with world-offset texture mapping
  // ================================================================
  // V54: zBuffer as global so props/entities can check wall occlusion
  const zBuffer=new Float32Array(numRays);
  G._zBuffer=zBuffer;
  G._zBufferColW=colW;
  G._zBufferNumRays=numRays;
  G._zBufferFov=fov;
  G._zBufferDir=dir;
  for(let r=0;r<numRays;r++){
    const screenX=r*colW;
    const rayAngle=dir-fov/2+fov*r/(numRays-1);
    let dist=0,cx2=G.px,cy2=G.py;
    const step=0.04;
    let hit=false,hitSide=0,hitX=0,hitWX=0,hitWY=0;
    while(dist<maxDist){
      cx2+=Math.cos(rayAngle)*step;
      cy2+=Math.sin(rayAngle)*step;
      dist+=step;
      const mx2=Math.floor(cx2),my2=Math.floor(cy2);
      if(mx2<0||mx2>=G.mapW||my2<0||my2>=G.mapH){break}
      if(G.map[my2][mx2]===1){
        const fx=cx2-Math.floor(cx2)-0.5, fy=cy2-Math.floor(cy2)-0.5;
        hitSide=Math.abs(fx)>Math.abs(fy)?0:1;
        hitX=hitSide===0?(cy2-Math.floor(cy2)):(cx2-Math.floor(cx2));
        hitWX=Math.floor(cx2); hitWY=Math.floor(cy2);
        hit=true;break;
      }
    }
    const corrected=dist*Math.cos(rayAngle-dir);
    zBuffer[r]=hit?corrected:maxDist;
    if(!hit)continue;

    const wallH=H*0.85/Math.max(corrected,0.3);
    const wallTop=horizonY-wallH*0.46;
    const wallBot=horizonY+wallH*0.54;

    // V33: Brighter walls — weaker distance dimming, keep more detail visible
    const dim=Math.max(0.25, Math.exp(-corrected*0.12));
    const warmth=Math.max(0, Math.min(1, 1-corrected/8));
    const shade=hitSide===0?1:0.82;

    if(hasTex){
      // World-offset U: shift texture based on world tile position for horizontal variety
      const tileOffsetU=((hitWX*17+hitWY*31)%_wallTex.naturalWidth)/_wallTex.naturalWidth;
      const texX=Math.floor(((hitX+tileOffsetU)%1+1)%1*_wallTex.naturalWidth)%_wallTex.naturalWidth;
      const srcW=Math.max(1,Math.ceil(_wallTex.naturalWidth/numRays*2));
      const srcH=_wallTex.naturalHeight;
      // V25: Reverted to simple full-height drawImage (V24 split caused seams/distortion)
      ctx.drawImage(_wallTex,
        texX, 0, srcW, srcH,
        screenX, wallTop, Math.ceil(colW)+1, wallBot-wallTop
      );

      // V54h: Apply green-brown sewer tint to wall texture — suppress purple, boost green
      // Use multiply-like overlay: add green and reduce R/B
      ctx.fillStyle='rgba(20,35,15,0.35)';
      ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);

      // V55: Wet slime overlay — strong greenish sheen on lower half of walls (water/sewer dampness)
      const wetHeight=(wallBot-wallTop)*0.60;
      const wetGrad=ctx.createLinearGradient(screenX,wallBot,screenX,wallBot-wetHeight);
      wetGrad.addColorStop(0,"rgba(20,45,25,0.40)");
      wetGrad.addColorStop(0.4,"rgba(15,35,20,0.22)");
      wetGrad.addColorStop(0.8,"rgba(10,22,15,0.08)");
      wetGrad.addColorStop(1,"rgba(10,20,15,0)");
      ctx.fillStyle=wetGrad;
      ctx.fillRect(screenX,wallBot-wetHeight,Math.ceil(colW)+1,wetHeight);
      // V55: Wet glossy highlight line at the water line level
      const waterLineY=wallBot-wetHeight;
      ctx.fillStyle=`rgba(70,100,65,${0.12*dim})`;
      ctx.fillRect(screenX,waterLineY-1,Math.ceil(colW)+1,2);

      // V22: Stronger per-tile color variation — more types, higher alpha, visible contrast
      const tileTint=(hitWX*13+hitWY*29)%10;
      if(tileTint===0){
        ctx.fillStyle='rgba(35,18,5,0.30)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===1){
        ctx.fillStyle='rgba(5,12,8,0.30)'; // V54f: was purple (5,8,25)
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===2){
        ctx.fillStyle='rgba(3,6,4,0.35)'; // V54f: was purple (2,3,10)
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===3){
        // Extra warm tile (near torch light)
        ctx.fillStyle='rgba(50,25,8,0.20)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===4){
        // Darker wet patch
        ctx.fillStyle='rgba(3,5,15,0.30)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===5){
        // Warm brown tint
        ctx.fillStyle='rgba(45,22,8,0.25)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===6){
        // V54f: Cool green-grey patch (was blue-purple)
        ctx.fillStyle='rgba(5,15,10,0.28)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===7){
        // Greenish moss tile
        ctx.fillStyle='rgba(10,30,8,0.22)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===8){
        // Lighter stone patch
        ctx.fillStyle='rgba(40,30,20,0.18)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }else if(tileTint===9){
        // Dark shadow patch
        ctx.fillStyle='rgba(0,0,5,0.35)';
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }

      // V16: Warm light overlay — V54h: reduced alpha to prevent over-bright on tinted walls
      const warmR=warmth*80*shade;
      const warmG=warmth*38*shade;
      const warmB=warmth*8*shade;
      const coolB=(1-warmth)*12;
      const coolR=(1-warmth)*3;
      ctx.fillStyle=`rgba(${warmR|0},${warmG|0},${warmB|0},0.15)`; // V54l: was 0.22, reduced to prevent warm overlay blobs
      ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      // Bottom warm gradient — torchlight from below
      const wallH2=wallBot-wallTop;
      const btmGrad=ctx.createLinearGradient(screenX,wallBot,screenX,wallTop);
      btmGrad.addColorStop(0,`rgba(${warmth*40|0},${warmth*18|0},0,${warmth*0.20})`); // V54l: reduced (was 60/28/0.35)
      btmGrad.addColorStop(0.5,`rgba(${warmth*20|0},${warmth*9|0},0,${warmth*0.08})`); // V54l: reduced (was 30/14/0.15)
      btmGrad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=btmGrad;
      ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);

      // V54f: Cool green-brown tint for distant walls (was purple)
      if(warmth<0.5){
        ctx.fillStyle=`rgba(${coolR|0},${(coolB*0.3)|0},${(coolB*0.2)|0},${(0.5-warmth)*0.25})`;
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
      }

      // V14: Distance darkening with desaturation — far walls lose color (not just dark)
      const dimAlpha=Math.max(0,Math.min(0.85,(1-dim)*shade));
      if(dimAlpha>0.02){
        // Desaturate: blend toward gray-purple instead of just dark
        const desatT=Math.min(0.6, (1-dim)*0.8); // desaturation increases with distance
        const grayR=18, grayG=16, grayB=12; // V54f: dark green-brown-gray (was purple 18,12,24)
        ctx.fillStyle=`rgba(${grayR},${grayG},${grayB},${dimAlpha*(1-desatT)})`;
        ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
        // Extra desaturation overlay — blend toward gray
        if(desatT>0.1){
          ctx.fillStyle=`rgba(28,28,22,${desatT*0.35*shade})`; // V54f: green-brown (was purple 30,25,35)
          ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
        }
      }

      // V22: Procedural wall detail — bigger cracks and water stains for small screen
      const crackSeed=((hitWX*73+hitWY*137)|0);
      const crackHash=(Math.sin(crackSeed*12.9898)*43758.5453)%1;
      if(crackHash>0.20){ // ~80% of wall segments get a crack
        const crackX=((crackSeed*0.37)%1);
        const crackAlpha=Math.min(0.75, 0.40+Math.abs(crackHash)*0.35)*dim*shade;
        ctx.strokeStyle=`rgba(5,3,8,${crackAlpha})`;
        ctx.lineWidth=Math.max(1.2, 3.5*dim); // V22: thicker cracks
        ctx.beginPath();
        const wallStripeH=Math.abs(wallBot-wallTop);
        ctx.moveTo(screenX, wallTop+crackX*wallStripeH*0.3);
        ctx.lineTo(screenX+colW*0.5, wallTop+(crackX+0.15)*wallStripeH*0.5);
        ctx.lineTo(screenX+colW*0.15, wallTop+(crackX+0.3)*wallStripeH*0.7);
        ctx.lineTo(screenX+colW*0.6, wallTop+(crackX+0.45)*wallStripeH*0.85);
        ctx.stroke();
        // Secondary crack branch
        if(crackHash>0.35){
          ctx.lineWidth=Math.max(0.8, 2.0*dim);
          ctx.beginPath();
          ctx.moveTo(screenX+colW*0.5, wallTop+(crackX+0.15)*wallStripeH*0.5);
          ctx.lineTo(screenX+colW, wallTop+(crackX+0.05)*wallStripeH*0.6);
          ctx.stroke();
        }
        // V22: Third crack branch for more visual interest
        if(crackHash>0.55){
          ctx.lineWidth=Math.max(0.6, 1.5*dim);
          ctx.beginPath();
          ctx.moveTo(screenX+colW*0.15, wallTop+(crackX+0.3)*wallStripeH*0.7);
          ctx.lineTo(screenX-colW*0.3, wallTop+(crackX+0.35)*wallStripeH*0.75);
          ctx.stroke();
        }
      }
      // V22: Bigger water stain — more visible on small screen
      const stainHash=(Math.sin(crackSeed*78.233)*43758.5453)%1;
      if(stainHash>0.15){
        const stainAlpha=Math.min(0.50, 0.20+Math.abs(stainHash)*0.30)*dim;
        const stainGrad=ctx.createLinearGradient(screenX, wallBot, screenX, wallTop);
        stainGrad.addColorStop(0, `rgba(6,8,14,${stainAlpha})`);
        stainGrad.addColorStop(0.5, `rgba(6,8,14,${stainAlpha*0.5})`);
        stainGrad.addColorStop(1, 'rgba(6,8,14,0)');
        ctx.fillStyle=stainGrad;
        const stainH=Math.abs(wallBot-wallTop)*(0.25+Math.abs(stainHash)*0.35); // V22: bigger
        ctx.fillRect(screenX, wallBot-stainH, Math.ceil(colW)+1, stainH);
      }
      // V22: Bigger moss patches — more visible on small screen
      const mossHash=(Math.sin(crackSeed*43.123)*43758.5453)%1;
      if(mossHash>0.45 && corrected<7){
        const mossAlpha=Math.min(0.35, 0.15+Math.abs(mossHash)*0.20)*dim;
        ctx.fillStyle=`rgba(40,75,30,${mossAlpha})`;
        const mossH=Math.abs(wallBot-wallTop)*0.20; // V22: bigger moss
        const mossY=wallTop+Math.abs(wallBot-wallTop)*(0.50+mossHash*0.25);
        ctx.fillRect(screenX, mossY, Math.ceil(colW)+1, mossH);
      }
      // V22: Rust/iron stain patches — additional visual variety
      const rustHash=(Math.sin(crackSeed*91.567)*43758.5453)%1;
      if(rustHash>0.7 && corrected<5){
        const rustAlpha=Math.min(0.25, 0.10+Math.abs(rustHash)*0.15)*dim;
        ctx.fillStyle=`rgba(80,40,15,${rustAlpha})`;
        const rustH=Math.abs(wallBot-wallTop)*0.15;
        const rustY=wallTop+Math.abs(wallBot-wallTop)*rustHash*0.6;
        ctx.fillRect(screenX, rustY, Math.ceil(colW)+1, rustH);
      }
      // V55: Vertical water streaks — dark vertical lines running down walls (sewer dampness)
      const streakHash=(Math.sin(crackSeed*55.789)*43758.5453)%1;
      if(streakHash>0.15 && corrected<8){
        const streakAlpha=Math.min(0.35, 0.15+Math.abs(streakHash)*0.20)*dim;
        const streakGrad=ctx.createLinearGradient(screenX,wallBot,screenX,wallTop);
        streakGrad.addColorStop(0,`rgba(8,15,12,${streakAlpha})`);
        streakGrad.addColorStop(0.3,`rgba(8,15,12,${streakAlpha*0.6})`);
        streakGrad.addColorStop(0.7,`rgba(8,15,12,${streakAlpha*0.2})`);
        streakGrad.addColorStop(1,"rgba(8,15,12,0)");
        ctx.fillStyle=streakGrad;
        const streakH=Math.abs(wallBot-wallTop)*(0.5+Math.abs(streakHash)*0.4);
        const streakOffset=((crackSeed*0.17)%1)*colW;
        ctx.fillRect(screenX+streakOffset, wallBot-streakH, Math.max(1.5,colW*0.20), streakH);
      }
      // V55: Wet reflective highlight — brighter streak at waterline for glossy wet look
      if(corrected<7){
        const wetHi=ctx.createLinearGradient(screenX,wallBot-wetHeight*0.2,screenX,wallBot-wetHeight*0.8);
        wetHi.addColorStop(0,"rgba(80,110,70,0)");
        wetHi.addColorStop(0.5,`rgba(70,100,60,${0.15*dim})`);

        ctx.fillRect(screenX,wallBot-wetHeight*0.8,Math.ceil(colW)+1,wetHeight*0.6);
      }

    // V17: Ceiling is now rendered before walls — skip per-wall ceiling
    // (ceiling was already drawn in the pre-wall ceiling pass above)
    }else{
      // V55: Fallback wall — also needs wetHeight for post-wall overlay
      var wetHeight=(wallBot-wallTop)*0.60;
      const baseR=100,baseG=110,baseB=85; // V54f: green-brown fallback (was purple 140,115,155)
      const r2=Math.floor(baseR*dim*shade+warmth*30);
      const g2=Math.floor(baseG*dim*shade+warmth*15);
      const b2=Math.floor(baseB*dim*shade+(1-warmth)*20);
      ctx.fillStyle=`rgb(${r2},${g2},${b2})`;
      ctx.fillRect(screenX,wallTop,Math.ceil(colW)+1,wallBot-wallTop);
    }
  }

  // V55: Post-wall sewer dampness overlay — applied after all wall rendering
  // Creates visible wet gradient on lower portion of all visible walls
  const sewerDampGrad=ctx.createLinearGradient(0,horizonY,0,H*0.75);

  // ================================================================
  // 4. LIGHTING — player torch glow + wall torch glows

  ctx.save();
  ctx.globalCompositeOperation='source-over'; // V54g: was 'screen' — screen mode causes brightness accumulation with multiple torches

  // Player-centered warm glow — V55: brighter (was 0.18, too dim)
  const pGlowR=W*0.70; // V55: wider radius (was 0.65)
  const pGlow=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,pGlowR);

  // Wall-mounted torches — V37: stronger, with wall light patches
  for(let td=1;td<=5;td++){
    const flick=0.55+Math.sin(t*0.015+td*2.7)*0.35+Math.sin(t*0.045+td*1.3)*0.10;

    const tgL=ctx.createRadialGradient(txLeft,ty,0,txLeft,ty,glowR);
    tgL.addColorStop(0,`rgba(200,160,65,${0.16*tscale*flick})`); // V55: brighter (was 0.10)
    tgL.addColorStop(.08,`rgba(190,130,50,${0.12*tscale*flick})`); // V55: brighter (was 0.07)
    tgL.addColorStop(.20,`rgba(150,70,25,${0.07*tscale*flick})`); // V55: brighter (was 0.04)
    tgL.addColorStop(.40,`rgba(100,40,15,${0.04*tscale*flick})`); // V55: brighter (was 0.02)
    tgL.addColorStop(.65,`rgba(55,20,8,${0.02*tscale*flick})`); // V55: brighter (was 0.01);
    tgL.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=tgL;ctx.fillRect(txLeft-glowR,ty-glowR,glowR*2,glowR*2);

    const tgR=ctx.createRadialGradient(txRight,ty,0,txRight,ty,glowR);
    tgR.addColorStop(0,`rgba(200,160,65,${0.16*tscale*flick})`); // V55: brighter (was 0.10)
    tgR.addColorStop(.08,`rgba(190,130,50,${0.12*tscale*flick})`); // V55: brighter (was 0.07)
    tgR.addColorStop(.20,`rgba(150,70,25,${0.07*tscale*flick})`); // V55: brighter (was 0.04)
    tgR.addColorStop(.40,`rgba(100,40,15,${0.04*tscale*flick})`); // V55: brighter (was 0.02)
    tgR.addColorStop(.65,`rgba(55,20,8,${0.02*tscale*flick})`); // V55: brighter (was 0.01);

    ctx.fillStyle=tgR;ctx.fillRect(txRight-glowR,ty-glowR,glowR*2,glowR*2);
    
    // V54b: Reduced wall light patch to prevent brightness blowout

    wallPatch.addColorStop(0,`rgba(180,140,55,${wallPatchAlpha})`); // V54g: dim warm

  // ================================================================

  for(let td=1;td<=5;td++){

    for(let si=0;si<5;si++){

    ctx.strokeStyle=`rgba(200,180,140,${0.70*tscale})`;
    ctx.lineWidth=Math.max(0.8,2.0*tscale);
    ctx.beginPath();ctx.ellipse(txRight,ty+2*tscale,7*tscale,4*tscale,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(220,200,160,${0.60*tscale})`;
    ctx.beginPath();ctx.arc(txRight-5*tscale,ty+5*tscale,1.5*tscale,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(txRight+5*tscale,ty+5*tscale,1.5*tscale,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(txRight,ty+15*tscale,1.5*tscale,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a1808';
    ctx.fillRect(txRight-10*tscale,ty+22*tscale,20*tscale,6*tscale);
    ctx.strokeStyle=`rgba(160,140,110,${0.40*tscale})`;
    ctx.lineWidth=Math.max(0.5,1.0*tscale);

    ctx.fillStyle=`rgba(255,240,200,${0.50*tscale})`; // V54i: dimmer core

    for(let si=0;si<5;si++){
      const sT=t*0.002+td+si*1.1+0.5;
      const smokeX=txRight+Math.sin(sT*3)*8*tscale;

      ctx.fillStyle=`rgba(90,80,72,${smokeAlpha})`;
      ctx.beginPath();ctx.ellipse(smokeX,smokeY,smokeR,smokeR*0.9,0,0,Math.PI*2);ctx.fill();
    }
  }

  // V54e: Sewer fog - green-brown tints
  const fogGrad=ctx.createLinearGradient(0,horizonY-140,0,horizonY+180);
  fogGrad.addColorStop(0,'rgba(14,20,14,0)');
  fogGrad.addColorStop(0.15,'rgba(20,28,18,0.08)');

  fogGrad.addColorStop(1,'rgba(14,18,14,0)');

  ctx.fillRect(0,horizonY-140,W,320);
  // V54e: Sewer horizon glow - greenish-brown

  hzFog.addColorStop(1,'rgba(14,18,14,0)');
  ctx.fillStyle=hzFog;
  ctx.fillRect(0,horizonY-60,W,150);

    // --- Environmental props --- (V42: moved to after bloom, see below)

  if(!isBattle){
    drawCorridorEntities(t,dir,fov,horizonY,maxDist);
  }

  // V55: Removed floating dust motes — were appearing as glitched semi-transparent circles

  // ---- PLAYER'S HANDS ----
  const handBob=Math.sin(t*0.008)*3;

  ctx.save();
  ctx.globalCompositeOperation='source-over'; // V54g: was 'screen' — avoid brightness accumulation
  const handGlow=ctx.createRadialGradient(W*0.22,H*0.72,0,W*0.22,H*0.72,W*0.38);
  handGlow.addColorStop(0,`rgba(180,120,40,${0.16*torchFlame})`); // V54g: source-over, dim warm
  handGlow.addColorStop(.15,`rgba(160,90,30,${0.08*torchFlame})`);

  handGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=handGlow;ctx.fillRect(0,H*0.3,W,H*0.7);
  ctx.restore();

  // [V54m: hand shapes moved to after vignette — see below]

  // V54e: Sewer far fog - green-brown
  const farFog=ctx.createLinearGradient(0,horizonY-30,0,horizonY+60);
  farFog.addColorStop(0,'rgba(25,30,20,0)');
  farFog.addColorStop(0.2,'rgba(22,28,18,0.12)');
  farFog.addColorStop(0.4,'rgba(30,35,22,0.18)');
  farFog.addColorStop(0.55,'rgba(22,28,18,0.12)');
  farFog.addColorStop(0.75,'rgba(14,18,12,0.06)');

  const vig=ctx.createRadialGradient(W/2,H*0.45,W*0.20,W/2,H*0.45,W*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(0.40,'rgba(0,0,0,0.05)');
  vig.addColorStop(0.65,'rgba(0,0,0,0.15)');
  vig.addColorStop(0.82,'rgba(0,0,0,0.35)');
  vig.addColorStop(1,'rgba(0,0,0,0.60)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // ---- V54m: PLAYER'S HANDS — extracted to drawHands(), called after UI in rExplore/rBattle ----

  // ---- V42: BLOOM disabled — causing brightness accumulation in game loop ----
  /*
  if(!window._bloomCV||window._bloomCV.width!==W||window._bloomCV.height!==H){

  }

    }else{

      bd[i]*=f;bd[i+1]*=f;bd[i+2]*=f;
    }
  }
  bctx.putImageData(bData,0,0);
  // Blur and add back

  */
  
  // V42: Draw props AFTER vignette so they're on top and visible
  if(!isBattle){
    drawFloorScatter(t,dir,fov,horizonY,maxDist);
    drawCeilingProps(t,dir,fov,horizonY,maxDist);
    drawCorridorProps(t,dir,fov,horizonY,maxDist);

  }
}

// V40: Floor scatter — small pebbles, bone fragments, cracks on floor tiles
function drawFloorScatter(t,dir,fov,horizonY,maxDist){
  const scatterRange=10;
  for(let dy=-scatterRange;dy<=scatterRange;dy++){
    for(let dx=-scatterRange;dx<=scatterRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue;
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      // 3 scatter items per tile
      for(let si=0;si<3;si++){
        const sSeed=((seed+si*98765)^(si*54321))>>>0;
        if((sSeed>>16)%4===0)continue; // V46: skip only 25% (was 16%), more scatter
        const scatterType=(sSeed>>8)%7; // V46: 7 types (0=pebble, 1=bone, 2=crack, 3=moss, 4=ash, 5=ember, 6=web)
        const px2=tx+0.1+((sSeed>>4)&0x3F)/256*0.8;
        const py2=ty+0.1+((sSeed>>10)&0x3F)/256*0.8;
        const dxp=px2-G.px, dyp=py2-G.py;
        const dist=Math.sqrt(dxp*dxp+dyp*dyp);
        if(dist<0.3||dist>3)continue; // V55: tighter max dist (was 5) — far scatter looks like floating blobs
        const angle=Math.atan2(dyp,dxp)-dir;
        let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
        if(Math.abs(na)>fov/2+0.1)continue;
        const screenT=(na/(fov/2)+1)/2;
        const sx=lerp(W*0.05,W*0.95,screenT);
        const scale=Math.max(0.05,1/(dist*0.4+0.15));
      const sz=H*0.35*scale; // V54b: much smaller scatter (was 1.1, caused giant bright patches)
      if(sz<H*0.25)continue; // V55: skip if too small — prevents floating pixel-sized artifacts
      const groundY=horizonY+(H-horizonY)*Math.min(0.95,scale*0.85); // V41: closer to screen bottom for near props
      const dim=Math.max(0.60,Math.min(1,14/(dist+0.5))); // V54b: dimmer scatter (was 18)
        if(scatterType===0){
          // Pebble — small round stone, V42: brighter
          ctx.fillStyle=`rgba(${115+(sSeed&31)},${100+((sSeed>>2)&21)},${85+((sSeed>>4)&21)},${0.85*dim})`;
          const pr=sz*0.12+((sSeed>>6)&7)*sz*0.025; // V52: bigger pebbles (was 0.08/0.018)
          ctx.beginPath();ctx.arc(sx,groundY,pr,0,Math.PI*2);ctx.fill();
          // Pebble shadow
          ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
          ctx.beginPath();ctx.ellipse(sx+pr*0.3,groundY+pr*0.2,pr*1.1,pr*0.4,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===1){
          // Bone fragment — V54k: only render if very close (dist<3)
          if(dist<3){
          ctx.strokeStyle=`rgba(200,190,170,${0.60*dim})`;
          ctx.lineWidth=Math.max(0.8,sz*0.012);
          const bl=sz*0.18;
          const ba=(sSeed*0.01)%Math.PI;
          ctx.beginPath();
          ctx.moveTo(sx-Math.cos(ba)*bl,groundY-Math.sin(ba)*bl*0.3);
          ctx.lineTo(sx+Math.cos(ba)*bl,groundY+Math.sin(ba)*bl*0.3);
          ctx.stroke();
          }
        }else if(scatterType===2){
          // Floor crack — V42: more visible
          ctx.strokeStyle=`rgba(8,5,12,${0.55*dim})`;
          ctx.lineWidth=Math.max(0.5,sz*0.008);
          const cl=sz*0.25; // V52: longer crack (was 0.18)
          const ca=(sSeed*0.013)%Math.PI;
          ctx.beginPath();
          ctx.moveTo(sx-Math.cos(ca)*cl,groundY);
          ctx.lineTo(sx,groundY+Math.sin(ca)*cl*0.2);
          ctx.lineTo(sx+Math.cos(ca)*cl*0.8,groundY);
          ctx.stroke();
        }else if(scatterType===3){
          // Small moss patch — V42: brighter
          ctx.fillStyle=`rgba(60,110,40,${0.50*dim})`;
          const mr=sz*0.12; // V52: bigger moss (was 0.08)
          ctx.beginPath();ctx.ellipse(sx,groundY,mr,mr*0.4,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle=`rgba(75,120,50,${0.40*dim})`; // V42: brighter
          ctx.beginPath();ctx.ellipse(sx-mr*0.3,groundY,mr*0.6,mr*0.25,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===4){
          // Ash/soot patch — V42: more visible
          ctx.fillStyle=`rgba(50,42,42,${0.40*dim})`;
          const ar=sz*0.13; // V52: bigger ash (was 0.09)
          ctx.beginPath();ctx.ellipse(sx,groundY,ar,ar*0.3,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle=`rgba(65,55,52,${0.30*dim})`; // V42: brighter
          ctx.beginPath();ctx.ellipse(sx+ar*0.2,groundY-ar*0.1,ar*0.7,ar*0.2,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===5){
          // V55: Removed ember glow — was appearing as floating orange dots at distance
          // Replace with dark soot stain instead
          ctx.fillStyle=`rgba(30,25,20,${0.35*dim})`;
          const er=sz*0.06;
          ctx.beginPath();ctx.ellipse(sx,groundY,er,er*0.3,0,0,Math.PI*2);ctx.fill();
        }else{
          // V54j: Removed floor web — was looking like floating white lines at distance
          // Replace with dark stain instead
          ctx.fillStyle=`rgba(25,20,15,${0.30*dim})`;
          const sr=sz*0.10;
          ctx.beginPath();ctx.ellipse(sx,groundY,sr,sr*0.3,0,0,Math.PI*2);ctx.fill();
        }
      }
    }
  }
}

// V40: Ceiling props — hanging chains, stalactites, vines, cobwebs
function drawCeilingProps(t,dir,fov,horizonY,maxDist){
  const ceilRange=12; // V41: wider range
  for(let dy=-ceilRange;dy<=ceilRange;dy++){
    for(let dx=-ceilRange;dx<=ceilRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue; // only on floor tiles (ceiling above corridors)
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      if((seed>>16)%3===0)continue; // V46: skip only 33% (was 20% skip)
      const ceilType=(seed>>8)%4; // V54e: 0=chain, 1=stalactite, 2=vine, 3=rusted pipe (was cobweb)
      const px2=tx+0.2+((seed>>4)&0x3F)/256*0.6;
      const py2=ty+0.2+((seed>>10)&0x3F)/256*0.6;
      const dxp=px2-G.px, dyp=py2-G.py;
      const dist=Math.sqrt(dxp*dxp+dyp*dyp);
      if(dist<2.0||dist>3.5)continue; // V55: tighter max dist (was 5) — far ceiling props look like floating dots
      const angle=Math.atan2(dyp,dxp)-dir;
      let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
      if(Math.abs(na)>fov/2+0.1)continue;
      const screenT=(na/(fov/2)+1)/2;
      const sx=lerp(W*0.05,W*0.95,screenT);
      const scale=Math.max(0.05,1/(dist*0.4+0.15));
      const sz=H*0.30*scale; // V54b: smaller ceiling props (was 0.72)
      if(sz<H*0.20)continue; // V55: skip if too small — prevents floating pixel artifacts
      const ceilY=horizonY-(H-horizonY)*Math.min(0.8,scale*0.7); // hangs from ceiling
      const dim=Math.max(0.65,Math.min(1,14/(dist+0.5))); // V42: brighter ceiling props
      const hangLen=sz*(0.10+((seed>>6)&15)*0.015); // V41: longer hang lengths
      if(ceilType===0){
        // Hanging chain — V42: brighter, thicker
        ctx.strokeStyle=`rgba(100,95,85,${0.80*dim})`;
        ctx.lineWidth=Math.max(1.2,sz*0.018);
        const numLinks=4;
        for(let ci=0;ci<numLinks;ci++){
          const cy=ceilY+ci*hangLen/numLinks;
          ctx.beginPath();
          ctx.ellipse(sx,cy,sz*0.012,hangLen/numLinks/2,0,0,Math.PI*2);
          ctx.stroke();
        }
        // Chain highlight — V42: brighter
        ctx.strokeStyle=`rgba(160,155,145,${0.50*dim})`;
        ctx.lineWidth=Math.max(0.6,sz*0.008);
        ctx.beginPath();ctx.moveTo(sx-sz*0.005,ceilY);ctx.lineTo(sx-sz*0.005,ceilY+hangLen);ctx.stroke();
      }else if(ceilType===1){
        // Stalactite — V42: brighter, more visible
        ctx.fillStyle=`rgba(85,72,78,${0.85*dim})`;
        ctx.beginPath();
        ctx.moveTo(sx-sz*0.025,ceilY);
        ctx.lineTo(sx+sz*0.025,ceilY);
        ctx.lineTo(sx+sz*0.008,ceilY+hangLen);
        ctx.closePath();ctx.fill();
        // Stalactite highlight — V42: brighter
        ctx.fillStyle=`rgba(120,105,110,${0.60*dim})`;
        ctx.beginPath();
        ctx.moveTo(sx-sz*0.018,ceilY);
        ctx.lineTo(sx-sz*0.005,ceilY);
        ctx.lineTo(sx+sz*0.002,ceilY+hangLen*0.8);
        ctx.closePath();ctx.fill();
        // V55: Removed water drip at stalactite tip — was appearing as floating blue dot at distance
      }else if(ceilType===2){
        // Hanging vine — V42: brighter, thicker
        ctx.strokeStyle=`rgba(50,80,35,${0.75*dim})`;
        ctx.lineWidth=Math.max(1.0,sz*0.015);
        const numSegs=5;
        ctx.beginPath();
        ctx.moveTo(sx,ceilY);
        for(let vi=1;vi<=numSegs;vi++){
          const vx=sx+Math.sin(t*0.002+vi+seed*0.1)*sz*0.015;
          const vy=ceilY+vi*hangLen/numSegs;
          ctx.lineTo(vx,vy);
        }
        ctx.stroke();
        // Vine leaves — small green dots
        for(let vi=1;vi<=numSegs;vi+=2){
          const vx=sx+Math.sin(t*0.002+vi+seed*0.1)*sz*0.015;
          const vy=ceilY+vi*hangLen/numSegs;
          ctx.fillStyle=`rgba(65,105,40,${0.70*dim})`; // V42: brighter leaves
          ctx.beginPath();ctx.ellipse(vx,vy,sz*0.012,sz*0.008,0,0,Math.PI*2);ctx.fill();
        }
      }else{
        // V54e: Rusted pipe joint — replaces cobweb for sewer theme
        ctx.fillStyle=`rgba(70,55,40,${0.75*dim})`; // rust brown base
        const pR=sz*0.02;
        ctx.beginPath();ctx.ellipse(sx,ceilY+hangLen*0.3,pR,pR*0.6,0,0,Math.PI*2);ctx.fill();
        // Rust highlight
        ctx.fillStyle=`rgba(110,80,45,${0.50*dim})`;
        ctx.beginPath();ctx.ellipse(sx-pR*0.3,ceilY+hangLen*0.3-pR*0.1,pR*0.7,pR*0.4,0,0,Math.PI*2);ctx.fill();
        // V55: Removed dripping water — was appearing as floating green-gray dot at distance
      }
    }
  }
}

// Draw environmental props (mushrooms, moss, debris, barrels, crates, webs, bones) on corridor floor
// V14: added barrels, crates, cobwebs, bone piles for richer environment
function drawCorridorProps(t,dir,fov,horizonY,maxDist){
  // V54: Sewer-themed props — all environment-appropriate for damp underground
  // V54: Added z-buffer occlusion check to prevent props showing through walls
  const zBuf=G._zBuffer;
  const zColW=G._zBufferColW;
  const zNumRays=G._zBufferNumRays;
  // V54: Helper — check if a point at (worldX,worldY) is occluded by a wall
  function isOccluded(wx,wy){
    if(!zBuf)return false;
    const dxp2=wx-G.px,dyp2=wy-G.py;
    const ang=Math.atan2(dyp2,dxp2)-dir;
    let na2=ang;while(na2>Math.PI)na2-=Math.PI*2;while(na2<-Math.PI)na2+=Math.PI*2;
    if(Math.abs(na2)>fov/2+0.05)return true;
    const rayIdx=Math.floor((na2+fov/2)/fov*zNumRays);
    const wallDist=zBuf[Math.max(0,Math.min(zNumRays-1,rayIdx))];
    const ptDist=Math.sqrt(dxp2*dxp2+dyp2*dyp2);
    return ptDist>wallDist-0.15;
  }
  // V54: Sewer prop types (10 types, all floor-level, none taller than knee height):
  // 0-1=algae stain, 2-3=puddle, 4-5=cracked_tile, 6-7=bone_fragment, 8-9=rusted_grate
  // 10-11=rat_droppings, 12-13=moss_patch, 14-15=broken_brick, 16-17=sludge_pool, 18-19=pipe_drip
  const propRange=15;
  const propPasses=2;
  for(let pass=0;pass<propPasses;pass++){
  for(let dy=-propRange;dy<=propRange;dy++){
    for(let dx=-propRange;dx<=propRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue;
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      const propType=(seed+pass*7)%20;
      if(pass===1 && (seed>>16)%2===0)continue;
      // Place props at tile edges
      const px2=tx+0.15+((seed>>4)&0x3F)/256*0.7;
      const py2=ty+0.15+((seed>>10)&0x3F)/256*0.7;
      const dxp=px2-G.px, dyp=py2-G.py;
      const dist=Math.sqrt(dxp*dxp+dyp*dyp);
      if(dist<0.8||dist>4)continue; // V55: tighter max dist (was 6) — far props still look like floating blobs
      // V55: add min render size check
      // V54: z-buffer occlusion check — skip if wall is in front
      if(isOccluded(px2,py2))continue;
      const angle=Math.atan2(dyp,dxp)-dir;
      let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
      if(Math.abs(na)>fov/2+0.1)continue;
      const screenT=(na/(fov/2)+1)/2;
      const sx=lerp(W*0.05,W*0.95,screenT);
      // V54e: Slightly larger and brighter for visibility
      const scale=Math.max(0.05,1/(dist*0.42+0.15));
      const sz=H*0.60*scale; // V54e: slightly bigger (was 0.55)
      if(sz<H*0.25)continue; // V55: skip if too small — prevents floating pixel-sized artifacts
      const groundY=horizonY+(H-horizonY)*Math.min(1,scale*0.8);
      const flicker=Math.sin(t*0.003+seed*0.1)*0.5+0.5;
      const dim=Math.max(0.85,Math.min(1,20/(dist+0.5))); // V54e: brighter (was 16)

      if(propType<2){
        // V54: Algae stain — dark green slimy patch on floor
        const algSz=sz*0.16;
        const algShades=[[35,60,25,0.55],[45,75,30,0.45],[25,50,18,0.5]];
        for(let mi=0;mi<5;mi++){
          const ma=seed*(mi+1)*0.5;
          const mr2=algSz*(0.2+((seed>>mi)&3)*0.12);
          const mx2=sx+Math.cos(ma)*algSz*0.5;
          const my2=groundY+Math.sin(ma)*algSz*0.1;
          const ms=algShades[mi%3];
          ctx.fillStyle=`rgba(${ms[0]},${ms[1]},${ms[2]},${ms[3]*dim})`;
          ctx.beginPath();ctx.ellipse(mx2,my2,mr2,mr2*0.28,ma,0,Math.PI*2);ctx.fill();
        }
        // Slimy highlight
        ctx.fillStyle=`rgba(90,130,60,${0.2*dim*flicker})`;
        ctx.beginPath();ctx.ellipse(sx-algSz*0.2,groundY-algSz*0.05,algSz*0.3,algSz*0.08,0.3,0,Math.PI*2);ctx.fill();
      }else if(propType<4){
        // V54: Puddle — dark water with faint reflection (V54l: lower alpha)
        const pSz=sz*0.14;
        // Dark water base
        ctx.fillStyle=`rgba(15,20,25,${0.5*dim})`; // V54l: was 0.7
        ctx.beginPath();ctx.ellipse(sx,groundY,pSz,pSz*0.25,0,0,Math.PI*2);ctx.fill();
        // Reflection highlight
        ctx.fillStyle=`rgba(50,60,70,${0.15*dim*flicker})`; // V54l: was 0.3
        ctx.beginPath();ctx.ellipse(sx-pSz*0.2,groundY-pSz*0.06,pSz*0.5,pSz*0.1,0,0,Math.PI*2);ctx.fill();
        // Edge wetness
        ctx.strokeStyle=`rgba(40,50,40,${0.4*dim})`;
        ctx.lineWidth=Math.max(0.5,pSz*0.06);
        ctx.beginPath();ctx.ellipse(sx,groundY,pSz,pSz*0.25,0,0,Math.PI*2);ctx.stroke();
      }else if(propType<6){
        // V54: Cracked tile — dark crack lines on floor
        const cSz=sz*0.12;
        ctx.strokeStyle=`rgba(10,8,5,${0.5*dim})`;
        ctx.lineWidth=Math.max(0.8,cSz*0.06);
        const crackSeed=seed;
        // Main crack
        ctx.beginPath();
        ctx.moveTo(sx-cSz,groundY);
        ctx.lineTo(sx-cSz*0.3,groundY-cSz*0.05);
        ctx.lineTo(sx+cSz*0.4,groundY+cSz*0.03);
        ctx.lineTo(sx+cSz,groundY);
        ctx.stroke();
        // Branch
        if((crackSeed>>4)&1){
          ctx.lineWidth=Math.max(0.5,cSz*0.04);
          ctx.beginPath();
          ctx.moveTo(sx-cSz*0.3,groundY-cSz*0.05);
          ctx.lineTo(sx-cSz*0.1,groundY-cSz*0.12);
          ctx.stroke();
        }
        // Dark stain around crack
        ctx.fillStyle=`rgba(20,15,10,${0.2*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,cSz*0.8,cSz*0.15,0,0,Math.PI*2);ctx.fill();
      }else if(propType<8){
        // V54: Bone fragment — small white shard on floor (only if very close, V55: tighter dist)
        if(dist<2){
        ctx.fillStyle=`rgba(180,170,150,${0.55*dim})`;
        const bSz=sz*0.05;
        const ba=seed*0.3;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(ba);
        ctx.fillRect(-bSz,-bSz*0.15,bSz*2,bSz*0.3);
        ctx.restore();
        // Shadow under
        ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,bSz*1.2,bSz*0.2,0,0,Math.PI*2);ctx.fill();
        // Smaller fragments
        ctx.fillStyle=`rgba(160,150,130,${0.4*dim})`;
        ctx.beginPath();ctx.arc(sx+bSz*1.5,groundY+bSz*0.3,bSz*0.4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(sx-bSz*1.8,groundY+bSz*0.2,bSz*0.3,0,Math.PI*2);ctx.fill();
        } // V55: only render bone fragments at dist<2
      }else if(propType<10){
        // V54: Rusted grate fragment — only if close enough (V55: tighter dist)
        if(dist<2.5){
        const gSz=sz*0.08;
        ctx.fillStyle=`rgba(40,35,30,${0.7*dim})`;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(seed*0.2);
        ctx.fillRect(-gSz,-gSz*0.4,gSz*2,gSz*0.8);
        ctx.restore();
        // Rust spots
        ctx.fillStyle=`rgba(90,50,20,${0.5*dim})`;
        ctx.beginPath();ctx.arc(sx-gSz*0.3,groundY,gSz*0.25,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(sx+gSz*0.5,groundY-gSz*0.1,gSz*0.2,0,Math.PI*2);ctx.fill();
        // Bar lines
        ctx.strokeStyle=`rgba(70,60,50,${0.5*dim})`;
        ctx.lineWidth=Math.max(0.5,gSz*0.08);
        ctx.beginPath();ctx.moveTo(sx-gSz*0.8,groundY-gSz*0.3);ctx.lineTo(sx-gSz*0.8,groundY+gSz*0.3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx,groundY-gSz*0.3);ctx.lineTo(sx,groundY+gSz*0.3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx+gSz*0.8,groundY-gSz*0.3);ctx.lineTo(sx+gSz*0.8,groundY+gSz*0.3);ctx.stroke();
        } // V55: only render grate at dist<2.5
      }else if(propType<12){
        // V54: Rat droppings — tiny dark pellets
        const dSz=sz*0.015;
        for(let pi=0;pi<6;pi++){
          const pa=seed*(pi+1)*0.7;
          const px3=sx+Math.cos(pa)*sz*0.08;
          const py3=groundY+Math.sin(pa)*sz*0.03;
          ctx.fillStyle=`rgba(20,15,10,${0.7*dim})`;
          ctx.beginPath();ctx.ellipse(px3,py3,dSz,dSz*0.5,pa,0,Math.PI*2);ctx.fill();
        }
      }else if(propType<14){
        // V54: Moss patch — green growth (sewer-appropriate)
        const mossSz=sz*0.14;
        const mossShades=[[30,55,20,0.5],[40,70,25,0.4],[50,85,30,0.35],[60,100,35,0.3]];
        for(let mi=0;mi<5;mi++){
          const ma=seed*(mi+1)*0.5;
          const mr2=mossSz*(0.2+((seed>>mi)&3)*0.12);
          const mx2=sx+Math.cos(ma)*mossSz*0.5;
          const my2=groundY+Math.sin(ma)*mossSz*0.1;
          const ms=mossShades[mi%4];
          ctx.fillStyle=`rgba(${ms[0]},${ms[1]},${ms[2]},${ms[3]*dim})`;
          ctx.beginPath();ctx.ellipse(mx2,my2,mr2,mr2*0.28,ma,0,Math.PI*2);ctx.fill();
        }
      }else if(propType<16){
        // V54: Broken brick — reddish-brown chunk on floor (V55: only if close)
        if(dist<2.5){
        const brSz=sz*0.06;
        ctx.fillStyle=`rgba(100,70,50,${0.65*dim})`;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(seed*0.15);
        ctx.fillRect(-brSz,-brSz*0.4,brSz*1.8,brSz*0.8);
        ctx.restore();
        // Highlight
        ctx.fillStyle=`rgba(130,90,65,${0.35*dim})`;
        ctx.fillRect(sx-brSz*0.5,groundY-brSz*0.3,brSz*0.6,brSz*0.2);
        // Shadow
        ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,brSz*1.2,brSz*0.2,0,0,Math.PI*2);ctx.fill();
        } // V55: only render brick at dist<2.5
      }else if(propType<18){
        // V54: Sludge pool — dark greenish-black viscous liquid (V54l: lower alpha)
        const slSz=sz*0.13;
        ctx.fillStyle=`rgba(15,25,12,${0.5*dim})`; // V54l: was 0.75
        ctx.beginPath();ctx.ellipse(sx,groundY,slSz,slSz*0.22,0,0,Math.PI*2);ctx.fill();
        // Surface sheen
        ctx.fillStyle=`rgba(30,45,20,${0.15*dim*flicker})`; // V54l: was 0.3
        ctx.beginPath();ctx.ellipse(sx-slSz*0.15,groundY-slSz*0.04,slSz*0.5,slSz*0.08,0,0,Math.PI*2);ctx.fill();
        // Bubble
        if(flicker>0.6){
          ctx.fillStyle=`rgba(60,80,35,${0.2*dim})`;
          ctx.beginPath();ctx.arc(sx+slSz*0.3,groundY-slSz*0.06,slSz*0.1,0,Math.PI*2);ctx.fill();
        }
      }else{
        // V54: Pipe drip — water dripping from ceiling pipe (dark spot + ripple)
        const drSz=sz*0.06;
        // Dark wet patch on floor
        ctx.fillStyle=`rgba(20,25,30,${0.6*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,drSz,drSz*0.2,0,0,Math.PI*2);ctx.fill();
        // V55: Only draw ripple and drip if close enough to be identifiable
        if(dist<2.5){
          // Ripple rings
          ctx.strokeStyle=`rgba(40,45,50,${0.25*dim*flicker})`;
          ctx.lineWidth=Math.max(0.5,drSz*0.05);
          ctx.beginPath();ctx.ellipse(sx,groundY,drSz*0.7,drSz*0.15,0,0,Math.PI*2);ctx.stroke();
          // Drip from above
          const dripY=groundY-sz*0.25*(1-flicker);
          ctx.fillStyle=`rgba(50,55,60,${0.45*dim})`;
          ctx.beginPath();ctx.ellipse(sx,dripY,drSz*0.12,drSz*0.25,0,0,Math.PI*2);ctx.fill();
        }
      }
    } // dx
  } // dy
  } // propPasses pass
}

// Draw entities (monsters/chests/boss) in the first-person corridor
function drawCorridorEntities(t,dir,fov,horizonY,maxDist){
  const ents=[];
  // Monsters
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const mx2=Math.floor(m.x),my2=Math.floor(m.y);
    if(!G.explored[my2]||!G.explored[my2][mx2])continue;
    const dx=m.x-G.px,dy=m.y-G.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist)continue;
    const angle=Math.atan2(dy,dx)-dir;
    let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
    if(Math.abs(na)>fov/2+0.3)continue;
    ents.push({type:'mon',m,x:m.x,y:m.y,dist,angle:na,scaleX:Math.cos(na)});
  }
  // Chests
  for(const c of G.mapChests){
    if(c.opened)continue;
    if(!G.explored[c.y]||!G.explored[c.y][c.x])continue;
    const cx2=c.x+0.5,cy2=c.y+0.5;
    const dx=cx2-G.px,dy=cy2-G.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist)continue;
    const angle=Math.atan2(dy,dx)-dir;
    let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
    if(Math.abs(na)>fov/2+0.3)continue;
    ents.push({type:'chest',x:cx2,y:cy2,dist,angle:na,scaleX:Math.cos(na)});
  }
  // Boss
  if(!G.bossFed){
    const bx=G.mapW-2+0.5,by=G.mapH-2+0.5;
    const mbx=Math.floor(bx),mby=Math.floor(by);
    if(G.explored[mby]&&G.explored[mby][mbx]){
      const dx=bx-G.px,dy=by-G.py;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=maxDist){
        const angle=Math.atan2(dy,dx)-dir;
        let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
        if(Math.abs(na)<=fov/2+0.3){
          ents.push({type:'boss',x:bx,y:by,dist,angle:na,scaleX:Math.cos(na)});
        }
      }
    }
  }
  // Sort by distance (far to near)
  ents.sort((a,b)=>b.dist-a.dist);

  for(const e of ents){
    const screenT=(e.angle/(fov/2)+1)/2; // 0=left,1=right
    const sx=lerp(W*0.38,W*0.62,screenT);
    const scale=Math.max(0.1,1/(e.dist*0.6+0.3));
    const sz=H*0.3*scale;
    const bob=Math.sin(t*0.004+e.x*3)*1.5*scale; // V55: reduced from 3 to 1.5 for less floating
    const dim=Math.min(1,4/(e.dist+0.5));

    // V55: Shadow on floor — at entity's feet, stays on ground (no bob)
    const esz=(e.type==='boss')?sz*1.5:sz;
    const shAlpha=Math.min(0.45,0.35*dim);
    ctx.fillStyle=`rgba(0,0,0,${shAlpha})`;
    ctx.beginPath();ctx.ellipse(sx,horizonY+esz*0.45,esz*0.30,Math.max(2,esz*0.06),0,0,Math.PI*2);ctx.fill();

    if(e.type==='chest'){
      const img=getImg('chest');
      if(img&&img.complete&&img.naturalWidth>0){
        ctx.globalAlpha=0.7+dim*0.3;
        ctx.drawImage(img,sx-sz*0.4,horizonY-sz*0.3+bob,sz*0.8,sz*0.8);
        ctx.globalAlpha=1;
      }
      if(e.dist<3)dt('宝箱',sx,horizonY-sz*0.35+bob,9*scale+5,'#fa0','center','bold');
    }else if(e.type==='mon'){
      const m=e.m;
      const ed=EDEF[m.key];if(!ed)continue;
      const img=getImg(ed.ico);
      // V55: dynamically compute sprite bottom-transparent padding for proper grounding
      let botPad=0.17; // fallback
      if(img&&img.complete&&img.naturalWidth>0){
        if(!img._botPad){
          const tc=document.createElement('canvas');tc.width=img.naturalWidth;tc.height=img.naturalHeight;
          const tx=tc.getContext('2d');tx.drawImage(img,0,0);
          const d=tx.getImageData(0,0,tc.width,tc.height).data;
          let ly=0;
          for(let yy=tc.height-1;yy>=0;yy--){let f=false;for(let xx=0;xx<tc.width;xx++){if(d[(yy*tc.width+xx)*4+3]>30){ly=yy;f=true;break;}}if(f)break;}
          img._botPad=(tc.height-1-ly)/tc.height;
        }
        botPad=img._botPad;
      }
      const eY=horizonY-sz*(0.55-botPad)+bob; // V55: visible bottom sinks into shadow, ~45% overlap
      if(img&&img.complete&&img.naturalWidth>0){
        ctx.globalAlpha=0.55+dim*0.45;
        ctx.drawImage(img,sx-sz/2,eY,sz,sz);
        ctx.globalAlpha=1;
        // V50: Environment light tint — warm overlay on monster to blend with dungeon
        ctx.save();
        ctx.globalCompositeOperation='overlay';
        const warmth=Math.max(0,1-e.dist/7);
        ctx.fillStyle=`rgba(120,70,30,${0.30*dim*warmth})`;
        ctx.fillRect(sx-sz/2,eY,sz,sz);
        // Dark overlay for distant monsters
        if(e.dist>4){
          ctx.fillStyle=`rgba(15,10,8,${Math.min(0.4,(e.dist-4)*0.1)*dim})`;
          ctx.fillRect(sx-sz/2,eY,sz,sz);
        }
        ctx.restore();
        // Warm rim light from torch
        ctx.save();
        ctx.globalCompositeOperation='lighter';
        const rimGrad=ctx.createRadialGradient(sx,horizonY+bob,sz*0.3,sx,horizonY+bob,sz*0.6);
        rimGrad.addColorStop(0,'rgba(0,0,0,0)');
        rimGrad.addColorStop(0.7,`rgba(180,100,40,${0.08*dim})`);
        rimGrad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=rimGrad;
        ctx.fillRect(sx-sz/2,eY,sz,sz);
        ctx.restore();
      }
      if(e.dist<4){
        dt(ed.n,sx,eY-sz*0.05,Math.max(9,9*scale+4),m.isElite?'#f80':'#ccc','center','bold');
        if(e.dist<2.5){
          dt('!',sx,eY-sz*0.2,20*scale+10,'#ff0','center','bold');
        }
      }
      if(m.isElite){
        ctx.fillStyle='#f80';
        ctx.beginPath();ctx.arc(sx+sz*0.25,eY,4*scale,0,Math.PI*2);ctx.fill();
      }
    }else if(e.type==='boss'){
      const ed=EDEF[G.bossDishKey];
      const img=getImg(ed?ed.ico:null);
      const bsz=sz*1.5;
      // V55: dynamic bottom-padding for boss too
      let bBotPad=0.17;
      if(img&&img.complete&&img.naturalWidth>0){
        if(!img._botPad){
          const tc=document.createElement('canvas');tc.width=img.naturalWidth;tc.height=img.naturalHeight;
          const tx=tc.getContext('2d');tx.drawImage(img,0,0);
          const d=tx.getImageData(0,0,tc.width,tc.height).data;
          let ly=0;
          for(let yy=tc.height-1;yy>=0;yy--){let f=false;for(let xx=0;xx<tc.width;xx++){if(d[(yy*tc.width+xx)*4+3]>30){ly=yy;f=true;break;}}if(f)break;}
          img._botPad=(tc.height-1-ly)/tc.height;
        }
        bBotPad=img._botPad;
      }
      const bY=horizonY-bsz*(0.55-bBotPad)+bob; // V55: visible bottom sinks into shadow
      if(img&&img.complete&&img.naturalWidth>0){
        ctx.globalAlpha=0.65+dim*0.35;
        ctx.drawImage(img,sx-bsz/2,bY,bsz,bsz);
        ctx.globalAlpha=1;
        // V50: Environment tint on boss too
        ctx.save();
        ctx.globalCompositeOperation='overlay';
        const warmth=Math.max(0,1-e.dist/7);
        ctx.fillStyle=`rgba(100,60,25,${0.28*dim*warmth})`;
        ctx.fillRect(sx-bsz/2,bY,bsz,bsz);
        ctx.restore();
      }
      if(e.dist<5){
        dt(ed?ed.n:'Boss',sx,bY-bsz*0.05,12*scale+4,G.bossDefeated?'#fa0':'#f44','center','bold');
      }
    }
  }
}
// ================================================================
//  PLAYER MOVEMENT (first-person controls)
// ================================================================
function updateMovement(dt){
  if(G.state!=='explore')return;
  const spd=2.8;
  const turnSpd=2.5; // radians per second
  let forward=0,turn=0,strafe=0;
  
  // Keyboard: W/Up=forward, S/Down=back, A/Left=turn left, D/Right=turn right
  if(keys['w']||keys['ArrowUp'])forward+=1;
  if(keys['s']||keys['ArrowDown'])forward-=1;
  if(keys['a']||keys['ArrowLeft'])turn-=1;
  if(keys['d']||keys['ArrowRight'])turn+=1;
  
  // Joystick: up=forward, left/right=turn, diagonal=forward+turn
  if(G.joystick.active){
    const dx=G.joystick.cx-G.joystick.sx;
    const dy=G.joystick.cy-G.joystick.sy;
    const mag=Math.sqrt(dx*dx+dy*dy);
    if(mag>5){
      const nx=dx/mag, ny=dy/mag;
      // ny<0 (up) = forward, ny>0 (down) = backward
      forward+=-ny;
      // nx<0 (left) = turn left, nx>0 (right) = turn right
      turn+=nx;
    }
  }
  
  // Apply turning
  if(Math.abs(turn)>0.01){
    G.pdir+=turn*turnSpd*dt;
  }
  
  // Apply forward/backward movement
  if(Math.abs(forward)>0.05){
    const mvX=Math.cos(G.pdir)*Math.sign(forward);
    const mvY=Math.sin(G.pdir)*Math.sign(forward);
    const moveAmt=Math.abs(forward)*spd*dt;
    const margin=0.2; // V52: slightly smaller margin (was 0.25)
    const nx=G.px+mvX*moveAmt;
    const ny=G.py+mvY*moveAmt;
    // V52: Improved collision — try full move, then slide on each axis, then diagonal check
    if(!isWall(nx+mvX*margin,ny+mvY*margin)){
      // Full move is clear — go for it
      G.px=nx;G.py=ny;
    }else{
      // Try sliding on X only
      if(!isWall(nx+mvX*margin,G.py))G.px=nx;
      // Try sliding on Y only
      if(!isWall(G.px,ny+mvY*margin))G.py=ny;
    }
    
    // Footstep sound
    G.stepTimer+=dt;
    if(G.stepTimer>0.4){G.stepTimer=0;S.step()}
    
    // Reveal fog of war around player
    revealFog();
  }
}

function revealFog(){
  const radius=4; // Increased from 3 to 4 for better visibility
  const px2=Math.floor(G.px),py2=Math.floor(G.py);
  for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
    const x=px2+dx,y=py2+dy;
    if(x>=0&&x<G.mapW&&y>=0&&y<G.mapH){
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=radius)G.explored[y][x]=true;
    }
  }
}

function updateMapMons(dt){
  if(G.state!=='explore')return;
  for(const m of G.mapMons){
    if(!m.alive)continue;
    // Wander randomly
    m.dir+=rand(-0.5,0.5)*dt;
    const spd=m.isElite?0.3:0.5;
    const nx=m.x+Math.cos(m.dir)*spd*dt;
    const ny=m.y+Math.sin(m.dir)*spd*dt;
    
    // V15: Check open directions — if monster is in a dead-end (3+ walls around),
    // force it to turn toward the open direction
    const mx2=Math.floor(m.x),my2=Math.floor(m.y);
    const openDirs=[];
    const dirChecks=[[0,-1,0],[1,0,Math.PI/2],[0,1,Math.PI],[-1,0,-Math.PI/2]];
    for(const[dx,dy,da]of dirChecks){
      const tx=mx2+dx,ty=my2+dy;
      if(tx>=0&&tx<G.mapW&&ty>=0&&ty<G.mapH&&G.map[ty][tx]!==1){
        openDirs.push(da);
      }
    }
    // If in dead-end (only 1 open direction or less), force turn
    if(openDirs.length<=1 && openDirs.length>0){
      m.dir=openDirs[0];
    }
    
    // V15: Use larger collision margin to prevent getting stuck in wall corners
    const margin=0.35;
    const checkX=nx+Math.cos(m.dir)*margin;
    const checkY=ny+Math.sin(m.dir)*margin;
    if(!isWall(checkX,m.y)&&!isWall(nx,m.y))m.x=nx;
    if(!isWall(m.x,checkY)&&!isWall(m.x,ny))m.y=ny;
    
    // Keep in bounds
    m.x=clamp(m.x,0.5,G.mapW-0.5);
    m.y=clamp(m.y,0.5,G.mapH-0.5);
    
    // Elite monsters chase player if close
    if(m.isElite){
      const dx=G.px-m.x,dy=G.py-m.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<3){m.dir=Math.atan2(dy,dx)}
    }
  }
}

function checkEncounters(){
  if(G.state!=='explore')return;
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const dx=m.x-G.px,dy=m.y-G.py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<0.5){
      // Trigger combat!
      startEncounter(m);
      return;
    }
  }
  // Boss encounter
  if(!G.bossFed){
    const bx=G.mapW-2+0.5,by=G.mapH-2+0.5;
    const d=Math.sqrt((bx-G.px)**2+(by-G.py)**2);
    if(d<1.0){
      startBossEncounter();
    }
  }
}

function checkChests(){
  if(G.state!=='explore')return;
  for(const c of G.mapChests){
    if(c.opened)continue;
    const dx=c.x+0.5-G.px,dy=c.y+0.5-G.py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<0.8){
      c.opened=true;
      G.player.gold+=c.gold;
      showMsg('宝箱! 获得 '+c.gold+' 金币',90);
      S.bell();
      // Chance to drop ingredient
      if(Math.random()<0.5){
        const f=FLOORS[G.floor];
        const ingKey=EDEF[pick(f.pool)].drop;
        const ing=ING[ingKey];
        if(ing){G.ings.push(ingKey);showMsg('宝箱! '+c.gold+'金 + '+ing.n+'!',90)}
      }
    }
  }
}

function startEncounter(m){
  m.alive=false;
  S.combat();
  const ed=EDEF[m.key];
  G.enemies=[mkEnemy(m.key,G.floor)];
  if(G.floor>=1&&!ed.boss&&Math.random()<0.3)
    G.enemies.push(mkEnemy(pick(FLOORS[G.floor].pool),G.floor));
  G.drawPile=G.runDeck.slice();shuf(G.drawPile);G.hand=[];G.discard=[];
  G.player.block=0;G.player.poison=0;G.player.burnDot=0;G.riposteDmg=0;G.fortifyStack=0;
  drawHand(5);G.player.energy=G.player.maxE;G.turn='p';G.state='battle';G.sel=-1;
  G.cookedThisTurn=0;G.cookEatenThisTurn=0;G.player.tempStr=0;
  showMsg('遭遇战: '+ed.n+'!',60);
}

function startBossEncounter(){
  if(G.bossFed){enterFloor(G.floor+1);return}
  if(G.bossDefeated){
    G.state='bossAsk';showMsg('再次挑战 '+EDEF[G.bossDishKey].n+'?',60);return;
  }
  const ed=EDEF[G.bossDishKey];
  G.enemies=[mkEnemy(G.bossDishKey,G.floor)];G.lastBossKey=G.bossDishKey;
  G.drawPile=G.runDeck.slice();shuf(G.drawPile);G.hand=[];G.discard=[];
  G.player.block=0;G.player.poison=0;G.player.burnDot=0;G.riposteDmg=0;G.fortifyStack=0;
  drawHand(5);G.player.energy=G.player.maxE;G.turn='p';G.state='battle';G.sel=-1;
  G.cookedThisTurn=0;G.cookEatenThisTurn=0;G.player.tempStr=0;
  showMsg('Boss战: '+ed.n+'!',60);
}

// ================================================================
//  BATTLE (preserved from V4, adapted)
// ================================================================
function mkEnemy(key,floor){
  const d=EDEF[key];const fs=floor!=null?floor:G.floor;
  const hpMul=1+fs*0.12;const aMul=1+fs*0.08;
  const hp=Math.floor(d.hp*hpMul);const a=Math.floor(d.a*aMul);
  return{...d,key,hp,maxHp:hp,burn:0,poisonDmg:0,intent:a,dead:false,baseA:a,hitCount:0,enraged:false,isElite:G._encounterElite||false}
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function drawHand(n){for(let i=0;i<n;i++){if(G.drawPile.length===0){if(G.discard.length===0)break;G.drawPile=G.discard.slice();G.discard=[];shuf(G.drawPile)}G.hand.push(G.drawPile.shift());S.draw()}}
function addLog(m){G.log=(G.log||[]).slice(-2);G.log.push(m)}

function playCard(hi,ei){
  if(G.turn!=='p'||G.state!=='battle')return;
  const id=G.hand[hi];if(!id)return;const c=CARDS[id];if(!c)return;
  if(G.player.energy<c.c)return;
  G.player.energy-=c.c;S.play();
  if(c.t==='atk'){
    const hits=c.hits||1;const totalStr=G.player.str+G.player.tempStr;
    for(let h=0;h<hits;h++){
      if(c.aoe)G.enemies.forEach(e=>{if(!e.dead){dmgEnemy(e,c.v+totalStr,c.v);S.hit()}});
      else{const alive=G.enemies.filter(e=>!e.dead);let tgt;if(alive.length===1)tgt=alive[0];else{const e=G.enemies[ei];if(!e||e.dead)break;tgt=e}dmgEnemy(tgt,c.v+totalStr,c.v);S.hit()}
      G.combo++;G.comboT=60;if(G.combo>1){fT(W/2,H*.22,COMBO_NAMES[Math.min(G.combo,10)]||'连击!','#ff0',26);S.hit()}
    }
  }else if(c.t==='def'){G.player.block+=c.v;S.def();fT(W*.5,H*.4,'+'+c.v,'#5c8');if(c.riposte)G.riposteDmg=c.riposte}
  if(c.draw)drawHand(c.draw);
  if(c.gainE)G.player.energy=Math.min(G.player.maxE,G.player.energy+c.gainE);
  if(c.burn&&G.enemies[ei])G.enemies[ei].burn+=c.burn;
  if(c.poison){const tgt=G.enemies[ei]||G.enemies.filter(e=>!e.dead)[0];if(tgt)tgt.poisonDmg=(tgt.poisonDmg||0)+c.poison}
  if(c.fortify)G.fortifyStack=c.fortify;
  G.discard.push(G.hand.splice(hi,1)[0]);G.sel=-1;
  if(G.pet&&G.pet.hp>0&&G.state==='battle')setTimeout(()=>petAttack(),200);
  const alive=G.enemies.filter(e=>!e.dead);if(alive.length===0)onClear(G.enemies.some(e=>e.boss));
}

function dmgEnemy(e,amt,baseAtk){
  if(e.phase&&Math.random()<0.25){const idx=G.enemies.indexOf(e);fT(W/2,H*.3,'闪避!','#aaf',18);S.def();return}
  if(e.hp/e.maxHp<0.3&&baseAtk>=15){amt=Math.floor(amt*1.5);fT(W/2,H*.25,'处决!','#f00',16)}
  if(e.boss){const cap=(baseAtk||amt)*BOSS_DMG_CAP+15;if(amt>cap){amt=cap}}
  e.hp-=amt;const idx=G.enemies.indexOf(e);
  pS(W/2,H*.35,'#f44',6);fT(W/2,H*.3,'-'+amt,'#f44',20);FX.shake=Math.max(FX.shake,4);
  if(e.enrage&&!e.enraged){e.hitCount++;if(e.hitCount>=e.enrage){e.enraged=true;e.baseA=Math.floor(e.baseA*1.5);e.intent=e.baseA;fT(W/2,H*.2,'狂暴!','#f00',24)}}
  if(e.hp<=0){e.dead=true;e.hp=0;S.kill();pS(W/2,H*.35,'#fa0',16);if(!G.meta.seenMobs.includes(e.key))G.meta.seenMobs.push(e.key);onKill(e)}
}

function onKill(e){
  if(e.drop){G.ings.push(e.drop);showMsg('掉落: '+ING[e.drop].n,60)}
  if(!e.boss&&Math.random()<.25){const s=pick(Object.keys(SEASONS));G.seasons.push(s);showMsg('调味料: '+SEASONS[s].n,60)}
  G.player.gold+=e.boss?30:5;
  if(e.boss){
    G.bossDefeated=true;G.lastWasBoss=true;G.lastBossKey=e.key;
    if(!G.meta.seenBoss.includes(e.key))G.meta.seenBoss.push(e.key);
    S.bell();if(!G.meta.seenRecipes.includes(e.drop))G.meta.seenRecipes.push(e.drop);save();
  }
  setTimeout(()=>{G.enemies=G.enemies.filter(en=>!en.dead);if(G.enemies.length===0&&G.state==='battle')onClear(G.lastWasBoss);G.lastWasBoss=false},600);
}

function onClear(wasBoss){
  if(G.state!=='battle')return;
  if(wasBoss){if(!G.bossFirstKill){G.bossFirstKill=true;G.state='bossStory';S.bell()}else{G.state='bossAsk';S.bell()}return}

function startCook(){

  G.cook={ingIdx:null,ptr:0,dir:1,spd:0.008+G.floor*.0014,started:false,ready:false,seasonSel:-1};

function finishCook(){
  if(!G.cook||G.cook.ingIdx===null)return;
  const p=G.cook.ptr;let q;
  if(p<.2||p>.8){q='burn';S.cookB()}else if(p<.4||p>.6){q='good';S.cookG()}else{q='perfect';S.cookP()}
  const ingId=G.ings[G.cook.ingIdx];const ing=ING[ingId];const dish={...ing.dish,quality:q,ingId};
  if(q==='perfect')dish.h=Math.floor(dish.h*2);else if(q==='burn')dish.h=Math.floor(dish.h*.4);
  if(G.cook.seasonSel>=0&&G.cook.seasonSel<G.seasons.length){
    const sKey=G.seasons[G.cook.seasonSel];dish.season=sKey;dish.n=ing.dish.n+'('+SEASONS[sKey].n+')';
    if(sKey==='salt')dish.h+=3;else if(sKey==='pepper'){dish.burn=2;dish.h+=1}else if(sKey==='sugar')dish.h+=5;
    G.seasons.splice(G.cook.seasonSel,1);
  }
  if(!G.meta.seenRecipes.includes(ingId))G.meta.seenRecipes.push(ingId);
  G.dishes.push(dish);G.ings.splice(G.cook.ingIdx,1);
  showMsg((q==='perfect'?'完美':q==='good'?'合格':'糊了')+'! '+ing.dish.n,90);
  if(G.prevState==='battle')G.cookedThisTurn++;
  G.cook=null;G.state=G.prevState||'explore';
}
function eatDish(){
  if(G.dishes.length===0)return;
  if(G.state==='battle'&&(G.cookEatenThisTurn||0)>=EAT_PER_TURN){showMsg('本轮已吃过了!',60);return}
  G.cookEatenThisTurn++;
  const d=G.dishes.shift();const heal=Math.min(MAX_HEAL,d.h);
  G.player.hp=Math.min(G.player.maxHp,G.player.hp+heal);S.eat();fT(W*.3,H*.4,'+'+heal,'#5c8');
  if(d.b)applyBuff(d);
}
