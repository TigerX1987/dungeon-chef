<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1.0,user-scalable=no">
<title>地牢厨魂 Dungeon Chef</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0A;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%}
/* V99: Professional splash screen with brand identity */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#1a0a0a 0%,#0A0A0A 60%,#000 100%);z-index:10}
#splash .logo{font-family:'Impact','Arial Black',sans-serif;font-size:42px;font-weight:900;
  letter-spacing:4px;color:#CFB53B;text-shadow:0 0 20px rgba(204,0,0,.5),0 2px 8px rgba(0,0,0,.8);
  margin-bottom:6px;animation:glow 2s ease-in-out infinite alternate}
#splash .sub{font-family:'Segoe UI',sans-serif;font-size:14px;color:#666;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:40px}
#splash .bar-wrap{width:70%;max-width:260px;height:4px;background:rgba(50,30,15,.5);
  border-radius:2px;overflow:hidden;border:1px solid rgba(207,181,59,.15)}
#splash .bar{height:100%;width:0%;background:linear-gradient(90deg,#CC0000,#CFB53B);
  border-radius:2px;transition:width .15s ease}
#splash .pct{margin-top:12px;font-size:11px;color:#CFB53B;font-family:'Courier New',monospace;
  letter-spacing:2px;opacity:.7}
#splash .tip{position:absolute;bottom:40px;font-size:11px;color:#444;
  letter-spacing:1px;text-align:center;width:80%}
#splash .brand{position:absolute;top:20px;font-size:10px;color:#333;letter-spacing:2px}
@keyframes glow{from{text-shadow:0 0 15px rgba(204,0,0,.3),0 2px 8px rgba(0,0,0,.8)}
  to{text-shadow:0 0 25px rgba(204,0,0,.6),0 0 40px rgba(207,181,59,.3),0 2px 8px rgba(0,0,0,.8)}}
</style>
</head>

  <div class="sub">A Dungeon Culinary Roguelike</div>
  <div class="bar-wrap"><div class="bar" id="ldBar"></div></div>
  <div class="pct" id="ldPct">0%</div>

function getImg(n){if(!IMG_SRC[n])return null;if(IMG_CACHE[n])return IMG_CACHE[n];const i=new Image();i.src=IMG_SRC[n];IMG_CACHE[n]=i;return i}

// ---- Sprite images (small base64, load fast) ----
const _handTorch=new Image();_handTorch.onload=_onResLoad;_handTorch.src=IMG_SRC['_handTorch']||'';
const _handDagger=new Image();_handDagger.onload=_onResLoad;_handDagger.src=IMG_SRC['_handDagger']||'';
const _fireStrip=new Image();_fireStrip.onload=_onResLoad;_fireStrip.src=IMG_SRC['_fireStrip']||'';

// ================================================================
// V99: PROCEDURAL TEXTURE GENERATION — replaces 2.9MB base64 images
// Generates sewer/dungeon textures at runtime in <100ms total
// ================================================================
var _wallTex, _floorTex, _ceilTex;
var _texReady=false;

function _genTextures(){
  _setPct(20,_ldTips[1]); // 点燃火把...

  // ---- WALL TEXTURE (128x128) — V102: cold purple-grey stone bricks ----
  var wCv=document.createElement('canvas'); wCv.width=128; wCv.height=128;
  var wc=wCv.getContext('2d');
  // Base: cold purple-grey stone — V102b: brighter for visibility
  wc.fillStyle='#3a3540'; wc.fillRect(0,0,128,128);
  // Brick pattern — larger, rougher stones
  for(var row=0;row<7;row++){
    var yOff=row*18; var offset=(row%2)*36;
    for(var col=0;col<5;col++){
      var xOff=col*36+offset-36;
      var bv=48+Math.random()*22;
      // Purple-grey brick: B>R for cold tone
      var r=Math.floor(bv*0.82+Math.random()*6);
      var g=Math.floor(bv*0.80+Math.random()*5);
      var b=Math.floor(bv*1.05+Math.random()*10);
      wc.fillStyle='rgb('+r+','+g+','+b+')';
      wc.fillRect(xOff+2,yOff+2,32,14);
      // Highlight top edge (catches torch light)
      wc.fillStyle='rgba(95,90,105,0.25)';
      wc.fillRect(xOff+2,yOff+2,32,2);
      // Mortar line (dark purple-grey)
      wc.fillStyle='rgba(14,12,18,.85)';
      wc.fillRect(xOff,yOff,36,2);
      wc.fillRect(xOff,yOff,2,18);
    }
  }
  // Damp patches — dark purple-grey, NOT green
  for(var mi=0;mi<35;mi++){
    var mx2=Math.random()*128, my2=Math.random()*128;
    var mr=2+Math.random()*6;
    var dampR=Math.floor(20+Math.random()*15);
    var dampG=Math.floor(18+Math.random()*12);
    var dampB=Math.floor(25+Math.random()*15);
    wc.fillStyle='rgba('+dampR+','+dampG+','+dampB+','+(0.15+Math.random()*0.25).toFixed(2)+')';
    wc.beginPath(); wc.arc(mx2,my2,mr,0,Math.PI*2); wc.fill();
  }
  // Cracks — dark
  for(var ci=0;ci<10;ci++){
    wc.strokeStyle='rgba(5,4,8,'+(0.2+Math.random()*0.3).toFixed(2)+')';
    wc.lineWidth=0.5+Math.random();
    wc.beginPath();
    var cx=Math.random()*128, cy=Math.random()*128;
    wc.moveTo(cx,cy);
    for(var s=0;s<3;s++){cx+=Math.random()*12-6;cy+=Math.random()*8;wc.lineTo(cx,cy);}
    wc.stroke();
  }
  // Grime streaks — dark purple-brown vertical water stain
  for(var gi=0;gi<5;gi++){
    var gx=Math.random()*128;
    wc.fillStyle='rgba(10,8,14,.12)';
    wc.fillRect(gx,0,3+Math.random()*5,128);
  }
  _wallTex=wCv;

  _setPct(50,_ldTips[3]); // 布置鼠穴下水道...

  // ---- FLOOR TEXTURE (128x128) — V102: dark grey stone slab + red-brown rubble ----
  var fCv=document.createElement('canvas'); fCv.width=128; fCv.height=128;
  var fc=fCv.getContext('2d');
  // Base dark grey stone
  fc.fillStyle='#1e1d22'; fc.fillRect(0,0,128,128);
  // Stone tiles — larger irregular slabs
  for(var ti=0;ti<14;ti++){
    var tx2=Math.random()*118, ty2=Math.random()*118;
    var tw2=14+Math.random()*28, th2=10+Math.random()*20;
    var tv=28+Math.random()*18;
    var fr=Math.floor(tv*0.82+Math.random()*6);
    var fg=Math.floor(tv*0.78+Math.random()*5);
    var fb=Math.floor(tv*0.88+Math.random()*8);
    fc.fillStyle='rgb('+fr+','+fg+','+fb+')';
    fc.fillRect(tx2,ty2,tw2,th2);
    fc.strokeStyle='rgba(6,5,8,.55)'; fc.lineWidth=1;
    fc.strokeRect(tx2,ty2,tw2,th2);
  }
  // Puddles — dark cold grey-blue, not green
  for(var pi=0;pi<10;pi++){
    var px2=Math.random()*128, py2=Math.random()*128;
    var pr=3+Math.random()*8;
    fc.fillStyle='rgba('+Math.floor(15+Math.random()*10)+','+Math.floor(16+Math.random()*10)+','+Math.floor(22+Math.random()*12)+',0.4)';
    fc.beginPath(); fc.ellipse(px2,py2,pr,pr*0.6,0,0,Math.PI*2); fc.fill();
    fc.fillStyle='rgba(60,65,80,.08)';
    fc.beginPath(); fc.ellipse(px2-pr*0.2,py2-pr*0.2,pr*0.4,pr*0.3,0,0,Math.PI*2); fc.fill();
  }
  // Scattered red-brown rubble dots (not green moss)
  for(var di=0;di<35;di++){
    var rbr=Math.floor(45+Math.random()*25);
    var rbg=Math.floor(28+Math.random()*15);
    var rbb=Math.floor(18+Math.random()*10);
    fc.fillStyle='rgba('+rbr+','+rbg+','+rbb+',0.3)';
    fc.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*2,1+Math.random()*2);
  }
  _floorTex=fCv;

  _setPct(75,_ldTips[4]); // 唤醒地牢怪物...

  // ---- CEILING TEXTURE (128x128) — V102: natural dark rock vault ----
  var cCv=document.createElement('canvas'); cCv.width=128; cCv.height=128;
  var cc=cCv.getContext('2d');
  // Base: very dark purple-grey rock — V102b: brighter
  cc.fillStyle='#1e1b24'; cc.fillRect(0,0,128,128);
  // Rough rock slabs
  for(var si=0;si<14;si++){
    var sx2=Math.random()*118, sy2=Math.random()*118;
    var sw=15+Math.random()*30, sh=10+Math.random()*20;
    var sv=28+Math.random()*14;
    var sr=Math.floor(sv*0.78+Math.random()*5);
    var sg=Math.floor(sv*0.76+Math.random()*4);
    var sb=Math.floor(sv*0.98+Math.random()*8);
    cc.fillStyle='rgb('+sr+','+sg+','+sb+')';
    cc.fillRect(sx2,sy2,sw,sh);
    cc.strokeStyle='rgba(5,4,8,.45)'; cc.lineWidth=0.5;
    cc.strokeRect(sx2,sy2,sw,sh);
  }
  // Dark hanging roots — desaturated brown, NOT green
  for(var ri=0;ri<5;ri++){
    var rx=Math.random()*128;
    cc.strokeStyle='rgba(35,28,30,0.3)';
    cc.lineWidth=1+Math.random()*2;
    cc.beginPath(); cc.moveTo(rx,0);
    var ry2=0;
    for(var rv=0;rv<4;rv++){rx+=Math.random()*8-4;ry2+=10+Math.random()*15;cc.lineTo(rx,ry2);}
    cc.stroke();
  }
  // Water stains — dark cold streaks
  for(var wi=0;wi<8;wi++){
    cc.fillStyle='rgba(8,7,12,'+(0.05+Math.random()*0.1).toFixed(2)+')';
    var wx2=10+Math.random()*108;
    cc.fillRect(wx2,0,2+Math.random()*6,40+Math.random()*88);
  }
  // Rusted pipes (horizontal)

// Parse card ID like "strike+2" → {base:'strike', lv:2}
function parseCardId(id){
  const parts=id.split('+');
  return{base:parts[0],lv:parts[1]?parseInt(parts[1]):0};
}
// Get effective card info with upgrade bonus applied
function getCardInfo(id){
  const p=parseCardId(id);
  const base=CARDS[p.base];if(!base)return null;
  if(p.lv===0)return base;
  const bonus=base.t==='atk'?UPGRADE_BONUS.atk*p.lv:UPGRADE_BONUS.def*p.lv;
  return{...base,v:base.v+bonus,d:base.d+' +'+p.lv,n:base.n+(p.lv>0?'+'+p.lv:'')};
}

// ================================================================
//  MAP GENERATION (grid-based dungeon)
// ================================================================
function genMap(floorIdx){
  if(floorIdx>=FLOORS.length)return null;
  const f=FLOORS[floorIdx];
  const w=12,h=12;
  const m=[];
  for(let y=0;y<h;y++){m[y]=[];for(let x=0;x<w;x++)m[y][x]=1} // all walls
  
  // V103: Simplified wide map — L-shaped main corridor, 3 tiles wide
  // 1. East corridor (rows 1-3, cols 0-8) — 3 wide
  for(let y=1;y<=3;y++)for(let x=0;x<=8;x++)m[y][x]=0;
  // 2. South corridor (cols 5-7, rows 0-9) — 3 wide
  for(let y=0;y<=9;y++)for(let x=5;x<=7;x++)m[y][x]=0;
  // 3. Boss room (cols 7-10, rows 8-10) — 4x3 open
  for(let y=8;y<=10;y++)for(let x=7;x<=10;x++)m[y][x]=0;
  // 4. Start area (3x3 at top-left)
  for(let y=0;y<=2;y++)for(let x=0;x<=2;x++)m[y][x]=0;
  
  // Place boss room at far corner
  const bx=w-2,by=h-2;
  m[by][bx]=2; // boss marker
  
  // BFS flood-fill from start (1,1) to find all reachable tiles
  const reachable=new Set();
  const queue=[[1,1]];
  reachable.add('1,1');
  while(queue.length){
    const [qx,qy]=queue.shift();
    for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx2=qx+ddx,ny2=qy+ddy;
      const key2=ny2+','+nx2;
      if(nx2<0||nx2>=w||ny2<0||ny2>=h)continue;
      if(reachable.has(key2))continue;
      if(m[ny2][nx2]===1)continue; // wall
      reachable.add(key2);
      queue.push([nx2,ny2]);
    }
  }
  // Wall off any unreachable floor tiles (fixes air-wall issue)
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x]===0&&!reachable.has(y+','+x))m[y][x]=1;
  }

  // Find open REACHABLE positions for monsters and chests
  // V15: Only use positions with at least 2 open neighbors (not dead-ends)
  const opens=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x]===0){
      // Count open neighbors
      let openCount=0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx2=x+dx,ny2=y+dy;
        if(nx2>=0&&nx2<w&&ny2>=0&&ny2<h&&m[ny2][nx2]!==1)openCount++;
      }
      // Only add tiles with 2+ open neighbors (corridor or room, not dead-end)
      if(openCount>=2)opens.push([x,y]);
    }
  }
  
  // Place monsters (normal wandering)
  const mons=[];
  const monCount=Math.min(f.rooms,opens.length-5);
  for(let i=0;i<monCount;i++){
    const idx=ri(3,opens.length-1);
    const [mx2,my2]=opens[idx];
    // Keep monsters at least 4 tiles from start position (1.5,1.5)
    const distFromStart=Math.sqrt((mx2-1.5)**2+(my2-1.5)**2);
    if(distFromStart<4)continue; // not too close to start
    const key=pick(f.pool);
    mons.push({x:mx2+0.5,y:my2+0.5,key,dir:rand(0,Math.PI*2),alive:true,isElite:false});
  }
  // Place 1-2 elite monsters
  if(f.elite){
    const eCount=Math.min(f.elite.length,2);
    for(let i=0;i<eCount;i++){
      const idx=ri(opens.length/2|0,opens.length-1);
      const [mx2,my2]=opens[idx];
      mons.push({x:mx2+0.5,y:my2+0.5,key:f.elite[i%f.elite.length],dir:rand(0,Math.PI*2),alive:true,isElite:true});
    }
  }
  
  // Place chests (0-1 only, far from start for exploration reward)
  const chests=[];
  const chCount=Math.random()<0.6?1:0; // 60% chance for 1 chest, 40% for none
  if(chCount>0){
    // Pick a reachable open tile far from start
    let bestTile=null,bestDist=0;
    for(const [cx2,cy2] of opens){
      const d=Math.sqrt((cx2-1.5)**2+(cy2-1.5)**2);
      if(d>bestDist&&d>4){bestDist=d;bestTile=[cx2,cy2]}
    }
    if(bestTile)chests.push({x:bestTile[0],y:bestTile[1],opened:false,gold:ri(5,20)});
  }
  
  // Fog of war
  const explored=[];
  for(let y=0;y<h;y++){explored[y]=[];for(let x=0;x<w;x++)explored[y][x]=false}
   
  // V103: Place a shop NPC in the middle of the south corridor (clearly visible from both directions)
  const shops=[];
  if(opens.length>3){
    // Priority: south corridor middle (cols 5-7, rows 4-7) — middle of L-shape
    let bestShopTile=null,bestShopScore=-1;
    for(const [sx,sy] of opens){
      // Skip tiles in boss area (bottom-right corner)
      if(sx>=w-4&&sy>=h-4)continue;
      let score=0;
      // Strongly prefer south corridor middle (cols 5-7, rows 4-7)
      if(sx>=5&&sx<=7&&sy>=4&&sy<=7)score=100;
      // Also acceptable: east corridor middle (cols 3-6, rows 1-3)
      else if(sx>=3&&sx<=6&&sy>=1&&sy<=3)score=50;
      // Add distance from start as tiebreaker (prefer farther)
      const d=Math.sqrt((sx-1.5)**2+(sy-1.5)**2);
      score+=d*0.5;
      if(score>bestShopScore){bestShopScore=score;bestShopTile=[sx,sy]}
    }
    if(bestShopTile){
      // Pick random ingredients from this floor's pool to sell
      const shopItems=[];
      const pool=FLOORS[floorIdx].pool;
      const uniqueDrops=[...new Set(pool.map(k=>EDEF[k].drop))];
      for(const dropKey of uniqueDrops){
        const ing=ING[dropKey];
        if(ing){
          const basePrice=ing.r==='rare'?25:ing.r==='uncommon'?12:6;
          shopItems.push({key:dropKey,price:basePrice+ri(0,3),stock:ri(2,4)});
        }
      }
      // Also sell seasons
      shopItems.push({key:'salt',price:5,stock:3,isSeason:true});
      shopItems.push({key:'pepper',price:7,stock:2,isSeason:true});
      // V96: Sell a random cookware (tier based on floor)
      const cwTier=Math.min(COOKWARE_LIST.length-1,floorIdx<1?1:floorIdx<3?Math.min(3,floorIdx+1):floorIdx+1);
      const cwKey=COOKWARE_LIST[Math.min(cwTier,COOKWARE_LIST.length-1)];
      const cwDef=COOKWARE[cwKey];
      shopItems.push({key:cwKey,price:cwDef.price,stock:1,isCookware:true});
      shops.push({x:bestShopTile[0],y:bestShopTile[1],items:shopItems});
    }
  }
   
  return{map:m,w,h,bx,by,mons,chests,explored,shops};
}

function enterFloor(floorIdx){
  G.floor=floorIdx;
  if(floorIdx>=FLOORS.length){G.state='win';S.win();save();return}
  const d=genMap(floorIdx);
  if(!d)return;
  G.map=d.map;G.mapW=d.w;G.mapH=d.h;
  G.explored=d.explored;
  G.mapMons=d.mons;
  G.mapChests=d.chests;
  G.bossDishKey=FLOORS[floorIdx].boss;
  G.bossDefeated=false;G.bossFed=false;G.bossFirstKill=false;G.hasBossDish=false;G.bossDoorNear=false;
  G.shopNear=false;
  G.px=1.5;G.py=1.5;G.pdir=Math.PI/2; // face south (into corridor depth)
  G.mapShops=d.shops||[]; // V96: shop NPCs
  G.state='explore';
  revealFog(); // reveal initial area around player
  showMsg('进入 '+FLOORS[floorIdx].n,60); // V41: shorter message
}

function showMsg(t,dur){G.msg=t;G.msgT=dur||60}

function isWall(x,y){
  const mx=Math.floor(x),my=Math.floor(y);
  if(mx<0||mx>=G.mapW||my<0||my>=G.mapH)return true;
  const v=G.map[my][mx];
  return v===1; // 0=floor,1=wall,2=boss(floor)
}

// ================================================================
//  FIRST-PERSON CORRIDOR RENDERING (shared by explore & battle)

// Raycast-like FP view: cast rays from player facing direction
// V9: Stronger depth fog gradient (warm→cool purple, not pure black), smoother floor,
//     seamless wall texturing, bigger torches, subtle ceiling gradient
function renderFP(t,isBattle){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  // V102: Cold dark purple-grey background (was warm brown #0A0806)
  ctx.fillStyle='#08070d';
  ctx.fillRect(0,0,W,H);

  const horizonY=Math.floor(H*0.42);
  const fov=Math.PI/2.6; // V76: wider FOV for better depth perception (was /2.8)
  const colW=2; // V76: finer columns to reduce visible banding (was 3)
  const numRays=Math.ceil(W/colW);
  const maxDist=14; // V76: shorter max distance for stronger fog
  const dir=G.pdir||0;
  const hasTex=_texReady;

  // ================================================================
  // 1. FLOOR — per-pixel perspective via low-res ImageData
  // ================================================================
  const floorTop=horizonY;

  if(hasTex){
    // Cache floor texture pixel data (V99: _floorTex is now a Canvas, use .width/.height directly)
      if(!window._floorTexData||window._floorTexData.key!=='f102b'){
      const tc=_floorTex; // Already a canvas
      const tctx=tc.getContext('2d');
        window._floorTexData={data:tctx.getImageData(0,0,tc.width,tc.height),w:tc.width,h:tc.height,key:'f102b'};
    }
    const fData=window._floorTexData.data.data;
    const fW=window._floorTexData.w, fH=window._floorTexData.h;

    // V97: Quarter-resolution floor rendering for 16x performance gain
      const scale=4; // V97: render at 1/4 resolution then upscale (was 1)
      const rW=Math.ceil(W/scale);

    // Floor: render rows from horizonY down to H
    const rFloorTop=Math.ceil(floorTop/scale);
    const rFloorBot=Math.ceil(H/scale);
    const rFH=rFloorBot-rFloorTop;
    if(rFH>0&&rW>0){
      if(!window._rFCV||window._rFCV.width!==rW||window._rFCV.height!==rFH){
        window._rFCV=document.createElement('canvas');window._rFCV.width=rW;window._rFCV.height=rFH;
      }
      const rctx=window._rFCV.getContext('2d');
      if(!window._floorImgData||window._floorImgData.width!==rW||window._floorImgData.height!==rFH){
        window._floorImgData=rctx.createImageData(rW,rFH);
      }
      const pixels=window._floorImgData.data;
      const texScale=6.0; // V91: balanced scale for new textures (was 4.0)

      // Pre-calculate cos/sin per column (cache arrays)
      if(!window._fCosArr||window._fCosArr.length!==rW){
        window._fCosArr=new Float32Array(rW);
        window._fSinArr=new Float32Array(rW);
      }
      const fCosArr=window._fCosArr, fSinArr=window._fSinArr;
      for(let rx=0;rx<rW;rx++){
        const screenAngle=(rx*scale/W-0.5)*fov;
        fCosArr[rx]=Math.cos(dir+screenAngle);
        fSinArr[rx]=Math.sin(dir+screenAngle);
      }

      for(let ry=0;ry<rFH;ry++){
        const y=(ry+rFloorTop)*scale;
        let p=y-horizonY;
        if(p<=0)continue;
        const rowDist=0.5/(p/H);
      // V33: Stronger floor brightness and warmth
      const fogFactor=Math.max(0.12, Math.exp(-rowDist*0.18)); // V91: less aggressive falloff (was 0.25)
        const desatT=Math.min(0.3, Math.max(0, (rowDist-3)/12)); // V42: less desaturation
        const warmth=Math.max(0, 1-rowDist/9); // V42: warmth extends further
        const coolT=1-warmth;
      const fBase=1.15*fogFactor; // V91: brighter floor (was 1.0)
      // V102: Warm orange torch light near, cold purple-grey far
      const fWarmR=warmth*45, fWarmG=warmth*22; // V102: stronger warm orange (was 30/15)
      const fCoolR=coolT*10, fCoolG=coolT*12, fCoolB=coolT*22; // V102: cold purple-blue tint (was green 4/20/6)
        const coolShift=Math.max(0,(rowDist-4)/10); // V92: cool blue for far floor
        const grayMix=0.30*desatT; // blend toward gray for distant floor

      for(let rx=0;rx<rW;rx++){
        const wx=G.px+fCosArr[rx]*rowDist;
        const wy=G.py+fSinArr[rx]*rowDist;

      // V89: Stronger world-space tile offset with per-tile rotation for breaking repetition
      const tileXF=Math.floor(wx*2), tileYF=Math.floor(wy*2);
      const tileOffU=((tileXF*51+tileYF*23)%97)/97*0.7; // V89: wider offset (was 0.5)
      const tileOffV=((tileXF*37+tileYF*61)%89)/89*0.6; // V89: separate V offset (was 0.4)
      // V89: Per-tile rotation hash — rotate texture sampling by 0/90/180/270 degrees (V98: normalize negative %)
      const rotHash=(((tileXF*13+tileYF*7)%4)+4)%4;
      let tu, tv;
      const rawU=((wx*texScale+tileOffU));
      const rawV=((wy*texScale*1.3+tileOffV));
      const fracU=((rawU%1)+1)%1;
      const fracV=((rawV%1)+1)%1;
      if(rotHash===0){tu=fracU;tv=fracV;}
      else if(rotHash===1){tu=fracV;tv=1-fracU;}
      else if(rotHash===2){tu=1-fracU;tv=1-fracV;}
      else{tu=1-fracV;tv=fracU;}
      const tx=Math.floor(tv*fH)*fW+Math.floor(tu*fW);
        const tx4=tx*4;
        const idx=(ry*rW+rx)*4;

        if(tx4>=0&&tx4+3<fData.length){
          const fBoost=1.2;
            let r=fData[tx4]*fBase*fBoost*0.82+fWarmR+fCoolR; // V102b: less red (was 0.88)
            let g=fData[tx4+1]*fBase*fBoost*0.90+fWarmG+fCoolG; // V102b: less green (was 0.96)
            let b=fData[tx4+2]*fBase*fBoost*1.10+fCoolB; // V102b: more blue (was 1.02)
            // V92: Cool purple shift for distant floor — atmospheric perspective
            if(coolShift>0.01){
              r=r*(1-coolShift*0.28);

            }
            // V97: Tint via lookup table (replaces 15-branch if-else for performance)

            // V98 FIX: JS % can be negative for negative coords — negative index into _FLOOR_TINTS = undefined → crash. Normalize to [0,15).
            const fTint=(((ftileX*31+ftileY*17+ftileX*ftileY*7+ftileY*ftileY*3)%15)+15)%15;
            const tintT=_FLOOR_TINTS[fTint];
            r*=tintT[0];g*=tintT[1];b*=tintT[2];
            // V97: Removed axial blur (too expensive per-pixel) — fog already provides distance softening
            // V97: Simplified desaturation — single multiply instead of gray blend
            if(grayMix>0.01){const gm=1-grayMix*0.5;r*=gm;g*=gm;b*=gm}
            // V97: Reduced noise — cheaper calculation
            const fNoise=((rx+ry*3)%5)-2;
            pixels[idx]=Math.max(0,Math.min(255,r+fNoise));
            pixels[idx+1]=Math.max(0,Math.min(255,g+fNoise));
            pixels[idx+2]=Math.max(0,Math.min(255,b+fNoise));
            pixels[idx+3]=255;
    }
  }
      rctx.putImageData(window._floorImgData,0,0);
      ctx.drawImage(window._rFCV,0,0,rW,rFH,0,floorTop,W,H-floorTop);
    }

    // ================================================================
    // 2. CEILING — Per-pixel perspective via low-res ImageData
    // ================================================================
    // No timing marker

    if(_ceilTex && _ceilTex.width>0){
      // Cache ceiling texture pixel data (V99: Canvas, use directly)
      if(!window._ceilTexData||window._ceilTexData.key!=='c102b'){
        const tc2=_ceilTex;
        const tctx2=tc2.getContext('2d');
        window._ceilTexData={data:tctx2.getImageData(0,0,tc2.width,tc2.height),w:tc2.width,h:tc2.height,key:'c102b'};
      }
      const cData=window._ceilTexData.data.data;
      const cW=window._ceilTexData.w, cH=window._ceilTexData.h;

      // V97: Quarter-resolution ceiling rendering for 16x performance gain
        const cscale=4; // V97: render at 1/4 resolution (was 1)
        const crW=Math.ceil(W/cscale);
      const ceilTop=0;
      const ceilBot=horizonY;
      const rCeilTop=Math.floor(ceilTop/cscale);
      const rCeilBot=Math.ceil(ceilBot/cscale);
      const rCH=rCeilBot-rCeilTop;
      if(rCH>0&&crW>0){
        if(!window._rCCV||window._rCCV.width!==crW||window._rCCV.height!==rCH){
          window._rCCV=document.createElement('canvas');window._rCCV.width=crW;window._rCCV.height=rCH;
        }
        const rctx2=window._rCCV.getContext('2d');
        if(!window._ceilImgData||window._ceilImgData.width!==crW||window._ceilImgData.height!==rCH){
          window._ceilImgData=rctx2.createImageData(crW,rCH);
        }
        const cpixels=window._ceilImgData.data;
        const ctexScale=6.0; // V91: balanced scale for new textures (was 4.0)

        // Pre-calculate cos/sin per column
        if(!window._cCosArr||window._cCosArr.length!==crW){
          window._cCosArr=new Float32Array(crW);
          window._cSinArr=new Float32Array(crW);
        }
        const cCosArr=window._cCosArr, cSinArr=window._cSinArr;
        for(let rx=0;rx<crW;rx++){
          const screenAngle=(rx*cscale/W-0.5)*fov;
          cCosArr[rx]=Math.cos(dir+screenAngle);
          cSinArr[rx]=Math.sin(dir+screenAngle);
        }

        for(let ry=0;ry<rCH;ry++){
          const y=(ry+rCeilTop)*cscale;
          let p=horizonY-y; // distance from horizon (upward)
          if(p<=0)continue;
          // Perp distance for ceiling (same formula as floor but inverted)
        const rowDist=0.5/(p/H); // V77: perspective projection — near rows are very close, far rows approach horizon
          // V33: Stronger fog and warmth for ceiling
          const fogFactor=Math.max(0.20, Math.exp(-rowDist*0.14)); // V94: brighter ceiling, less fog (was 0.14/0.16)
          const warmth=Math.max(0, 1-rowDist/10); // V42: warmth extends further
          const coolT=1-warmth;
          // V92: Cool blue shift for distant ceiling
          const ceilCoolShift=Math.max(0,(rowDist-4)/10);
          const cBase=1.65*fogFactor; // V94: much brighter ceiling (was 1.40)
          // V102b: Reduced warm tint on ceiling to let cold tone show (was 50/24)
          const cWarmR=warmth*35, cWarmG=warmth*16;
          const cCoolR=coolT*8, cCoolG=coolT*12, cCoolB=coolT*22; // V102: cold purple-blue (was green 6/22/8)

          // V89: Per-tile offset + rotation for ceiling to break repetition

          const ctOffU=((ctXF*41+ctYF*17)%89)/89*0.7; // V89: wider (was 0.5)
          const ctOffV=((ctXF*29+ctYF*53)%83)/83*0.6; // V89: separate V offset (was 0.4)
          // V89: Per-tile rotation (V98: normalize negative %)
          const crotHash=(((ctXF*17+ctYF*11)%4)+4)%4;
          const crawU=(wx*ctexScale+ctOffU);
          const crawV=(wy*ctexScale*1.2+ctOffV);
          const cfracU=((crawU%1)+1)%1;
          const cfracV=((crawV%1)+1)%1;
          let tu, tv;
          if(crotHash===0){tu=cfracU;tv=cfracV;}
          else if(crotHash===1){tu=cfracV;tv=1-cfracU;}
          else if(crotHash===2){tu=1-cfracU;tv=1-cfracV;}
          else{tu=1-cfracV;tv=cfracU;}
            const tx=Math.floor(tv*cH)*cW+Math.floor(tu*cW);
            const tx4=tx*4;
            const idx=(ry*crW+rx)*4;

            if(tx4>=0&&tx4+3<cData.length){
              // V102: Cold purple-grey ceiling with warm torch bleed
              const texR=cData[tx4]*cBase*brightBoost*0.80+cWarmR*0.7+cCoolR; // V102b: less red (was 0.86)
              const texG=cData[tx4+1]*cBase*brightBoost*0.88+cWarmG*0.8+cCoolG; // V102b: less green (was 0.96)
              const texB=cData[tx4+2]*cBase*brightBoost*1.08+cCoolB; // V102b: more blue (was 1.00)
              // V92: Cool blue shift for distant ceiling
              let r=texR*(1-ceilCoolShift*0.22)*horizonFade+fogBlendR*fogAmt;
              let g=texG*(1-ceilCoolShift*0.14)*horizonFade+fogBlendG*fogAmt;
              let b=(texB+ceilCoolShift*14)*horizonFade+fogBlendB*fogAmt;
              // V97: Reduced ceiling noise — cheaper calculation
              const cNoise=((rx+ry*5)%7)-3;
              cpixels[idx]=Math.max(0,Math.min(255,r+cNoise));
              cpixels[idx+1]=Math.max(0,Math.min(255,g+cNoise));
              cpixels[idx+2]=Math.max(0,Math.min(255,b+cNoise));
              cpixels[idx+3]=255;
  }
}
        }
        rctx2.putImageData(window._ceilImgData,0,0);
        ctx.drawImage(window._rCCV,0,0,crW,rCH,0,0,W,horizonY);
        // V55: Lighter arch vault shadow for visible ceiling structure
        const archGrad=ctx.createLinearGradient(0,0,0,horizonY);
        archGrad.addColorStop(0,'rgba(4,3,8,0.25)'); // V102: cold purple shadow (was green 5,8,6)
        archGrad.addColorStop(0.3,"rgba(6,5,10,0.12)"); // V102: cold (was 8,12,6)

        for(let hi=0;hi<10;hi++){
          const hSeed=((hi*173+Math.floor(t*0.001)*31)%251);

  } // close if(hasTex)

  // ================================================================
  // 3. WALLS — raycast with world-offset texture mapping
  // ================================================================
  // V54: zBuffer as global so props/entities can check wall occlusion
  const zBuffer=new Float32Array(numRays);
  G._zBuffer=zBuffer;
  G._zBufferColW=colW;
  G._zBufferNumRays=numRays;
  G._zBufferFov=fov;
  G._zBufferDir=dir;
  for(let r=0;r<numRays;r++){
    const screenX=r*colW;
    const rayAngle=dir-fov/2+fov*r/(numRays-1);
    let dist=0,cx2=G.px,cy2=G.py;
    const step=0.04;
    let hit=false,hitSide=0,hitX=0,hitWX=0,hitWY=0;
    while(dist<maxDist){
      cx2+=Math.cos(rayAngle)*step;
      cy2+=Math.sin(rayAngle)*step;
      dist+=step;
      const mx2=Math.floor(cx2),my2=Math.floor(cy2);
      if(mx2<0||mx2>=G.mapW||my2<0||my2>=G.mapH){break}
      if(G.map[my2][mx2]===1){

    if(!hit)continue;

    const wallTop=horizonY-wallH*0.50; // V77: centered (was 0.46)
    const wallBot=horizonY+wallH*0.50; // V77: centered (was 0.54)

      const wallOffV=((hitWX*71+hitWY*43)%157)/157;
      const texV=(wallOffV)%1;

      ctx.drawImage(_wallTex,

      const tileTint=(((hitWX*13+hitWY*29+hitWX*hitWY*7+hitWX*hitWY*hitWX*3+hitWY*hitWY*5)%24)+24)%24;
      const tintColors=[
        'rgba(8,6,16,0.15)',   // 0 cold purple shadow
        'rgba(5,8,14,0.14)',   // 1 dark blue-grey
        'rgba(2,2,5,0.17)',    // 2 deep shadow
        'rgba(55,25,8,0.14)',  // 3 warm amber (torch-lit)
        'rgba(6,8,18,0.15)',   // 4 wet blue-purple

        'rgba(28,12,4,0.15)',  // 7 dim amber

        'rgba(8,10,18,0.12)',  // 9 cold navy

        'rgba(22,10,6,0.18)',  // 13 deep amber shadow
        'rgba(8,10,18,0.14)',  // 14 cold stone

        'rgba(5,6,12,0.18)',   // 17 deep cold wet

      ctx.fillStyle=tintColors[tileTint];

      // V87: Stronger 3D depth shading — top brighter (ceiling light), bottom darker (shadow)

      wallGrad78.addColorStop(0.15,'rgba(15,14,20,0.06)'); // V102: cold
      wallGrad78.addColorStop(0.3,'rgba(0,0,0,0)');
      wallGrad78.addColorStop(0.7,'rgba(0,0,0,0)');

    }else{

  // V102: Post-wall cold dampness — purple-grey gradient (was green 8,14,10 → 15,30,18)
  const sewerDampGrad=ctx.createLinearGradient(0,horizonY,0,H*0.75);

  // V90: Simplified wall details — new textures have built-in variety, only add subtle dampness
  for(let r2=0;r2<numRays;r2+=Math.max(4,Math.floor(numRays/6))){
    const sX=r2*colW;
    const z=zBuffer[r2];
    if(z>=maxDist||z<0.5)continue;

  seamGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=seamGrad;
  ctx.fillRect(0,horizonY-12,W,24);

  const baseShadow=ctx.createLinearGradient(0,horizonY,0,horizonY+30);
  baseShadow.addColorStop(0,'rgba(0,0,0,0.20)');
  baseShadow.addColorStop(0.5,'rgba(0,0,0,0.08)');
  baseShadow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=baseShadow;
  ctx.fillRect(0,horizonY,W,30);

  // ================================================================
  // 4. LIGHTING — player torch glow + wall torch glows
  // ================================================================
  ctx.save();
  ctx.globalCompositeOperation='source-over'; // V54g: was 'screen' — screen mode causes brightness accumulation with multiple torches

  // V80: Player-centered warm glow — V102c: stronger contrast
  const torchFlicker=0.82+Math.sin(t*0.012)*0.10+Math.sin(t*0.035)*0.06+Math.sin(t*0.08)*0.04+Math.sin(t*0.15)*0.03;
  const pGlowR=W*0.42*torchFlicker;
  const pGlow=ctx.createRadialGradient(W/2,H*0.52,0,W/2,H*0.52,pGlowR);
  pGlow.addColorStop(0,`rgba(255,170,50,${0.40*torchFlicker})`); // V102c: warmer orange (was 255,180,70 / 0.32)
  pGlow.addColorStop(0.08,`rgba(240,140,30,${0.28*torchFlicker})`); // V102c: (was 245,155,45 / 0.22)
  pGlow.addColorStop(0.22,`rgba(180,75,15,${0.14*torchFlicker})`); // V102c: (was 190,90,25 / 0.12)
  pGlow.addColorStop(0.45,`rgba(80,30,5,${0.05*torchFlicker})`); // V102c: (was 90,38,8 / 0.05)
  pGlow.addColorStop(0.70,`rgba(20,6,2,${0.02*torchFlicker})`);
  pGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=pGlow;

  // Wall-mounted torches — V37: stronger, with wall light patches
  for(let td=1;td<=5;td++){
    const flick=0.55+Math.sin(t*0.015+td*2.7)*0.35+Math.sin(t*0.045+td*1.3)*0.10;
    const tscale=1/(td*0.5+0.15);
    const txLeft=lerp(W*0.32,W*0.07,tscale);

    tgL.addColorStop(.08,`rgba(210,145,55,${0.18*tscale*flick})`); // V94: brighter (was 0.12)
    tgL.addColorStop(.20,`rgba(170,85,30,${0.12*tscale*flick})`); // V94: brighter (was 0.07)
    tgL.addColorStop(.40,`rgba(120,50,18,${0.07*tscale*flick})`); // V94: brighter (was 0.04)
    tgL.addColorStop(.65,`rgba(70,28,10,${0.04*tscale*flick})`); // V94: brighter (was 0.02)

    tgR.addColorStop(.20,`rgba(170,85,30,${0.12*tscale*flick})`); // V94: brighter
    tgR.addColorStop(.40,`rgba(120,50,18,${0.07*tscale*flick})`); // V94: brighter
    tgR.addColorStop(.65,`rgba(70,28,10,${0.04*tscale*flick})`); // V94: brighter
    tgR.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=tgR;ctx.fillRect(txRight-glowR,ty-glowR,glowR*2,glowR*2);
    
    // V94: Stronger wall light patch — torches illuminate walls
    const wallPatchAlpha=0.22*tscale*flick; // V94: much brighter (was 0.14)
    const wallPatch=ctx.createRadialGradient(txLeft,ty,0,txLeft,ty,glowR*1.0); // V94: wider (was 0.8)
    wallPatch.addColorStop(0,`rgba(200,155,60,${wallPatchAlpha})`); // V94: brighter
    wallPatch.addColorStop(0.3,`rgba(180,110,40,${wallPatchAlpha*0.6})`);
    wallPatch.addColorStop(0.6,`rgba(160,75,25,${wallPatchAlpha*0.3})`);

  ctx.restore();

  // ================================================================
  // 5. TORCHES — particle-style flames, wall-mounted brackets
  // ================================================================
  for(let td=1;td<=5;td++){
    // V73: Skip some torches randomly to break symmetric placement pattern
    const torchSeed=((td*37+13)%7);
    const showLeft=torchSeed%3!==0; // skip ~33% of left torches
    const showRight=(torchSeed+2)%3!==0; // different skip pattern for right
    const flick=0.55+Math.sin(t*0.015+td*2.7)*0.35+Math.sin(t*0.045+td*1.3)*0.10;
    const flick2=Math.sin(t*0.03+td*5)*0.2;

    const tscale=1/(td*0.5+0.15);

    const fW2=14*tscale, fH2=28*tscale; // V54k: even narrower flames (was 20/38) — less orb-like

    // === LEFT TORCH === V73: skip some torches for non-symmetric placement
    if(showLeft){
    // Bracket — V49: detailed metal bracket with ring and rivets
    ctx.fillStyle='#3a2a1a';

// V40: Floor scatter — small pebbles, bone fragments, cracks on floor tiles
function drawFloorScatter(t,dir,fov,horizonY,maxDist){
  const scatterRange=6; // V97: reduced from 10 for performance
  for(let dy=-scatterRange;dy<=scatterRange;dy++){
    for(let dx=-scatterRange;dx<=scatterRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue;
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      // 3 scatter items per tile
      for(let si=0;si<3;si++){
        const sSeed=((seed+si*98765)^(si*54321))>>>0;
        if((sSeed>>16)%4===0)continue; // V46: skip only 25% (was 16%), more scatter
        const scatterType=(sSeed>>8)%7; // V46: 7 types (0=pebble, 1=bone, 2=crack, 3=moss, 4=ash, 5=ember, 6=web)
        const px2=tx+0.1+((sSeed>>4)&0x3F)/256*0.8;
        const py2=ty+0.1+((sSeed>>10)&0x3F)/256*0.8;
        const dxp=px2-G.px, dyp=py2-G.py;
        const dist=Math.sqrt(dxp*dxp+dyp*dyp);
        if(dist<0.3||dist>3)continue; // V55: tighter max dist (was 5) — far scatter looks like floating blobs
        const angle=Math.atan2(dyp,dxp)-dir;
        let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
        if(Math.abs(na)>fov/2+0.1)continue;
        const screenT=(na/(fov/2)+1)/2;
        const sx=lerp(W*0.05,W*0.95,screenT);
        const scale=Math.max(0.05,1/(dist*0.4+0.15));
      const sz=H*0.35*scale; // V54b: much smaller scatter (was 1.1, caused giant bright patches)
      if(sz<H*0.25)continue; // V55: skip if too small — prevents floating pixel-sized artifacts
      const groundY=horizonY+(H-horizonY)*Math.min(0.95,scale*0.85); // V41: closer to screen bottom for near props
      const dim=Math.max(0.60,Math.min(1,14/(dist+0.5))); // V54b: dimmer scatter (was 18)
        if(scatterType===0){
          // Pebble — small round stone, V102: cold grey (was warm brown 115,100,85)
          ctx.fillStyle=`rgba(${95+(sSeed&31)},${92+((sSeed>>2)&21)},${105+((sSeed>>4)&21)},${0.85*dim})`;
          const pr=sz*0.12+((sSeed>>6)&7)*sz*0.025; // V52: bigger pebbles (was 0.08/0.018)
          ctx.beginPath();ctx.arc(sx,groundY,pr,0,Math.PI*2);ctx.fill();
          // Pebble shadow
          ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
          ctx.beginPath();ctx.ellipse(sx+pr*0.3,groundY+pr*0.2,pr*1.1,pr*0.4,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===1){
          // Bone fragment — V54k: only render if very close (dist<3)
          if(dist<3){
          ctx.strokeStyle=`rgba(200,190,170,${0.60*dim})`;
          ctx.lineWidth=Math.max(0.8,sz*0.012);
          const bl=sz*0.18;
          const ba=(sSeed*0.01)%Math.PI;
          ctx.beginPath();
          ctx.moveTo(sx-Math.cos(ba)*bl,groundY-Math.sin(ba)*bl*0.3);
          ctx.lineTo(sx+Math.cos(ba)*bl,groundY+Math.sin(ba)*bl*0.3);
          ctx.stroke();
          }
        }else if(scatterType===2){
          // Floor crack — V42: more visible
          ctx.strokeStyle=`rgba(8,5,12,${0.55*dim})`;
          ctx.lineWidth=Math.max(0.5,sz*0.008);
          const cl=sz*0.25; // V52: longer crack (was 0.18)
          const ca=(sSeed*0.013)%Math.PI;
          ctx.beginPath();
          ctx.moveTo(sx-Math.cos(ca)*cl,groundY);
          ctx.lineTo(sx,groundY+Math.sin(ca)*cl*0.2);
          ctx.lineTo(sx+Math.cos(ca)*cl*0.8,groundY);
          ctx.stroke();
        }else if(scatterType===3){
          // V102: Dark dry moss — not bright green (was 60,110,40)
          ctx.fillStyle=`rgba(45,48,35,${0.50*dim})`;
          const mr=sz*0.12;
          ctx.beginPath();ctx.ellipse(sx,groundY,mr,mr*0.4,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle=`rgba(55,50,38,${0.40*dim})`;
          ctx.beginPath();ctx.ellipse(sx-mr*0.3,groundY,mr*0.6,mr*0.25,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===4){
          // Ash/soot patch — V42: more visible
          ctx.fillStyle=`rgba(50,42,42,${0.40*dim})`;
          const ar=sz*0.13; // V52: bigger ash (was 0.09)
          ctx.beginPath();ctx.ellipse(sx,groundY,ar,ar*0.3,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle=`rgba(65,55,52,${0.30*dim})`; // V42: brighter
          ctx.beginPath();ctx.ellipse(sx+ar*0.2,groundY-ar*0.1,ar*0.7,ar*0.2,0,0,Math.PI*2);ctx.fill();
        }else if(scatterType===5){
          // V55: Removed ember glow — was appearing as floating orange dots at distance
          // Replace with dark soot stain instead
          ctx.fillStyle=`rgba(30,25,20,${0.35*dim})`;
          const er=sz*0.06;
          ctx.beginPath();ctx.ellipse(sx,groundY,er,er*0.3,0,0,Math.PI*2);ctx.fill();
        }else{
          // V54j: Removed floor web — was looking like floating white lines at distance
          // Replace with dark stain instead
          ctx.fillStyle=`rgba(25,20,15,${0.30*dim})`;
          const sr=sz*0.10;
          ctx.beginPath();ctx.ellipse(sx,groundY,sr,sr*0.3,0,0,Math.PI*2);ctx.fill();
        }
      }
    }
  }
}

// V40: Ceiling props — hanging chains, stalactites, vines, cobwebs
function drawCeilingProps(t,dir,fov,horizonY,maxDist){
  const ceilRange=12; // V41: wider range
  for(let dy=-ceilRange;dy<=ceilRange;dy++){
    for(let dx=-ceilRange;dx<=ceilRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue; // only on floor tiles (ceiling above corridors)
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      if((seed>>16)%3===0)continue; // V46: skip only 33% (was 20% skip)
      const ceilType=(seed>>8)%4; // V54e: 0=chain, 1=stalactite, 2=vine, 3=rusted pipe (was cobweb)
      const px2=tx+0.2+((seed>>4)&0x3F)/256*0.6;
      const py2=ty+0.2+((seed>>10)&0x3F)/256*0.6;
      const dxp=px2-G.px, dyp=py2-G.py;
      const dist=Math.sqrt(dxp*dxp+dyp*dyp);
      if(dist<2.0||dist>3.5)continue; // V55: tighter max dist (was 5) — far ceiling props look like floating dots
      const angle=Math.atan2(dyp,dxp)-dir;
      let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
      if(Math.abs(na)>fov/2+0.1)continue;
      const screenT=(na/(fov/2)+1)/2;
      const sx=lerp(W*0.05,W*0.95,screenT);
      const scale=Math.max(0.05,1/(dist*0.4+0.15));
      const sz=H*0.30*scale; // V54b: smaller ceiling props (was 0.72)
      if(sz<H*0.20)continue; // V55: skip if too small — prevents floating pixel artifacts
      const ceilY=horizonY-(H-horizonY)*Math.min(0.8,scale*0.7); // hangs from ceiling
      const dim=Math.max(0.65,Math.min(1,14/(dist+0.5))); // V42: brighter ceiling props
      const hangLen=sz*(0.10+((seed>>6)&15)*0.015); // V41: longer hang lengths
      if(ceilType===0){
        // Hanging chain — V42: brighter, thicker
        ctx.strokeStyle=`rgba(100,95,85,${0.80*dim})`;
        ctx.lineWidth=Math.max(1.2,sz*0.018);
        const numLinks=4;
        for(let ci=0;ci<numLinks;ci++){
          const cy=ceilY+ci*hangLen/numLinks;
          ctx.beginPath();
          ctx.ellipse(sx,cy,sz*0.012,hangLen/numLinks/2,0,0,Math.PI*2);
          ctx.stroke();
        }
        // Chain highlight — V42: brighter
        ctx.strokeStyle=`rgba(160,155,145,${0.50*dim})`;
        ctx.lineWidth=Math.max(0.6,sz*0.008);
        ctx.beginPath();ctx.moveTo(sx-sz*0.005,ceilY);ctx.lineTo(sx-sz*0.005,ceilY+hangLen);ctx.stroke();
      }else if(ceilType===1){
        // Stalactite — V102: cold grey-purple (was 85,72,78)
        ctx.fillStyle=`rgba(70,68,82,${0.85*dim})`;
        ctx.beginPath();
        ctx.moveTo(sx-sz*0.025,ceilY);
        ctx.lineTo(sx+sz*0.025,ceilY);
        ctx.lineTo(sx+sz*0.008,ceilY+hangLen);
        ctx.closePath();ctx.fill();
        // Stalactite highlight — V102: cold
        ctx.fillStyle=`rgba(100,96,115,${0.60*dim})`;
        ctx.beginPath();
        ctx.moveTo(sx-sz*0.018,ceilY);
        ctx.lineTo(sx-sz*0.005,ceilY);
        ctx.lineTo(sx+sz*0.002,ceilY+hangLen*0.8);
        ctx.closePath();ctx.fill();
        // V55: Removed water drip at stalactite tip — was appearing as floating blue dot at distance
      }else if(ceilType===2){
        // V102: Hanging root — dead brown, not green vine (was 50,80,35)
        ctx.strokeStyle=`rgba(45,38,32,${0.75*dim})`;
        ctx.lineWidth=Math.max(1.0,sz*0.015);
        const numSegs=5;
        ctx.beginPath();
        ctx.moveTo(sx,ceilY);
        for(let vi=1;vi<=numSegs;vi++){
          const vx=sx+Math.sin(t*0.002+vi+seed*0.1)*sz*0.015;
          const vy=ceilY+vi*hangLen/numSegs;
          ctx.lineTo(vx,vy);
        }
        ctx.stroke();
        // Root tendrils — dark
        for(let vi=1;vi<=numSegs;vi+=2){
          const vx=sx+Math.sin(t*0.002+vi+seed*0.1)*sz*0.015;
          const vy=ceilY+vi*hangLen/numSegs;
          ctx.fillStyle=`rgba(55,45,38,${0.70*dim})`; // V102: brown not green
          ctx.beginPath();ctx.ellipse(vx,vy,sz*0.012,sz*0.008,0,0,Math.PI*2);ctx.fill();
        }
      }else{
        // V54e: Rusted pipe joint — replaces cobweb for sewer theme
        ctx.fillStyle=`rgba(70,55,40,${0.75*dim})`; // rust brown base
        const pR=sz*0.02;
        ctx.beginPath();ctx.ellipse(sx,ceilY+hangLen*0.3,pR,pR*0.6,0,0,Math.PI*2);ctx.fill();
        // Rust highlight
        ctx.fillStyle=`rgba(110,80,45,${0.50*dim})`;
        ctx.beginPath();ctx.ellipse(sx-pR*0.3,ceilY+hangLen*0.3-pR*0.1,pR*0.7,pR*0.4,0,0,Math.PI*2);ctx.fill();
        // V55: Removed dripping water — was appearing as floating green-gray dot at distance
      }
    }
  }
}

// Draw environmental props (mushrooms, moss, debris, barrels, crates, webs, bones) on corridor floor
// V14: added barrels, crates, cobwebs, bone piles for richer environment
function drawCorridorProps(t,dir,fov,horizonY,maxDist){
  // V54: Sewer-themed props — all environment-appropriate for damp underground
  // V54: Added z-buffer occlusion check to prevent props showing through walls
  const zBuf=G._zBuffer;
  const zColW=G._zBufferColW;
  const zNumRays=G._zBufferNumRays;
  // V54: Helper — check if a point at (worldX,worldY) is occluded by a wall
  function isOccluded(wx,wy){
    if(!zBuf)return false;
    const dxp2=wx-G.px,dyp2=wy-G.py;
    const ang=Math.atan2(dyp2,dxp2)-dir;
    let na2=ang;while(na2>Math.PI)na2-=Math.PI*2;while(na2<-Math.PI)na2+=Math.PI*2;
    if(Math.abs(na2)>fov/2+0.05)return true;
    const rayIdx=Math.floor((na2+fov/2)/fov*zNumRays);
    const wallDist=zBuf[Math.max(0,Math.min(zNumRays-1,rayIdx))];
    const ptDist=Math.sqrt(dxp2*dxp2+dyp2*dyp2);
    return ptDist>wallDist-0.15;
  }
  // V54: Sewer prop types (10 types, all floor-level, none taller than knee height):
  // 0-1=algae stain, 2-3=puddle, 4-5=cracked_tile, 6-7=bone_fragment, 8-9=rusted_grate
  // 10-11=rat_droppings, 12-13=moss_patch, 14-15=broken_brick, 16-17=sludge_pool, 18-19=pipe_drip
  const propRange=15;
  const propPasses=2;
  for(let pass=0;pass<propPasses;pass++){
  for(let dy=-propRange;dy<=propRange;dy++){
    for(let dx=-propRange;dx<=propRange;dx++){
      const tx=Math.floor(G.px)+dx, ty=Math.floor(G.py)+dy;
      if(tx<0||tx>=G.mapW||ty<0||ty>=G.mapH)continue;
      if(G.map[ty][tx]!==0)continue;
      if(!G.explored[ty]||!G.explored[ty][tx])continue;
      const seed=((tx*73856093)^(ty*19349663))>>>0;
      const propType=(seed+pass*7)%20;
      if(pass===1 && (seed>>16)%2===0)continue;
      // Place props at tile edges
      const px2=tx+0.15+((seed>>4)&0x3F)/256*0.7;
      const py2=ty+0.15+((seed>>10)&0x3F)/256*0.7;
      const dxp=px2-G.px, dyp=py2-G.py;
      const dist=Math.sqrt(dxp*dxp+dyp*dyp);
      if(dist<0.8||dist>4)continue; // V55: tighter max dist (was 6) — far props still look like floating blobs
      // V55: add min render size check
      // V54: z-buffer occlusion check — skip if wall is in front
      if(isOccluded(px2,py2))continue;
      const angle=Math.atan2(dyp,dxp)-dir;
      let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
      if(Math.abs(na)>fov/2+0.1)continue;
      const screenT=(na/(fov/2)+1)/2;
      const sx=lerp(W*0.05,W*0.95,screenT);
      // V54e: Slightly larger and brighter for visibility
      const scale=Math.max(0.05,1/(dist*0.42+0.15));
      const sz=H*0.60*scale; // V54e: slightly bigger (was 0.55)
      if(sz<H*0.25)continue; // V55: skip if too small — prevents floating pixel-sized artifacts
      const groundY=horizonY+(H-horizonY)*Math.min(1,scale*0.8);
      const flicker=Math.sin(t*0.003+seed*0.1)*0.5+0.5;
      const dim=Math.max(0.85,Math.min(1,20/(dist+0.5))); // V54e: brighter (was 16)

      if(propType<2){
        // V102: Algae stain — dark cold stain (was green 35,60,25)
        const algSz=sz*0.16;
        const algShades=[[22,22,28,0.55],[28,28,35,0.45],[18,18,24,0.5]];
        for(let mi=0;mi<5;mi++){
          const ma=seed*(mi+1)*0.5;
          const mr2=algSz*(0.2+((seed>>mi)&3)*0.12);
          const mx2=sx+Math.cos(ma)*algSz*0.5;
          const my2=groundY+Math.sin(ma)*algSz*0.1;
          const ms=algShades[mi%3];
          ctx.fillStyle=`rgba(${ms[0]},${ms[1]},${ms[2]},${ms[3]*dim})`;
          ctx.beginPath();ctx.ellipse(mx2,my2,mr2,mr2*0.28,ma,0,Math.PI*2);ctx.fill();
        }
        // Slimy highlight — cold blue-grey (was green 90,130,60)
        ctx.fillStyle=`rgba(70,75,90,${0.2*dim*flicker})`;
        ctx.beginPath();ctx.ellipse(sx-algSz*0.2,groundY-algSz*0.05,algSz*0.3,algSz*0.08,0.3,0,Math.PI*2);ctx.fill();
      }else if(propType<4){
        // V54: Puddle — dark water with faint reflection (V54l: lower alpha)
        const pSz=sz*0.14;
        // Dark water base
        ctx.fillStyle=`rgba(15,20,25,${0.5*dim})`; // V54l: was 0.7
        ctx.beginPath();ctx.ellipse(sx,groundY,pSz,pSz*0.25,0,0,Math.PI*2);ctx.fill();
        // Reflection highlight
        ctx.fillStyle=`rgba(50,60,70,${0.15*dim*flicker})`; // V54l: was 0.3
        ctx.beginPath();ctx.ellipse(sx-pSz*0.2,groundY-pSz*0.06,pSz*0.5,pSz*0.1,0,0,Math.PI*2);ctx.fill();
        // Edge wetness — V102: cold (was green 40,50,40)
        ctx.strokeStyle=`rgba(35,38,50,${0.4*dim})`;
        ctx.lineWidth=Math.max(0.5,pSz*0.06);
        ctx.beginPath();ctx.ellipse(sx,groundY,pSz,pSz*0.25,0,0,Math.PI*2);ctx.stroke();
      }else if(propType<6){
        // V54: Cracked tile — dark crack lines on floor
        const cSz=sz*0.12;
        ctx.strokeStyle=`rgba(10,8,5,${0.5*dim})`;
        ctx.lineWidth=Math.max(0.8,cSz*0.06);
        const crackSeed=seed;
        // Main crack
        ctx.beginPath();
        ctx.moveTo(sx-cSz,groundY);
        ctx.lineTo(sx-cSz*0.3,groundY-cSz*0.05);
        ctx.lineTo(sx+cSz*0.4,groundY+cSz*0.03);
        ctx.lineTo(sx+cSz,groundY);
        ctx.stroke();
        // Branch
        if((crackSeed>>4)&1){
          ctx.lineWidth=Math.max(0.5,cSz*0.04);
          ctx.beginPath();
          ctx.moveTo(sx-cSz*0.3,groundY-cSz*0.05);
          ctx.lineTo(sx-cSz*0.1,groundY-cSz*0.12);
          ctx.stroke();
        }
        // Dark stain around crack
        ctx.fillStyle=`rgba(20,15,10,${0.2*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,cSz*0.8,cSz*0.15,0,0,Math.PI*2);ctx.fill();
      }else if(propType<8){
        // V54: Bone fragment — small white shard on floor (only if very close, V55: tighter dist)
        if(dist<2){
        ctx.fillStyle=`rgba(180,170,150,${0.55*dim})`;
        const bSz=sz*0.05;
        const ba=seed*0.3;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(ba);
        ctx.fillRect(-bSz,-bSz*0.15,bSz*2,bSz*0.3);
        ctx.restore();
        // Shadow under
        ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,bSz*1.2,bSz*0.2,0,0,Math.PI*2);ctx.fill();
        // Smaller fragments
        ctx.fillStyle=`rgba(160,150,130,${0.4*dim})`;
        ctx.beginPath();ctx.arc(sx+bSz*1.5,groundY+bSz*0.3,bSz*0.4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(sx-bSz*1.8,groundY+bSz*0.2,bSz*0.3,0,Math.PI*2);ctx.fill();
        } // V55: only render bone fragments at dist<2
      }else if(propType<10){
        // V54: Rusted grate fragment — only if close enough (V55: tighter dist)
        if(dist<2.5){
        const gSz=sz*0.08;
        ctx.fillStyle=`rgba(40,35,30,${0.7*dim})`;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(seed*0.2);
        ctx.fillRect(-gSz,-gSz*0.4,gSz*2,gSz*0.8);
        ctx.restore();
        // Rust spots
        ctx.fillStyle=`rgba(90,50,20,${0.5*dim})`;
        ctx.beginPath();ctx.arc(sx-gSz*0.3,groundY,gSz*0.25,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(sx+gSz*0.5,groundY-gSz*0.1,gSz*0.2,0,Math.PI*2);ctx.fill();
        // Bar lines
        ctx.strokeStyle=`rgba(70,60,50,${0.5*dim})`;
        ctx.lineWidth=Math.max(0.5,gSz*0.08);
        ctx.beginPath();ctx.moveTo(sx-gSz*0.8,groundY-gSz*0.3);ctx.lineTo(sx-gSz*0.8,groundY+gSz*0.3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx,groundY-gSz*0.3);ctx.lineTo(sx,groundY+gSz*0.3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx+gSz*0.8,groundY-gSz*0.3);ctx.lineTo(sx+gSz*0.8,groundY+gSz*0.3);ctx.stroke();
        } // V55: only render grate at dist<2.5
      }else if(propType<12){
        // V54: Rat droppings — tiny dark pellets
        const dSz=sz*0.015;
        for(let pi=0;pi<6;pi++){
          const pa=seed*(pi+1)*0.7;
          const px3=sx+Math.cos(pa)*sz*0.08;
          const py3=groundY+Math.sin(pa)*sz*0.03;
          ctx.fillStyle=`rgba(20,15,10,${0.7*dim})`;
          ctx.beginPath();ctx.ellipse(px3,py3,dSz,dSz*0.5,pa,0,Math.PI*2);ctx.fill();
        }
      }else if(propType<14){
        // V102: Dark stain patch — was green moss, now cold dark (was 30,55,20 / 40,70,25 / 50,85,30 / 60,100,35)
        const mossSz=sz*0.14;
        const mossShades=[[20,20,26,0.5],[26,26,32,0.4],[30,30,38,0.35],[24,24,30,0.3]];
        for(let mi=0;mi<5;mi++){
          const ma=seed*(mi+1)*0.5;
          const mr2=mossSz*(0.2+((seed>>mi)&3)*0.12);
          const mx2=sx+Math.cos(ma)*mossSz*0.5;
          const my2=groundY+Math.sin(ma)*mossSz*0.1;
          const ms=mossShades[mi%4];
          ctx.fillStyle=`rgba(${ms[0]},${ms[1]},${ms[2]},${ms[3]*dim})`;
          ctx.beginPath();ctx.ellipse(mx2,my2,mr2,mr2*0.28,ma,0,Math.PI*2);ctx.fill();
        }
      }else if(propType<16){
        // V54: Broken brick — reddish-brown chunk on floor (V55: only if close)
        if(dist<2.5){
        const brSz=sz*0.06;
        ctx.fillStyle=`rgba(100,70,50,${0.65*dim})`;
        ctx.save();
        ctx.translate(sx,groundY);
        ctx.rotate(seed*0.15);
        ctx.fillRect(-brSz,-brSz*0.4,brSz*1.8,brSz*0.8);
        ctx.restore();
        // Highlight
        ctx.fillStyle=`rgba(130,90,65,${0.35*dim})`;
        ctx.fillRect(sx-brSz*0.5,groundY-brSz*0.3,brSz*0.6,brSz*0.2);
        // Shadow
        ctx.fillStyle=`rgba(0,0,0,${0.3*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,brSz*1.2,brSz*0.2,0,0,Math.PI*2);ctx.fill();
        } // V55: only render brick at dist<2.5
      }else if(propType<18){
        // V102: Sludge pool — dark cold viscous liquid (was green 15,25,12)
        const slSz=sz*0.13;
        ctx.fillStyle=`rgba(12,12,18,${0.5*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,slSz,slSz*0.22,0,0,Math.PI*2);ctx.fill();
        // Surface sheen — cold (was green 30,45,20)
        ctx.fillStyle=`rgba(22,24,32,${0.15*dim*flicker})`;
        ctx.beginPath();ctx.ellipse(sx-slSz*0.15,groundY-slSz*0.04,slSz*0.5,slSz*0.08,0,0,Math.PI*2);ctx.fill();
        // Bubble
        if(flicker>0.6){
          ctx.fillStyle=`rgba(40,42,52,${0.2*dim})`; // V102: cold (was green 60,80,35)
          ctx.beginPath();ctx.arc(sx+slSz*0.3,groundY-slSz*0.06,slSz*0.1,0,Math.PI*2);ctx.fill();
        }
      }else{
        // V54: Pipe drip — water dripping from ceiling pipe (dark spot + ripple)
        const drSz=sz*0.06;
        // Dark wet patch on floor
        ctx.fillStyle=`rgba(20,25,30,${0.6*dim})`;
        ctx.beginPath();ctx.ellipse(sx,groundY,drSz,drSz*0.2,0,0,Math.PI*2);ctx.fill();
        // V55: Only draw ripple and drip if close enough to be identifiable
        if(dist<2.5){
          // Ripple rings
          ctx.strokeStyle=`rgba(40,45,50,${0.25*dim*flicker})`;
          ctx.lineWidth=Math.max(0.5,drSz*0.05);
          ctx.beginPath();ctx.ellipse(sx,groundY,drSz*0.7,drSz*0.15,0,0,Math.PI*2);ctx.stroke();
          // Drip from above
          const dripY=groundY-sz*0.25*(1-flicker);
          ctx.fillStyle=`rgba(50,55,60,${0.45*dim})`;
          ctx.beginPath();ctx.ellipse(sx,dripY,drSz*0.12,drSz*0.25,0,0,Math.PI*2);ctx.fill();
        }
      }
    } // dx
  } // dy
  } // propPasses pass
}

// V103: Line-of-sight check — returns true if no wall blocks the view from (x0,y0) to (x1,y1)
function hasLOS(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const steps=Math.ceil(dist*3); // check every ~0.33 tiles
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const cx=x0+dx*t,cy=y0+dy*t;
    if(isWall(cx,cy))return false;
  }
  return true;
}

// Draw entities (monsters/chests/boss) in the first-person corridor
function drawCorridorEntities(t,dir,fov,horizonY,maxDist){
  const ents=[];
  // Monsters
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const mx2=Math.floor(m.x),my2=Math.floor(m.y);
    if(!G.explored[my2]||!G.explored[my2][mx2])continue;
    const dx=m.x-G.px,dy=m.y-G.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist)continue;
    const angle=Math.atan2(dy,dx)-dir;
    let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
    if(Math.abs(na)>fov/2+0.3)continue;
    if(!hasLOS(G.px,G.py,m.x,m.y))continue; // V103: wall occlusion
    ents.push({type:'mon',m,x:m.x,y:m.y,dist,angle:na,scaleX:Math.cos(na)});
  }
  // Chests
  for(const c of G.mapChests){
    if(c.opened)continue;
    if(!G.explored[c.y]||!G.explored[c.y][c.x])continue;
    const cx2=c.x+0.5,cy2=c.y+0.5;
    const dx=cx2-G.px,dy=cy2-G.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist)continue;
    const angle=Math.atan2(dy,dx)-dir;
    let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
    if(Math.abs(na)>fov/2+0.3)continue;
    if(!hasLOS(G.px,G.py,cx2,cy2))continue; // V103: wall occlusion
    ents.push({type:'chest',x:cx2,y:cy2,dist,angle:na,scaleX:Math.cos(na)});
  }
  // V96: Shop NPCs
  for(const sh of G.mapShops){
    const sx2=Math.floor(sh.x),sy2=Math.floor(sh.y);
    if(!G.explored[sy2]||!G.explored[sy2][sx2])continue;
    const cx2=sh.x+0.5,cy2=sh.y+0.5;
    const dx=cx2-G.px,dy=cy2-G.py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxDist)continue;
    const angle=Math.atan2(dy,dx)-dir;
    let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
    if(Math.abs(na)>fov/2+0.3)continue;
    if(!hasLOS(G.px,G.py,cx2,cy2))continue; // V103: wall occlusion
    ents.push({type:'shop',x:cx2,y:cy2,dist,angle:na,scaleX:Math.cos(na)});
  }
  // Boss
  if(!G.bossFed){
    const bx=G.mapW-2+0.5,by=G.mapH-2+0.5;
    const mbx=Math.floor(bx),mby=Math.floor(by);
    if(G.explored[mby]&&G.explored[mby][mbx]){
      const dx=bx-G.px,dy=by-G.py;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=maxDist){
        const angle=Math.atan2(dy,dx)-dir;
        let na=angle;while(na>Math.PI)na-=Math.PI*2;while(na<-Math.PI)na+=Math.PI*2;
        if(Math.abs(na)<=fov/2+0.3){
          if(hasLOS(G.px,G.py,bx,by)){ // V103: wall occlusion
            ents.push({type:'boss',x:bx,y:by,dist,angle:na,scaleX:Math.cos(na)});
          }
        }
      }
    }
  }
  // Sort by distance (far to near)
  ents.sort((a,b)=>b.dist-a.dist);

  for(const e of ents){
    const screenT=(e.angle/(fov/2)+1)/2; // 0=left,1=right
    const sx=lerp(W*0.38,W*0.62,screenT);
    const scale=Math.max(0.1,1/(e.dist*0.6+0.3));
    const sz=H*0.3*scale;
    const bob=Math.sin(t*0.004+e.x*3)*1.5*scale; // V55: reduced from 3 to 1.5 for less floating
    const dim=Math.min(1,4/(e.dist+0.5));

    // V55: Shadow on floor — at entity's feet, stays on ground (no bob)
    const esz=(e.type==='boss')?sz*1.5:sz;

// ================================================================
//  PLAYER MOVEMENT (first-person controls)
// ================================================================
function updateMovement(dt){
  if(G.state!=='explore')return;
  const spd=3.2; // V103: slower for comfort (was 4.8)
  const turnSpd=1.8; // V103: much slower turning to reduce dizziness (was 3.0)
  let forward=0,turn=0,strafe=0;
  
  // Keyboard: W/Up=forward, S/Down=back, A/Left=turn left, D/Right=turn right
  if(keys['w']||keys['ArrowUp'])forward+=1;
  if(keys['s']||keys['ArrowDown'])forward-=1;
  if(keys['a']||keys['ArrowLeft'])turn-=1;
  if(keys['d']||keys['ArrowRight'])turn+=1;
  // V103: Q/E for strafe (side-step without turning)
  if(keys['q'])strafe-=1;
  if(keys['e'])strafe+=1;
  
  // Joystick: up=forward, down=back, left=turn left, right=turn right
  if(G.joystick.active){
    const dx=G.joystick.cx-G.joystick.sx;
    const dy=G.joystick.cy-G.joystick.sy;
    const mag=Math.sqrt(dx*dx+dy*dy);
    if(mag>5){
      const nx=dx/mag, ny=dy/mag;
      // ny<0 (up) = forward, ny>0 (down) = backward
      forward+=-ny;
      // nx left/right = turn (change facing direction)
      turn+=nx;
    }
  }
  
  // Apply turning
  if(Math.abs(turn)>0.01){
    G.pdir+=turn*turnSpd*dt;
  }
  
  // V103: Apply strafe (side-step perpendicular to facing direction)
  if(Math.abs(strafe)>0.01){
    const strafeDir=G.pdir+Math.PI/2; // perpendicular
    const mvX=Math.cos(strafeDir)*Math.sign(strafe);
    const mvY=Math.sin(strafeDir)*Math.sign(strafe);
    const moveAmt=Math.abs(strafe)*spd*dt*0.7; // slower strafe than forward
    const margin=0.25;
    const nx=G.px+mvX*moveAmt;
    const ny=G.py+mvY*moveAmt;
    if(!isWall(nx+mvX*margin,G.py))G.px=nx;
    if(!isWall(G.px,ny+mvY*margin))G.py=ny;
    G.stepTimer+=dt;
    if(G.stepTimer>0.5){G.stepTimer=0;S.step()}
    revealFog();
  }
  
  // Apply forward/backward movement
  if(Math.abs(forward)>0.05){
    const mvX=Math.cos(G.pdir)*Math.sign(forward);
    const mvY=Math.sin(G.pdir)*Math.sign(forward);
    const moveAmt=Math.abs(forward)*spd*dt;
    const margin=0.2; // V52: slightly smaller margin (was 0.25)
    const nx=G.px+mvX*moveAmt;
    const ny=G.py+mvY*moveAmt;
    // V52: Improved collision — try full move, then slide on each axis, then diagonal check
    if(!isWall(nx+mvX*margin,ny+mvY*margin)){
      // Full move is clear — go for it
      G.px=nx;G.py=ny;
    }else{
      // Try sliding on X only
      if(!isWall(nx+mvX*margin,G.py))G.px=nx;
      // Try sliding on Y only
      if(!isWall(G.px,ny+mvY*margin))G.py=ny;
    }
    
    // Footstep sound
    G.stepTimer+=dt;
    if(G.stepTimer>0.4){G.stepTimer=0;S.step()}
    
    // Reveal fog of war around player
    revealFog();
  }
}

function revealFog(){
  const radius=4; // Increased from 3 to 4 for better visibility
  const px2=Math.floor(G.px),py2=Math.floor(G.py);
  for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
    const x=px2+dx,y=py2+dy;
    if(x>=0&&x<G.mapW&&y>=0&&y<G.mapH){
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=radius)G.explored[y][x]=true;
    }
  }
}

function updateMapMons(dt){
  if(G.state!=='explore')return;
  // V96: Respawn dead monsters after 30 seconds
  const now=Date.now();
  for(const m of G.mapMons){
    if(!m.alive&&m.deadTime){
      if(now-m.deadTime>30000){ // 30s respawn
        m.alive=true;m.deadTime=null;
        // Respawn at a random open position far from player
        const opens=[];
        for(let y=0;y<G.mapH;y++)for(let x=0;x<G.mapW;x++){
          if(G.map[y][x]===0){
            const d=Math.sqrt((x+0.5-G.px)**2+(y+0.5-G.py)**2);
            if(d>5)opens.push([x,y]);
          }
        }
        if(opens.length>0){
          const op=opens[ri(0,opens.length-1)];
          m.x=op[0]+0.5;m.y=op[1]+0.5;
          m.dir=rand(0,Math.PI*2);
        }
      }
    }
    if(!m.alive)continue;
    // Wander randomly
    m.dir+=rand(-0.5,0.5)*dt;
    const spd=m.isElite?0.3:0.5;
    const nx=m.x+Math.cos(m.dir)*spd*dt;
    const ny=m.y+Math.sin(m.dir)*spd*dt;
    
    // V15: Check open directions — if monster is in a dead-end (3+ walls around),
    // force it to turn toward the open direction
    const mx2=Math.floor(m.x),my2=Math.floor(m.y);
    const openDirs=[];
    const dirChecks=[[0,-1,0],[1,0,Math.PI/2],[0,1,Math.PI],[-1,0,-Math.PI/2]];
    for(const[dx,dy,da]of dirChecks){
      const tx=mx2+dx,ty=my2+dy;
      if(tx>=0&&tx<G.mapW&&ty>=0&&ty<G.mapH&&G.map[ty][tx]!==1){
        openDirs.push(da);
      }
    }
    // If in dead-end (only 1 open direction or less), force turn
    if(openDirs.length<=1 && openDirs.length>0){
      m.dir=openDirs[0];
    }
    
    // V15: Use larger collision margin to prevent getting stuck in wall corners
    const margin=0.35;
    const checkX=nx+Math.cos(m.dir)*margin;
    const checkY=ny+Math.sin(m.dir)*margin;
    if(!isWall(checkX,m.y)&&!isWall(nx,m.y))m.x=nx;
    if(!isWall(m.x,checkY)&&!isWall(m.x,ny))m.y=ny;
    
    // Keep in bounds
    m.x=clamp(m.x,0.5,G.mapW-0.5);
    m.y=clamp(m.y,0.5,G.mapH-0.5);
    
    // Elite monsters chase player if close
    if(m.isElite){
      const dx=G.px-m.x,dy=G.py-m.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<3){m.dir=Math.atan2(dy,dx)}
    }
  }
}

function checkEncounters(){
  if(G.state!=='explore')return;
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const dx=m.x-G.px,dy=m.y-G.py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<0.5){
      // Trigger combat!
      startEncounter(m);
      return;
    }
  }
  // V96: Shop NPC encounter — V103: edge-triggered (same as boss door)
  // Only fires ONCE when walking INTO the shop area. Standing inside no longer re-opens shop.
  for(const sh of G.mapShops){
    const dx=sh.x+0.5-G.px,dy=sh.y+0.5-G.py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<1.0){
      if(!G.shopNear){G.shopNear=true;G.state='shop';S.bell();showMsg('欢迎光临地下商城!',60)}
    }else if(d>1.8){
      G.shopNear=false; // reset when far enough away
    }
  }
  // Boss encounter (V101: edge-triggered — fires ONCE when walking INTO the boss
  // gate area. Standing inside no longer re-opens bossAsk every 100ms, which
  // trapped the player before. After leaving the gate, re-entry triggers again.)
  if(!G.bossFed){
    const bx=G.mapW-2+0.5,by=G.mapH-2+0.5;
    const d=Math.sqrt((bx-G.px)**2+(by-G.py)**2);
    const near=d<1.0;
    if(near&&!G.bossDoorNear){
      G.bossDoorNear=true;
      if(!G.bossDefeated){startBossEncounter()}
      else{G.state='bossAsk';S.bell();showMsg('给 '+EDEF[G.bossDishKey].n+' 做菜!',60)}
    }else if(!near&&G.bossDoorNear){
      G.bossDoorNear=false;
    }
  }
}

function checkChests(){
  if(G.state!=='explore')return;
  for(const c of G.mapChests){
    if(c.opened)continue;
    const dx=c.x+0.5-G.px,dy=c.y+0.5-G.py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<0.8){
      c.opened=true;
      G.player.gold+=c.gold;
      showMsg('宝箱! 获得 '+c.gold+' 金币',90);
      S.bell();
      // Chance to drop ingredient
      if(Math.random()<0.5){
        const f=FLOORS[G.floor];
        const ingKey=EDEF[pick(f.pool)].drop;
        const ing=ING[ingKey];
        if(ing){G.ings.push(ingKey);showMsg('宝箱! '+c.gold+'金 + '+ing.n+'!',90)}
      }
    }
  }
}

function startEncounter(m){
  m.alive=false;
  m.deadTime=Date.now(); // V96: Record death time for respawn
  S.combat();
  const ed=EDEF[m.key];
  G.enemies=[mkEnemy(m.key,G.floor)];
  if(G.floor>=1&&!ed.boss&&Math.random()<0.3)
    G.enemies.push(mkEnemy(pick(FLOORS[G.floor].pool),G.floor));
  G.drawPile=G.runDeck.slice();shuf(G.drawPile);G.hand=[];G.discard=[];
  G.player.block=0;G.player.poison=0;G.player.burnDot=0;G.riposteDmg=0;G.fortifyStack=0;
  drawHand(5);G.player.energy=G.player.maxE;G.turn='p';G.state='battle';G.sel=-1;
  G.cookedThisTurn=0;G.cookEatenThisTurn=0;G.player.tempStr=0;
  showMsg('遭遇战: '+ed.n+'!',60);
}

function startBossEncounter(){
  // V96: If boss has been fed and next floor unlocked, go to next floor
  if(G.bossFed){enterFloor(G.floor+1);return}
  // V101: If boss already defeated but not fed — don't loop back to bossAsk.
  // Player can still re-fight the boss to grind drops (reset defeated flag so
  // the fight behaves normally again). bossAsk is only reached via onClear.
  if(G.bossDefeated){
    G.bossDefeated=false;
    G.bossFirstKill=true; // treat as re-fight: skip story, drop straight to bossAsk on next kill
  }
  const ed=EDEF[G.bossDishKey];
  G.enemies=[mkEnemy(G.bossDishKey,G.floor)];G.lastBossKey=G.bossDishKey;
  G.drawPile=G.runDeck.slice();shuf(G.drawPile);G.hand=[];G.discard=[];
  G.player.block=0;G.player.poison=0;G.player.burnDot=0;G.riposteDmg=0;G.fortifyStack=0;
  drawHand(5);G.player.energy=G.player.maxE;G.turn='p';G.state='battle';G.sel=-1;
  G.cookedThisTurn=0;G.cookEatenThisTurn=0;G.player.tempStr=0;
  showMsg('Boss战: '+ed.n+'!',60);
}

function mkEnemy(key,floor){
  const d=EDEF[key];const fs=floor!=null?floor:G.floor;
  const hpMul=1+fs*0.12;const aMul=1+fs*0.08;
  const hp=Math.floor(d.hp*hpMul);const a=Math.floor(d.a*aMul);
  return{...d,key,hp,maxHp:hp,burn:0,poisonDmg:0,intent:a,dead:false,baseA:a,hitCount:0,enraged:false,isElite:G._encounterElite||false}
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function drawHand(n){for(let i=0;i<n;i++){if(G.drawPile.length===0){if(G.discard.length===0)break;G.drawPile=G.discard.slice();G.discard=[];shuf(G.drawPile)}G.hand.push(G.drawPile.shift());S.draw()}}
function addLog(m){G.log=(G.log||[]).slice(-2);G.log.push(m)}

function playCard(hi,ei){
  if(G.turn!=='p'||G.state!=='battle')return;
  const id=G.hand[hi];if(!id)return;const c=getCardInfo(id);if(!c)return;
  if(G.player.energy<c.c)return;
  G.player.energy-=c.c;S.play();
  if(c.t==='atk'){
    const hits=c.hits||1;const totalStr=G.player.str+G.player.tempStr;
    for(let h=0;h<hits;h++){
      if(c.aoe)G.enemies.forEach(e=>{if(!e.dead){dmgEnemy(e,c.v+totalStr,c.v);S.hit()}});
      else{const alive=G.enemies.filter(e=>!e.dead);let tgt;if(alive.length===1)tgt=alive[0];else{const e=G.enemies[ei];if(!e||e.dead)break;tgt=e}dmgEnemy(tgt,c.v+totalStr,c.v);S.hit()}
      G.combo++;G.comboT=60;if(G.combo>1){fT(W/2,H*.22,COMBO_NAMES[Math.min(G.combo,10)]||'连击!','#ff0',26);S.hit()}
    }
  }else if(c.t==='def'){G.player.block+=c.v;S.def();fT(W*.5,H*.4,'+'+c.v,'#5c8');if(c.riposte)G.riposteDmg=c.riposte}
  if(c.draw)drawHand(c.draw);
  if(c.gainE)G.player.energy=Math.min(G.player.maxE,G.player.energy+c.gainE);
  if(c.burn&&G.enemies[ei])G.enemies[ei].burn+=c.burn;
  if(c.poison){const tgt=G.enemies[ei]||G.enemies.filter(e=>!e.dead)[0];if(tgt)tgt.poisonDmg=(tgt.poisonDmg||0)+c.poison}
  if(c.fortify)G.fortifyStack=c.fortify;
  G.discard.push(G.hand.splice(hi,1)[0]);G.sel=-1;
  if(G.pet&&G.pet.hp>0&&G.state==='battle')setTimeout(()=>petAttack(),200);
  const alive=G.enemies.filter(e=>!e.dead);if(alive.length===0)onClear(G.enemies.some(e=>e.boss));
}

function dmgEnemy(e,amt,baseAtk){
  if(e.phase&&Math.random()<0.25){const idx=G.enemies.indexOf(e);fT(W/2,H*.3,'闪避!','#aaf',18);S.def();return}
  if(e.hp/e.maxHp<0.3&&baseAtk>=15){amt=Math.floor(amt*1.5);fT(W/2,H*.25,'处决!','#f00',16)}
  if(e.boss){const cap=(baseAtk||amt)*BOSS_DMG_CAP+15;if(amt>cap){amt=cap}}
  e.hp-=amt;const idx=G.enemies.indexOf(e);
  pS(W/2,H*.35,'#f44',6);fT(W/2,H*.3,'-'+amt,'#f44',20);FX.shake=Math.max(FX.shake,4);
  if(e.enrage&&!e.enraged){e.hitCount++;if(e.hitCount>=e.enrage){e.enraged=true;e.baseA=Math.floor(e.baseA*1.5);e.intent=e.baseA;fT(W/2,H*.2,'狂暴!','#f00',24)}}
  if(e.hp<=0){e.dead=true;e.hp=0;S.kill();pS(W/2,H*.35,'#fa0',16);if(!G.meta.seenMobs.includes(e.key))G.meta.seenMobs.push(e.key);onKill(e)}
}
function onKill(e){
  // V97: Combine all drops into one message to avoid showMsg overwrite
  const msgs=[];
  if(e.drop){
    if(G.ings.length<MAX_INGS){G.ings.push(e.drop);msgs.push('获得: '+ING[e.drop].n)}
    else msgs.push('背包满! '+ING[e.drop].n+' 丢弃');
  }
  if(!e.boss&&Math.random()<.25){const s=pick(Object.keys(SEASONS));G.seasons.push(s);msgs.push('调味料: '+SEASONS[s].n)}
  const goldAmt=e.boss?ri(20,40):ri(5,10);
  G.player.gold+=goldAmt;
  msgs.push((e.boss?'Boss':'')+'掉落 '+goldAmt+' 金币');
  showMsg(msgs.join(' | '),90);
  if(e.boss){
    G.bossDefeated=true;G.lastWasBoss=true;G.lastBossKey=e.key;
    // V105: Boss drops its ingredient too (for replay cooking)
    if(e.drop&&G.ings.length<MAX_INGS){G.ings.push(e.drop)}
    if(!G.meta.seenBoss.includes(e.key))G.meta.seenBoss.push(e.key);
    S.bell();if(!G.meta.seenRecipes.includes(e.drop))G.meta.seenRecipes.push(e.drop);save();
  }
  // V96: Reduced delay from 600ms to 300ms for snappier combat end
  setTimeout(()=>{G.enemies=G.enemies.filter(en=>!en.dead);if(G.enemies.length===0&&G.state==='battle')onClear(G.lastWasBoss);G.lastWasBoss=false},300);
}

function onClear(wasBoss){
  if(G.state!=='battle')return;
  if(wasBoss){if(!G.bossFirstKill){G.bossFirstKill=true;G.state='bossStory';S.bell()}else{G.state='bossAsk';S.bell()}return}
  G.state='reward';FX.shake=5;FX.flash='#cfa';FX.fa=.4;
  G.rewards=[];for(let i=0;i<3;i++)G.rewards.push(pick(REWARD_P));
  G.rewardSeason=pick(Object.keys(SEASONS));
}

function endTurn(){
  if(G.turn!=='p'||G.state!=='battle')return;S.clk();G.turn='e';
  G.discard.push(...G.hand);G.hand=[];G.player.block=0;G.player.tempStr=0;G.cookedThisTurn=0;G.cookEatenThisTurn=0;
  if(G.fortifyStack>0){G.player.block+=G.fortifyStack;fT(W*.5,H*.42,'+'+G.fortifyStack,' #5c8')}
  G.enemies.forEach(e=>{
    if(e.dead)return;
    if(e.burn>0){e.hp-=e.burn;pS(W/2,H*.3,'#f60',6);e.burn=0;if(e.hp<=0){e.dead=true;e.hp=0;S.kill();onKill(e)}}
    if(e.poisonDmg>0){e.hp-=e.poisonDmg;pS(W/2,H*.3,'#a0f',6);if(e.hp<=0){e.dead=true;e.hp=0;S.kill();onKill(e)}e.poisonDmg=Math.max(0,e.poisonDmg-1)}
  });
  if(G.player.poison>0){G.player.hp-=G.player.poison;fT(W*.3,H*.4,'-'+G.player.poison,'#a0f');G.player.poison--;if(G.player.hp<=0){G.player.hp=0;G.state='dead';S.die();save();return}}
  if(G.player.burnDot>0){G.player.hp-=G.player.burnDot;fT(W*.3,H*.4,'-'+G.player.burnDot,'#f60');G.player.burnDot--;if(G.player.hp<=0){G.player.hp=0;G.state='dead';S.die();save();return}}
  G.combo=0;
}

let _etGuard=false;
function enemyAct(){
  G.enemies.forEach((e,i)=>{
    if(e.dead)return;
    setTimeout(()=>{
      if(e.dead||G.state!=='battle')return;
      let dmg=(e.baseA||e.a)+(e.boss?ri(0,3):0);
      if(G.pet&&G.pet.hp>0&&Math.random()<.3){G.pet.hp-=dmg;fT(W*.7,H*.6,'宠物-'+dmg,'#f44',16);if(G.pet.hp<=0){G.pet=null;save()}}
      else if(G.player.block>0){
        if(G.player.block>=dmg){G.player.block-=dmg;fT(W*.3,H*.4,'格挡!','#5c8');S.def()}
        else{const rem=dmg-G.player.block;G.player.hp-=rem;G.player.block=0;fT(W*.3,H*.4,'-'+rem,'#f44');S.hurt();FX.shake=8;FX.flash='#f44';FX.fa=.3;
          if(e.lifesteal)e.hp=Math.min(e.maxHp,e.hp+Math.floor(rem/2));
          if(G.riposteDmg>0){dmgEnemy(e,G.riposteDmg,G.riposteDmg);G.riposteDmg=0}}
      }
      else{G.player.hp-=dmg;fT(W*.3,H*.4,'-'+dmg,'#f44');S.hurt();FX.shake=8;FX.flash='#f44';FX.fa=.3;
        if(e.lifesteal)e.hp=Math.min(e.maxHp,e.hp+Math.floor(dmg/2));
        if(G.riposteDmg>0){dmgEnemy(e,G.riposteDmg,G.riposteDmg);G.riposteDmg=0}}
      if(e.burnAtk){G.player.burnDot=(G.player.burnDot||0)+2}
      if(e.poison){G.player.poison=(G.player.poison||0)+1}
      if(G.player.hp<=0){G.player.hp=0;G.state='dead';S.die();save()}
    },i*600);
  });
  setTimeout(()=>{
    if(G.state==='battle'&&G.player.hp>0){
      G.turn='p';G.player.energy=G.player.maxE;G.player.block=0;
      if(G.fortifyStack>0)G.player.block+=G.fortifyStack;
      drawHand(5);G.player.tempStr=0;G.cookedThisTurn=0;G.cookEatenThisTurn=0;
      // V96: Pet hunger increases each combat turn, leaves at max
      if(G.pet){G.pet.hunger++;if(G.pet.hunger>=G.pet.maxHunger){fT(W/2,H*.5,G.pet.n+'饿了,离开了!','#f44',18);G.pet=null;save()}}
    }
    _etGuard=false;
  },G.enemies.length*600+200);
}

function petAttack(){if(!G.pet||G.pet.hp<=0)return;const alive=G.enemies.filter(e=>!e.dead);if(alive.length===0)return;const tgt=pick(alive);if(Math.random()<0.6){dmgEnemy(tgt,G.pet.a+Math.floor(G.player.str*.5));fT(W*.7,H*.55,G.pet.n+' 攻击!','#fa0',14)}}
