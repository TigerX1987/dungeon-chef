function startCook(){
  if(G.ings.length===0){showMsg('没有食材!',60);return}
  if(G.state==='battle'&&(G.cookedThisTurn||0)>=COOK_PER_TURN){showMsg('本轮已烹饪!',60);return}
  if(G.dishes.length>=MAX_DISHES){showMsg('菜品已满!',60);return}
  const cw=COOKWARE[G.cookware]||COOKWARE.none; // V96: cookware affects speed
  G.cook={ingIdx:null,ptr:0,dir:1,spd:(0.008+G.floor*.0014)*cw.spdMul,started:false,ready:false,seasonSel:-1};
  G.prevState=G.state;G.state='cook';G.sel=-1;
}
function selIng(i){if(!G.cook)return;G.cook.ingIdx=i;G.cook.started=false;G.cook.ptr=0;G.cook.dir=1;const cw=COOKWARE[G.cookware]||COOKWARE.none;G.cook.spd=(0.008+G.floor*.0014)*cw.spdMul;G.cook.seasonSel=-1;S.clk()}
function finishCook(){
  if(!G.cook||G.cook.ingIdx===null)return;
  const p=G.cook.ptr;let q;
  const cw=COOKWARE[G.cookware]||COOKWARE.none; // V96: cookware widens perfect zone
  const goodMargin=0.08*cw.spdMul; // V97: good zone scales with cookware speed multiplier
  if(p<cw.perfectMin-goodMargin||p>cw.perfectMax+goodMargin){q='burn';S.cookB()}else if(p>=cw.perfectMin&&p<=cw.perfectMax){q='perfect';S.cookP()}else{q='good';S.cookG()}
  const ingId=G.ings[G.cook.ingIdx];const ing=ING[ingId];const dish={...ing.dish,quality:q,ingId};
  if(q==='perfect')dish.h=Math.floor(dish.h*2);else if(q==='burn')dish.h=Math.floor(dish.h*.4);
  if(G.cook.seasonSel>=0&&G.cook.seasonSel<G.seasons.length){
    const sKey=G.seasons[G.cook.seasonSel];dish.season=sKey;dish.n=ing.dish.n+'('+SEASONS[sKey].n+')';
    if(sKey==='salt')dish.h+=3;else if(sKey==='pepper'){dish.burn=2;dish.h+=1}else if(sKey==='sugar')dish.h+=5;
    G.seasons.splice(G.cook.seasonSel,1);
  }
  if(!G.meta.seenRecipes.includes(ingId))G.meta.seenRecipes.push(ingId);
  G.dishes.push(dish);G.ings.splice(G.cook.ingIdx,1);
  showMsg((q==='perfect'?'完美':q==='good'?'合格':'糊了')+'! '+ing.dish.n,90);
  if(G.prevState==='battle')G.cookedThisTurn++;
  G.cook=null;G.state=G.prevState||'explore';
}
function eatDish(){
  if(G.dishes.length===0)return;
  if(G.state==='battle'&&(G.cookEatenThisTurn||0)>=EAT_PER_TURN){showMsg('本轮已吃过了!',60);return}
  G.cookEatenThisTurn++;
  const d=G.dishes.shift();const heal=Math.min(MAX_HEAL,d.h);
  G.player.hp=Math.min(G.player.maxHp,G.player.hp+heal);S.eat();fT(W*.3,H*.4,'+'+heal,'#5c8');
  if(d.b)applyBuff(d);
  // V105: Mega dishes grant permanent stat boost
  if(d.b==='mega'){
    G.permBuffs.hp=(G.permBuffs.hp||0)+2;
    G.player.maxHp+=2;G.player.hp+=2;
    fT(W*.5,H*.35,'永久+2HP!','#fa0',16);
    showMsg('高级料理! 永久生命+2!',90);
    save();
  }
}
function applyBuff(d){switch(d.b){case'str':G.player.tempStr=Math.min(MAX_STR_TEMP,G.player.tempStr+2);break;case'speed':G.player.maxE=Math.min(5,G.player.maxE+1);break;case'block':G.player.block+=5;break;case'mega':G.player.tempStr=Math.min(MAX_STR_TEMP,G.player.tempStr+3);break}}
function canCookBossDish(){const bd=BOSS_DISH[G.bossDishKey];if(!bd)return false;for(const ing in bd.needs)if((G.ings.filter(i=>i===ing).length)<bd.needs[ing])return false;return true}
function cookBossDish(){const bd=BOSS_DISH[G.bossDishKey];if(!bd||!canCookBossDish())return;for(const ing in bd.needs)for(let r=0;r<bd.needs[ing];r++){const idx=G.ings.indexOf(ing);if(idx>=0)G.ings.splice(idx,1)}G.hasBossDish=true;S.cookP();save()}
function feedBoss(){if(!G.hasBossDish)return;G.hasBossDish=false;G.bossFed=true;S.bell();save()}
function pickReward(idx){if(idx>=0&&idx<G.rewards.length){G.runDeck.push(G.rewards[idx])}else if(idx===3&&G.rewardSeason){G.seasons.push(G.rewardSeason)}G.state='explore';S.clk()}

function render(t){
  G.time=t;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  
  if(FX.shake>.5){ctx.save();ctx.translate(rand(-FX.shake,FX.shake),rand(-FX.shake,FX.shake));FX.shake*=.85}
  if(G.comboT>0){G.comboT--;if(G.comboT===0)G.combo=0}
  
  switch(G.state){
    case'title':rTitle(t);break;
    case'explore':rExplore(t);break;
    case'battle':rBattle(t);break;
    case'cook':rCook(t);break;
    case'reward':rReward(t);break;
    case'bossStory':rBossStory(t);break;
    case'bossAsk':rBossAsk(t);break;
    case'bossFeed':rBossFeed(t);break;
    case'shop':rShop(t);break; // V96: shop UI
    case'codex':rCodex(t);break;
    case'dead':rDead(t);break;
    case'win':rWin(t);break;
  }
  
  P.forEach(p=>{ctx.globalAlpha=p.l;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
  FT.forEach(f=>{ctx.globalAlpha=f.l;dt(f.t,f.x,f.y,f.sz||22,f.col,'center','bold')});ctx.globalAlpha=1;
  if(FX.fa>0){ctx.fillStyle=FX.flash||'#fff';ctx.globalAlpha=FX.fa;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;FX.fa*=.9;if(FX.fa<.01)FX.fa=0}
  if(FX.shake>.5)ctx.restore();
  mc=false;
}

// V100: Fully procedural hands — no sprite images, clean edges, correct poses, bigger size
// Left hand: fist holding torch (back of hand faces viewer, fingers curl around handle)
// Right hand: fist holding dagger (back of hand faces viewer, blade extends from behind fist)
function drawHands(t,battle){
  const sc=battle?0.65:1.3; // V100: much bigger (was 0.50/1.05)
  const handBob=Math.sin(t*0.008)*3*sc;
  const torchFlame=0.85+Math.sin(t*0.02)*0.15+Math.sin(t*0.05)*0.05;
  const torchX=battle?W*0.16:W*0.20;
  const wpnX=battle?W*0.84:W*0.82;
  const handY=battle?H*0.94:H*0.88;

  const unit=Math.max(8,W*0.022*sc); // base unit for hand drawing

  // ===== Torch glow halo (drawn first, behind hands) =====
  const glowCx=torchX;
  const glowCy=handY-unit*2;
  const lGlow=ctx.createRadialGradient(glowCx,glowCy,0,glowCx,glowCy,Math.max(unit*8,W*0.5));
  lGlow.addColorStop(0,'rgba(255,190,80,0.50)');
  lGlow.addColorStop(0.12,'rgba(250,160,55,0.32)');
  lGlow.addColorStop(0.35,'rgba(200,100,35,0.14)');
  lGlow.addColorStop(0.7,'rgba(120,50,15,0.05)');
  lGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=lGlow;ctx.fillRect(0,glowCy-unit*6,W,unit*12);
  ctx.restore();

  // Warm spill light from torch toward right hand
  const rGlow=ctx.createRadialGradient(torchX,handY-unit*2,0,torchX,handY-unit*2,W*0.7);
  rGlow.addColorStop(0,'rgba(255,180,70,0.30)');
  rGlow.addColorStop(0.3,'rgba(220,130,45,0.15)');
  rGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=rGlow;ctx.fillRect(0,handY-unit*5,W,unit*8);
  ctx.restore();

  // ===== LEFT HAND: Torch =====
  ctx.save();
  ctx.translate(torchX,handY+handBob);
  // Torch handle (wooden stick)
  const handleH=unit*4;
  ctx.fillStyle='#5a3a1a';
  ctx.beginPath();
  ctx.roundRect?ctx.roundRect(-unit*0.35,-handleH,unit*0.7,handleH+unit,unit*0.3):ctx.rect(-unit*0.35,-handleH,unit*0.7,handleH+unit);
  ctx.fill();
  // Handle wrap (leather strips)
  ctx.fillStyle='#3a2510';
  for(let wi=0;wi<3;wi++){
    ctx.fillRect(-unit*0.38,-handleH*0.8+wi*unit*1.0,unit*0.76,unit*0.3);
  }
  // Torch head (wrapped rags at top)
  ctx.fillStyle='#6a4020';
  ctx.beginPath();ctx.ellipse(0,-handleH-unit*0.3,unit*0.7,unit*0.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3015';
  ctx.beginPath();ctx.ellipse(0,-handleH-unit*0.5,unit*0.55,unit*0.35,0,0,Math.PI*2);ctx.fill();

  // Fist (back of hand faces viewer — knuckles in front, fingers curl around handle)
  // Palm/fist body
  ctx.fillStyle='#c8956a';
  ctx.beginPath();ctx.ellipse(0,unit*0.3,unit*1.1,unit*1.3,0,0,Math.PI*2);ctx.fill();
  // Knuckles (4 bumps facing viewer, slightly above center)
  ctx.fillStyle='#d4a07a';
  for(let ki=0;ki<4;ki++){
    const kx=-unit*0.75+ki*unit*0.5;
    ctx.beginPath();ctx.arc(kx,unit*0.1,unit*0.28,0,Math.PI*2);ctx.fill();
  }
  // Finger curl shadows (below knuckles, wrapping around handle)
  ctx.fillStyle='#a87850';
  for(let fi=0;fi<4;fi++){
    const fx=-unit*0.75+fi*unit*0.5;
    ctx.beginPath();ctx.ellipse(fx,unit*0.55,unit*0.26,unit*0.4,0,0,Math.PI*2);ctx.fill();
  }
  // Thumb (on right side of fist, visible curl)
  ctx.fillStyle='#c8956a';
  ctx.beginPath();ctx.ellipse(unit*0.85,unit*0.2,unit*0.35,unit*0.55,-0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d4a07a';
  ctx.beginPath();ctx.arc(unit*0.95,unit*0.0,unit*0.22,0,Math.PI*2);ctx.fill();
  // Wrist cuff (leather bracer)
  ctx.fillStyle='#3a2510';
  ctx.beginPath();ctx.ellipse(0,unit*1.5,unit*0.9,unit*0.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3015';
  ctx.beginPath();ctx.ellipse(0,unit*1.5,unit*0.85,unit*0.45,0,0,Math.PI*2);ctx.fill();
  // Shadow gradient on fist (darker bottom/right)
  const fistShade=ctx.createRadialGradient(-unit*0.3,unit*0.1,0,-unit*0.3,unit*0.1,unit*2);
  fistShade.addColorStop(0,'rgba(0,0,0,0)');
  fistShade.addColorStop(0.6,'rgba(0,0,0,0.15)');
  fistShade.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=fistShade;ctx.beginPath();ctx.ellipse(0,unit*0.3,unit*1.1,unit*1.3,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // ===== Torch flame (V100: procedural multi-layer animated fire) =====
  const fCx=torchX;
  const fCy=handY+handBob-handleH-unit*0.5;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  // Fire layers — outer to inner, each with independent flicker
  const fireLayers=[
    {sz:1.0,c:'255,60,5',a:0.50,off:0,phase:0.003},
    {sz:0.78,c:'255,100,15',a:0.60,off:unit*0.4,phase:0.004},
    {sz:0.58,c:'255,150,30',a:0.70,off:unit*0.8,phase:0.005},
    {sz:0.38,c:'255,200,60',a:0.85,off:unit*1.2,phase:0.006},
    {sz:0.22,c:'255,240,150',a:0.95,off:unit*1.6,phase:0.008},
  ];
  for(const fl of fireLayers){
    const flicker=Math.sin(t*fl.phase)*0.15+Math.sin(t*fl.phase*2.3)*0.08;
    const fw=unit*1.2*fl.sz*(1+flicker);
    const fh=unit*3.0*fl.sz*torchFlame*(1+flicker*0.5);
    const fy=fCy-fl.off;
    const sway=Math.sin(t*fl.phase*1.5)*fw*0.15;
    ctx.fillStyle='rgba('+fl.c+','+(fl.a*torchFlame)+')';
    ctx.beginPath();
    ctx.moveTo(fCx+sway,fy+fh);
    ctx.quadraticCurveTo(fCx-fw+sway,fy+fh*0.3,fCx-fw*0.3+sway,fy-fh*0.5);
    ctx.quadraticCurveTo(fCx+sway,fy-fh,fCx+fw*0.3+sway*1.3,fy-fh*0.5);
    ctx.quadraticCurveTo(fCx+fw+sway*1.3,fy+fh*0.3,fCx+sway,fy+fh);
    ctx.fill();
  }
  // Bright core
  ctx.fillStyle='rgba(255,255,230,'+(0.6*torchFlame)+')';
  ctx.beginPath();ctx.ellipse(fCx,fCy+unit*0.5,unit*0.4,unit*1.2*torchFlame,0,0,Math.PI*2);ctx.fill();
  // Embers
  for(let ei=0;ei<6;ei++){
    const ex=fCx+Math.sin(t*0.01+ei*1.7)*unit*1.5;
    const ey=fCy-unit*3-ei*unit*0.8+Math.sin(t*0.02+ei)*unit*0.5;
    ctx.fillStyle='rgba(255,'+(100+ei*30)+',20,'+(0.55-ei*0.08)+')';
    ctx.beginPath();ctx.ellipse(ex,ey,unit*0.15,unit*0.15,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // ===== RIGHT HAND: Dagger =====
  ctx.save();
  ctx.translate(wpnX,handY+handBob*0.5);
  // Dagger blade (extends upward from behind fist)
  const bladeLen=unit*5;
  const bladeW=unit*0.6;
  // Blade gradient (steel with torch reflection)
  const bladeGrad=ctx.createLinearGradient(-bladeW,0,bladeW,0);
  bladeGrad.addColorStop(0,'#8899aa');
  bladeGrad.addColorStop(0.3,'#ccdde8');
  bladeGrad.addColorStop(0.5,'#eef5ff');
  bladeGrad.addColorStop(0.7,'#ccdde8');
  bladeGrad.addColorStop(1,'#8899aa');
  ctx.fillStyle=bladeGrad;
  ctx.beginPath();
  ctx.moveTo(0,-bladeLen); // tip
  ctx.lineTo(-bladeW,-bladeLen+bladeW*2);
  ctx.lineTo(-bladeW*0.8,-unit*0.5);
  ctx.lineTo(bladeW*0.8,-unit*0.5);
  ctx.lineTo(bladeW,-bladeLen+bladeW*2);
  ctx.closePath();
  ctx.fill();
  // Blade center ridge (highlight)
  ctx.strokeStyle='rgba(255,255,255,0.4)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,-bladeLen+bladeW);ctx.lineTo(0,-unit*0.5);ctx.stroke();
  // Crossguard
  ctx.fillStyle='#8a6a3a';
  ctx.beginPath();
  ctx.ellipse(0,-unit*0.4,unit*1.0,unit*0.35,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#a68a50';
  ctx.beginPath();
  ctx.ellipse(0,-unit*0.45,unit*0.95,unit*0.3,0,0,Math.PI*2);
  ctx.fill();
  // Handle/pommel
  ctx.fillStyle='#3a2510';
  ctx.fillRect(-unit*0.3,-unit*0.2,unit*0.6,unit*0.8);
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(-unit*0.25,-unit*0.15,unit*0.5,unit*0.7);
  // Pommel cap
  ctx.fillStyle='#8a6a3a';
  ctx.beginPath();ctx.arc(0,unit*0.65,unit*0.3,0,Math.PI*2);ctx.fill();

  // Fist (back of hand faces viewer — gripping dagger handle, blade goes up behind fist)
  ctx.fillStyle='#c8956a';
  ctx.beginPath();ctx.ellipse(0,unit*0.5,unit*1.1,unit*1.3,0,0,Math.PI*2);ctx.fill();
  // Knuckles (4 bumps facing viewer)
  ctx.fillStyle='#d4a07a';
  for(let ki=0;ki<4;ki++){
    const kx=-unit*0.75+ki*unit*0.5;
    ctx.beginPath();ctx.arc(kx,unit*0.3,unit*0.28,0,Math.PI*2);ctx.fill();
  }
  // Finger curl shadows
  ctx.fillStyle='#a87850';
  for(let fi=0;fi<4;fi++){
    const fx=-unit*0.75+fi*unit*0.5;
    ctx.beginPath();ctx.ellipse(fx,unit*0.75,unit*0.26,unit*0.4,0,0,Math.PI*2);ctx.fill();
  }
  // Thumb (on left side of right fist)
  ctx.fillStyle='#c8956a';
  ctx.beginPath();ctx.ellipse(-unit*0.85,unit*0.4,unit*0.35,unit*0.55,0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d4a07a';
  ctx.beginPath();ctx.arc(-unit*0.95,unit*0.2,unit*0.22,0,Math.PI*2);ctx.fill();
  // Wrist cuff
  ctx.fillStyle='#3a2510';
  ctx.beginPath();ctx.ellipse(0,unit*1.7,unit*0.9,unit*0.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3015';
  ctx.beginPath();ctx.ellipse(0,unit*1.7,unit*0.85,unit*0.45,0,0,Math.PI*2);ctx.fill();
  // Shadow on fist
  const fistShade2=ctx.createRadialGradient(unit*0.3,unit*0.3,0,unit*0.3,unit*0.3,unit*2);
  fistShade2.addColorStop(0,'rgba(0,0,0,0)');
  fistShade2.addColorStop(0.6,'rgba(0,0,0,0.2)');
  fistShade2.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=fistShade2;ctx.beginPath();ctx.ellipse(0,unit*0.5,unit*1.1,unit*1.3,0,0,Math.PI*2);ctx.fill();
  // Warm edge light from torch (left side of right hand)
  const warmEdge=ctx.createRadialGradient(-unit*2,unit*0.3,0,-unit*2,unit*0.3,unit*4);
  warmEdge.addColorStop(0,'rgba(255,180,70,0.25)');
  warmEdge.addColorStop(0.5,'rgba(255,120,40,0.10)');
  warmEdge.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=warmEdge;ctx.beginPath();ctx.ellipse(0,unit*0.5,unit*1.3,unit*1.5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.restore();

  // Ground shadows under both hands
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(torchX,handY+unit*2.5,unit*1.5,unit*0.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(wpnX,handY+unit*2.5,unit*1.3,unit*0.45,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPlayerStatus(){
  // V75: Q-cute panel — warm rounded card with brown border
  const x=4,y=6,w=112,hb=12; // V80: wider panel + taller HP bar (was 100/10)
  const panelH=G.pet?88:52; // dynamic height
  rr(x-3,y-3,w+6,panelH,10,_uiBg,_uiBdr);
  // V92: HP bar with texture — gradient fill + segment marks
  rr(x,y,w,hb,5,'rgba(40,8,4,.85)','#5a2010');
  const hpRatio=Math.max(0,G.player.hp/G.player.maxHp);
  if(hpRatio>0){
    // V92: Gradient HP fill — top brighter (health glow), bottom darker
    const hpGrad=ctx.createLinearGradient(x,y,x,y+hb);
    hpGrad.addColorStop(0,'#f66');
    hpGrad.addColorStop(0.4,'#e44');
    hpGrad.addColorStop(1,'#b22');
    rr(x+1,y+1,(w-2)*hpRatio,hb-2,4,null);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x+1,y+1,(w-2)*hpRatio,hb-2);
    ctx.clip();
    ctx.fillStyle=hpGrad;
    ctx.fillRect(x+1,y+1,(w-2)*hpRatio,hb-2);
    ctx.restore();
    // V92: Segment marks — small dark lines every 25%
    ctx.fillStyle='rgba(0,0,0,.3)';
    for(let s=1;s<4;s++){
      const sx=x+(w*s/4);
      if(sx<x+1+w*hpRatio)ctx.fillRect(sx-0.5,y+1,1,hb-2);
    }
    // V92: Top highlight line for gloss
    ctx.fillStyle='rgba(255,200,150,.25)';
    ctx.fillRect(x+2,y+1,(w-4)*hpRatio,1.5);
  }
  dt(G.player.hp+'/'+G.player.maxHp,x+w/2,y+9,11,'#fff'); // V80: larger text (was 9)
  // V92: Heart icon next to HP label
  ctx.fillStyle='#e44';
  ctx.beginPath();
  ctx.moveTo(x+w-12,y+4);
  ctx.bezierCurveTo(x+w-16,y,x+w-20,y+4,x+w-16,y+8);
  ctx.bezierCurveTo(x+w-12,y+12,x+w-12,y+12,x+w-8,y+8);
  ctx.bezierCurveTo(x+w-4,y+4,x+w-8,y,x+w-12,y+4);
  ctx.fill();
  // V92: Energy with lightning bolt icon
  dt('EN:'+G.player.energy+'/'+G.player.maxE,x+2,y+23,10,'#6dd','left');
  ctx.strokeStyle='#6dd'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+w-14,y+16); ctx.lineTo(x+w-16,y+20); ctx.lineTo(x+w-13,y+20); ctx.lineTo(x+w-15,y+24); ctx.stroke();
  // V92: Gold with coin icon
  dt('GOLD:'+G.player.gold,x+2,y+35,10,'#fc4','left');
  ctx.fillStyle='#fc4';
  ctx.beginPath(); ctx.arc(x+w-14,y+32,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a80';
  ctx.beginPath(); ctx.arc(x+w-14,y+32,2,0,Math.PI*2); ctx.fill();
  
  // Pet — V75: cute pet card
  if(G.pet){
    rr(x+2,y+40,w-4,24,6,'rgba(35,20,8,.7)','#a80');
    dt(G.pet.n,x+5,y+51,10,'#fc4','left'); // V80: larger (was 8)
    dt('HP'+G.pet.hp+' 饥饿'+G.pet.hunger+'/'+G.pet.maxHunger,x+5,y+61,9,'#bba','left'); // V96: hunger/max
  }
  
  // Ingredients/Dishes — V75: cute labels, slightly larger
  const ingY=y+(G.pet?74:46);
  dt('FOOD:'+G.ings.length+'/'+MAX_INGS,x+2,ingY,10,'#8e8','left'); // V80: larger (was 8)
  dt('DISH:'+G.dishes.length+'/'+MAX_DISHES,x+55,ingY,10,'#8cc','left'); // V80: larger + moved (was 8, x+50)
}

function drawMinimap(t){
  const ms=Math.min(4,Math.max(2,4*G.miniZoom)); // V39: smaller minimap
  const mw=G.mapW*ms, mh=G.mapH*ms;
  const mx2=W-mw-6, my2=8;
  
  // V75: Q-cute minimap frame — warm bordered card
  rr(mx2-4,my2-4,mw+8,mh+8,8,_uiBg,_uiBdr);
  
  // Draw cells
  for(let y=0;y<G.mapH;y++)for(let x=0;x<G.mapW;x++){
    const cx=mx2+x*ms, cy=my2+y*ms;
    if(!G.explored[y][x]){ctx.fillStyle='#0a0806';ctx.fillRect(cx,cy,ms,ms);continue}
    const cell=G.map[y][x];
    if(cell===1){ctx.fillStyle='#3a3022';ctx.fillRect(cx,cy,ms,ms)}
    else if(cell===2){ctx.fillStyle='#4a3018';ctx.fillRect(cx,cy,ms,ms)}
    else{ctx.fillStyle='#282014';ctx.fillRect(cx,cy,ms,ms)}
  }
  
  // Monsters on minimap (only if explored)
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const mx3=Math.floor(m.x),my3=Math.floor(m.y);
    if(!G.explored[my3]||!G.explored[my3][mx3])continue;
    ctx.fillStyle=m.isElite?'#f80':'#f44';
    ctx.beginPath();ctx.arc(mx2+m.x*ms,my2+m.y*ms,ms*0.35,0,Math.PI*2);ctx.fill();
  }
  
  // Boss on minimap
  if(!G.bossFed){
    const bx=G.mapW-2,by=G.mapH-2;
    if(G.explored[by]&&G.explored[by][bx]){
      ctx.fillStyle=G.bossDefeated?'#fa0':'#f00';
      ctx.beginPath();ctx.arc(mx2+(bx+0.5)*ms,my2+(by+0.5)*ms,ms*0.5,0,Math.PI*2);ctx.fill();
    }
  }
  
  // Chests
  for(const c of G.mapChests){
    if(c.opened||!G.explored[c.y]||!G.explored[c.y][c.x])continue;
    ctx.fillStyle='#fd4';ctx.fillRect(mx2+c.x*ms+1,my2+c.y*ms+1,ms-2,ms-2);
  }
  
  // V96: Shops on minimap
  for(const sh of G.mapShops){
    const sx3=Math.floor(sh.x),sy3=Math.floor(sh.y);
    if(!G.explored[sy3]||!G.explored[sy3][sx3])continue;
    ctx.fillStyle='#8cf';
    ctx.beginPath();ctx.arc(mx2+(sh.x+0.5)*ms,my2+(sh.y+0.5)*ms,ms*0.4,0,Math.PI*2);ctx.fill();
  }
  
  // Player (arrow)
  const px2=mx2+G.px*ms, py2=my2+G.py*ms;
  ctx.fillStyle='#4f4';
  ctx.save();ctx.translate(px2,py2);ctx.rotate(G.pdir);
  ctx.beginPath();ctx.moveTo(ms*0.5,0);ctx.lineTo(-ms*0.3,-ms*0.3);ctx.lineTo(-ms*0.3,ms*0.3);ctx.closePath();ctx.fill();
  ctx.restore();
  
  // V75: Q-cute zoom button
  const zbX=W-30, zbY=my2+mh+6, zbS=22;
  const zH=hitBtn(zbX,zbY,zbS,zbS);
  rr(zbX,zbY,zbS,zbS,7,zH?'rgba(50,36,20,.85)':'rgba(28,20,14,.82)',zH?_uiBdrHi:_uiBdr);
  dt(G.miniZoom>1?'-':'+',zbX+zbS/2,zbY+zbS/2+6,16,zH?'#fc4':'#a88','center','bold');
  if(zH&&mc){mc=false;S.clk();G.miniZoom=G.miniZoom>1?1:2}
}

function drawJoystick(){
  const jx=60,jy=H-80,jr=45;
  if(G.joystick.active){
    // V75: Q-cute joystick — warm style
    ctx.strokeStyle='rgba(180,140,70,.4)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(G.joystick.sx,G.joystick.sy,jr,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(200,150,70,.35)';
    ctx.beginPath();ctx.arc(G.joystick.cx,G.joystick.cy,20,0,Math.PI*2);ctx.fill();
    dt('↑',G.joystick.sx,G.joystick.sy-jr-10,14,'rgba(200,255,200,.5)','center');
    dt('←',G.joystick.sx-jr-10,G.joystick.sy+4,14,'rgba(200,200,255,.5)','center');
    dt('→',G.joystick.sx+jr+10,G.joystick.sy+4,14,'rgba(200,200,255,.5)','center');
  } else {
    // V75: Q-cute hint — warm style
    ctx.strokeStyle='rgba(120,90,50,.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(jx,jy,jr,0,Math.PI*2);ctx.stroke();
    dt('移动',jx,jy-4,12,'#764','center','bold');
    dt('↑前进 ←→侧移',jx,jy+12,9,'#543','center');
  }
  
  // V104: Joystick activation — only consume mc if NOT in an action button zone.
  // Action buttons are now at right edge x≈W-62, y≈H*0.30..H*0.30+2*(34+6). Check first.
  const actBtnLeft=W-62-30,actBtnRight=W-62+52+30;
  const actBtnTop=H*0.30-14,actBtnBot=H*0.30+2*(34+6)+14;
  const inActionZone=mx>=actBtnLeft&&mx<=actBtnRight&&my>=actBtnTop&&my<=actBtnBot;
  
  if(mc&&!G.joystick.active&&!inActionZone){
    const jdx=mx-jx,jdy=my-jy;
    if(jdx*jdx+jdy*jdy<jr*jr*2.0){ // touch radius ~63px
      G.joystick.active=true;G.joystick.sx=mx;G.joystick.sy=my;
      G.joystick.cx=mx;G.joystick.cy=my;mc=false;
    }
  }
  if(G.joystick.active){
    G.joystick.cx=mx;G.joystick.cy=my;
    // Deactivate if finger lifts (handled by touchend)
  }
}

function rBattle(t){
  ctx.setTransform(1,0,0,1,0,0);

  // First-person corridor background (shared renderer)
  renderFP(t,true);

  // Combo display
  if(G.combo>=2){const ca=Math.min(1,G.comboT/60);ctx.globalAlpha=ca;dt(COMBO_NAMES[Math.min(G.combo,10)]||G.combo+'连!',W/2,H*.12,22,'#ff0','center','bold');ctx.globalAlpha=1}

  // Top bar
  drawPlayerBattleBar();

  // Enemies — drawn in corridor perspective, closer = larger (V100: much bigger monsters)
  G.hEnemy=-1;
  const alive=G.enemies.filter(e=>!e.dead);
  const totalSlots=alive.length;
  G.enemies.forEach((e,i)=>{
    if(e.dead)return;
    const slotIdx=alive.indexOf(e);
    // Closer enemies (index 0) are larger and lower
    const perspective=1-(slotIdx/Math.max(totalSlots,2))*0.25;
    const ex=W/2+(slotIdx-(totalSlots-1)/2)*Math.min(90,W*0.22)*perspective;
    const ey=H*(0.22+0.10*(1-perspective))+8;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath();
    ctx.ellipse(ex,ey+65*perspective,48*perspective,10*perspective,0,0,Math.PI*2);
    ctx.fill();

    // Monster image — V100: enlarged 70% (was min(130,110), now min(220,185))
    const img=getImg(EDEF[e.key].ico);
    if(img&&img.complete&&img.naturalWidth>0){
      const bob=Math.sin(t*.003+i)*5;
      const baseSz=Math.min(220,185+(e.boss?45:0));
      const sz=baseSz*perspective;
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.6)';
      ctx.shadowBlur=12;
      ctx.drawImage(img,ex-sz/2,ey-sz/2+bob,sz,sz);
      ctx.restore();
    }
    // Name + HP bar (V100: scale with bigger monsters)
    const ew=100*perspective;
    const hby=ey+60*perspective;
    rr(ex-ew/2,hby,ew,10,3,'#1a0000','#300');
    rr(ex-ew/2+1,hby+1,(ew-2)*(e.hp/e.maxHp),8,2,'#c33');
    dt(e.hp+'/'+e.maxHp,ex,hby+8*perspective,9,'#fff');
    dt(e.n,ex,ey-46*perspective,12*perspective,e.boss?'#fa0':'#ddd','center','bold');
    // Intent
    if(G.turn==='p'){
      const iy=ey-26*perspective;
      const atkVal=e.baseA||e.a;
      dt('⚔'+atkVal+(e.boss?'+?':''),ex,iy,11*perspective,e.lifesteal?'#a6f':e.burnAtk?'#f60':e.poison?'#a0f':'#f44','center','bold');
    }
    // Status
    if(e.burn>0)dt('🔥'+e.burn,ex-30*perspective,ey-48*perspective,9,'#f60');
    if(e.poisonDmg>0)dt('☠'+e.poisonDmg,ex+30*perspective,ey-48*perspective,9,'#a0f');
    if(e.enraged)dt('狂暴!',ex,ey-60*perspective,10,'#f00','center','bold');
    // Targeting (V100: bigger hit area for larger monsters)
    if(G.sel>=0&&G.turn==='p'){
      const c=CARDS[G.hand[G.sel]];if(c&&c.t==='atk'){
        const hv=Math.abs(mx-ex)<60*perspective&&Math.abs(my-ey)<70*perspective;
        ctx.strokeStyle=hv?'#ff0':'rgba(255,255,0,.3)';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(ex,ey+55*perspective,52*perspective,14*perspective,0,0,Math.PI*2);ctx.stroke();
        if(hv)G.hEnemy=i;
      }
    }
  });

  // Pet (bottom-left corner)
  if(G.pet){
    const px=W*.05,py=H*.5;
    rr(px-5,py-25,70,50,5,'rgba(20,15,5,.8)','#a80');
    const img=getImg(G.pet.ico);if(img&&img.complete){ctx.drawImage(img,px,py-15,30,30)}
    dt(G.pet.n,px+38,py-12,9,'#fa0','left');
    dt('HP'+G.pet.hp,px+38,py,8,'#f88','left');
  }

  // V100: Action buttons — vertical column on right edge, no overlap with cards
  const actX=W-62, actW=52, actH=34, actGap=6;
  const actY0=H*0.30;
  // Cook button
  const cH=hitBtn(actX,actY0,actW,actH);
  const canCook=G.ings.length>0&&(G.cookedThisTurn||0)<COOK_PER_TURN&&G.dishes.length<MAX_DISHES;
  rr(actX,actY0,actW,actH,6,cH&&canCook?'#332':'#1a1a1a','#fa0');
  dt('烹饪',actX+actW/2,actY0+actH/2+5,11,canCook?'#fa0':'#555','center','bold');
  if(cH&&mc&&canCook){mc=false;S.clk();startCook()}
  // Eat button
  const actY1=actY0+actH+actGap;
  const eH=hitBtn(actX,actY1,actW,actH);
  const canEat=G.dishes.length>0&&(G.cookEatenThisTurn||0)<EAT_PER_TURN;
  rr(actX,actY1,actW,actH,6,eH&&canEat?'#1a2a1a':'#1a1a1a','#5c8');
  dt('吃菜',actX+actW/2,actY1+actH/2+5,11,canEat?'#5c8':'#555','center','bold');
  if(eH&&mc&&canEat){mc=false;S.clk();eatDish()}
  // Feed pet (if pet exists)
  const actY2=actY1+actH+actGap;
  if(G.pet&&G.dishes.length>0){
    const pH2=hitBtn(actX,actY2,actW,actH);
    rr(actX,actY2,actW,actH,6,pH2?'#2a2a1a':'#1a1a1a','#a80');
    dt('喂宠',actX+actW/2,actY2+actH/2+5,11,'#a80','center','bold');
    if(pH2&&mc){mc=false;S.clk();feedPet()}
  }
  // End turn button
  const etY=actY2+(G.pet&&G.dishes.length>0?actH+actGap:0);
  const etH=hitBtn(actX,etY,actW,actH);
  rr(actX,etY,actW,actH,6,etH&&G.turn==='p'?'#3a1a1a':'#1a1a1a','#c44');
  dt('结束',actX+actW/2,etY+actH/2+5,11,G.turn==='p'?'#c44':'#555','center','bold');
  if(etH&&mc&&G.turn==='p'){mc=false;S.clk();endTurn();if(!_etGuard){_etGuard=true;setTimeout(()=>enemyAct(),300)}}

  if(G.turn==='e')dt('敌人行动中...',W/2,H*.52,13,'#f44','center','bold');

  // Hand cards
  drawHandUI();

  // Targeting prompt
  if(G.sel>=0&&G.turn==='p'){
    const c=CARDS[G.hand[G.sel]];
    if(c&&c.t==='atk'){
      const al=G.enemies.filter(e=>!e.dead);
      if(al.length===1)dt('(自动攻击)',W/2,H*.64,13,'#fa0','center','bold');
      else if(G.hEnemy>=0&&mc)playCard(G.sel,G.hEnemy);
      else dt('点击目标',W/2,H*.64,13,'#fa0','center','bold');
    }
  }
  // V96: Hide hands during battle to avoid blocking cards
  // drawHands(t,true);  // disabled — hands not shown in combat
}

    if(sel){ctx.strokeStyle='#ff0';ctx.lineWidth=2.5;rr(cx-1,cy+up-1,cw+2,ch+2,9,null,'#ff0')}
    if(hv&&mc&&G.turn==='p'){S.clk();if(G.player.energy<c.c){mc=false;return}
      if(c.t==='atk'){const al=G.enemies.filter(e=>!e.dead);if(al.length===1){mc=false;playCard(i,0);return}G.sel=(G.sel===i)?-1:i;mc=false}
      else{mc=false;playCard(i,-1)}
    }

function drawIco(type,cx,cy,sz,col){
  ctx.save();ctx.translate(cx,cy);const s=sz/32;ctx.scale(s,s);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  switch(type){
    case'sword':ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(8,6);ctx.moveTo(-6,8);ctx.lineTo(6,-4);ctx.stroke();break;
    case'shield':ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(10,-6);ctx.lineTo(6,8);ctx.quadraticCurveTo(0,12,-6,8);ctx.lineTo(-10,-6);ctx.closePath();ctx.stroke();ctx.globalAlpha=.2;ctx.fill();ctx.globalAlpha=1;break;
    case'flame':ctx.beginPath();ctx.moveTo(0,-12);ctx.quadraticCurveTo(8,-4,6,4);ctx.quadraticCurveTo(4,10,0,12);ctx.quadraticCurveTo(-4,10,-6,4);ctx.quadraticCurveTo(-8,-4,0,-12);ctx.fill();break;
  }
  ctx.restore();
}

// ---- Cooking ----
function rCook(t){
  ctx.setTransform(1,0,0,1,0,0);

  // V106: Enhanced campfire & pot first-person view
  const g=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,W*0.8);
  g.addColorStop(0,'#1a0a05');
  g.addColorStop(0.5,'#0d0503');
  g.addColorStop(1,'#050203');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // Dungeon corridor dim background — stone wall texture
  ctx.fillStyle='#0a0608';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(W,0);
  ctx.lineTo(W*0.75,H*0.35);
  ctx.lineTo(W*0.25,H*0.35);
  ctx.closePath();
  ctx.fill();
  // Stone brick lines on wall
  ctx.strokeStyle='rgba(60,40,30,0.15)';ctx.lineWidth=1;
  for(let bx=0;bx<W;bx+=40){ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx*0.75+W*0.125,H*0.35);ctx.stroke()}
  for(let by=0;by<H*0.35;by+=20){const t=by/(H*0.35);ctx.beginPath();ctx.moveTo(W*0.25*t,by);ctx.lineTo(W-W*0.25*t,by);ctx.stroke()}

  // Fire glow — flickering
  const flicker=0.8+Math.sin(t*.012)*0.2+Math.sin(t*.03)*0.1;
  const fg=ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,160*flicker);
  fg.addColorStop(0,`rgba(255,120,30,${0.25*flicker})`);
  fg.addColorStop(0.5,`rgba(200,60,20,${0.12*flicker})`);
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg;
  ctx.fillRect(0,0,W,H);

  // Stone fire pit base — individual stones
  const stoneColors=['#2a2218','#3a3028','#1a1810','#4a3a2a','#2a2018'];
  for(let si=0;si<12;si++){
    const sa=si/12*Math.PI*2;const sr=55+Math.random()*25;
    ctx.fillStyle=stoneColors[si%stoneColors.length];
    ctx.beginPath();ctx.ellipse(W/2+Math.cos(sa)*sr*0.5,H*0.58+Math.sin(sa)*12,sr*0.15,6+Math.random()*4,sa,0,Math.PI*2);ctx.fill();
  }
  // Inner pit darker
  ctx.fillStyle='#1a1410';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.58,55,14,0,0,Math.PI*2);
  ctx.fill();
  // Embers
  for(let ei=0;ei<8;ei++){
    const ex=W/2+Math.sin(t*.005+ei*2.1)*40;const ey=H*0.58+Math.cos(t*.004+ei*1.7)*8;
    ctx.fillStyle=`rgba(255,${120+Math.random()*80},20,${0.3+0.2*Math.sin(t*.01+ei)})`;
    ctx.beginPath();ctx.arc(ex,ey,2+Math.random()*2,0,Math.PI*2);ctx.fill();
  }

  // Pot (big cauldron) — metallic gradient
  const potG=ctx.createLinearGradient(W/2-45,H*0.35,W/2+45,H*0.55);
  potG.addColorStop(0,'#5a4a3a');potG.addColorStop(0.3,'#3a3028');potG.addColorStop(0.7,'#2a2218');potG.addColorStop(1,'#1a1410');
  ctx.fillStyle=potG;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.48,45,38,0,0,Math.PI*2);
  ctx.fill();
  // Pot highlight
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.ellipse(W/2-15,H*0.42,15,20,-0.3,0,Math.PI*2);ctx.fill();
  // Pot rim — metallic
  const rimG=ctx.createLinearGradient(W/2-48,H*0.41,W/2+48,H*0.41);
  rimG.addColorStop(0,'#5a4a3a');rimG.addColorStop(0.5,'#7a6a5a');rimG.addColorStop(1,'#5a4a3a');
  ctx.fillStyle=rimG;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,48,12,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2a2218';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,42,9,0,0,Math.PI*2);
  ctx.fill();
  // Pot liquid surface — bubbling
  ctx.fillStyle=`rgba(${100+30*flicker},${60+20*flicker},20,0.8)`;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,38,8,0,0,Math.PI*2);
  ctx.fill();
  // Bubbles
  for(let i=0;i<6;i++){
    const bx=W/2+Math.sin(t*.002+i*1.5)*20;
    const by=H*0.41+Math.cos(t*.003+i*1.2)*4;
    ctx.fillStyle=`rgba(255,${180+Math.sin(t*.01+i)*40},60,${0.3+0.2*Math.sin(t*.008+i*2)})`;
    ctx.beginPath();
    ctx.arc(bx,by,2+Math.sin(t*.01+i),0,Math.PI*2);
    ctx.fill();
  }

  // Fire flames — layered
  for(let i=0;i<5;i++){
    const fx=W/2-20+i*10;
    const fh=25+Math.sin(t*.015+i*1.3)*12+Math.sin(t*.007+i*2.1)*6;
    const fy=H*0.52;
    const fgr=ctx.createLinearGradient(fx,fy-fh,fx,fy);
    fgr.addColorStop(0,`rgba(255,240,180,${0.8*flicker})`);
    fgr.addColorStop(0.3,`rgba(255,180,60,${0.7*flicker})`);
    fgr.addColorStop(0.6,`rgba(255,100,20,${0.5*flicker})`);
    fgr.addColorStop(1,'rgba(100,20,0,0)');
    ctx.fillStyle=fgr;
    ctx.beginPath();
    ctx.moveTo(fx-6,fy);
    ctx.quadraticCurveTo(fx-3,fy-fh*0.4,fx,fy-fh);
    ctx.quadraticCurveTo(fx+3,fy-fh*0.4,fx+6,fy);
    ctx.closePath();
    ctx.fill();
  }
  // Sparks
  for(let si=0;si<3;si++){
    const sx=W/2+Math.sin(t*.02+si*5)*15;const sy=H*0.45+Math.sin(t*.03+si*3)*20;
    ctx.fillStyle=`rgba(255,200,100,${0.3+0.2*Math.sin(t*.05+si)})`;

  // Title
  dt('烹饪',W/2,30,22,'#fa0','center','bold');
  dt('停在绿色区域获得完美品质!',W/2,52,11,'#888');

  if(!G.cook)return;

      const x=sx2+col*(iw+gap),y=95+row*(ih+gap);
      const hv=hitBtn(x,y,iw,ih);
      // V106: Enhanced ingredient card with gradient background
      const ingG=ctx.createLinearGradient(x,y,x,y+ih);
      ingG.addColorStop(0,hv?'#443':'#2a2a1a');ingG.addColorStop(1,hv?'#332':'#1a1a0a');
      rr(x,y,iw,ih,6,ingG,RARE_COL[ing.r]||'#666');
      // Rarity dot
      ctx.fillStyle=RARE_COL[ing.r]||'#666';
      ctx.beginPath();ctx.arc(x+10,y+10,4,0,Math.PI*2);ctx.fill();
      // Ingredient icon (small simple shape based on type)
      ctx.fillStyle='#8a8a7a';
      if(ing.n.includes('肉')||ing.n.includes('Meat')||ing.n.includes('鼠')){
        ctx.beginPath();ctx.arc(x+iw/2,y+20,8,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#aa6a5a';ctx.beginPath();ctx.arc(x+iw/2,y+20,6,0,Math.PI*2);ctx.fill();
      }else if(ing.n.includes('翅')||ing.n.includes('Wing')){
        ctx.beginPath();ctx.moveTo(x+iw/2-8,y+18);ctx.lineTo(x+iw/2+8,y+12);ctx.lineTo(x+iw/2+6,y+26);ctx.closePath();ctx.fill();
      }else if(ing.n.includes('Jelly')||ing.n.includes('胶')||ing.n.includes('史莱姆')){
        ctx.fillStyle='#5a8a5a';ctx.beginPath();ctx.arc(x+iw/2,y+20,7,0,Math.PI*2);ctx.fill();
      }else{
        ctx.fillStyle='#6a7a5a';ctx.beginPath();ctx.arc(x+iw/2,y+20,6,0,Math.PI*2);ctx.fill();
      }
      dt(ing.n,x+iw/2,y+38,10,'#ccc','center','bold');
      dt('+'+ing.dish.h+'HP',x+iw/2,y+50,9,'#888');
      if(hv&&mc){S.clk();selIng(i)}
    });
    if(btn(W/2-50,H-58,100,36,'取消','#888')&&mc){S.clk();G.cook=null;G.state=G.prevState||'explore'}

  }

    ptrGlow.addColorStop(0,'rgba(255,255,255,.8)');
    ptrGlow.addColorStop(.5,'rgba(255,255,200,.3)');
    ptrGlow.addColorStop(1,'rgba(255,255,0,0)');
    ctx.fillStyle=ptrGlow;ctx.fillRect(px-20,barY-6,40,barH+12);
    // Pointer body — thick white bar with gold edge

    ctx.fillStyle='#fc4';ctx.fillRect(px-4,barY-6,2,barH+12);ctx.fillRect(px+2,barY-6,2,barH+12);
    // Triangle indicator on top
    ctx.fillStyle='#fc4';ctx.beginPath();ctx.moveTo(px-7,barY-6);ctx.lineTo(px+7,barY-6);ctx.lineTo(px,barY-14);ctx.closePath();ctx.fill();

    // Stop button
    if(btn(W/2-60,barY+52,120,40,'停止!','#f44')&&mc){S.clk();G.cook.ready=true;finishCook()}
  }

  if(G.seasons.length>0&&!G.cook.ready){
    dt('调味(可选):',40,H*0.82,11,'#aaa','left');
    G.seasons.slice(0,4).forEach((s,i)=>{
      const sx=40+i*80,sy=H*0.85;

    });
  }

  if(btn(W/2-50,H-58,100,36,'取消','#888')&&mc){S.clk();G.cook=null;G.state=G.prevState||'explore'}
}

// ---- Shop (V106) ----
function rShop(t){
  const g=ctx.createRadialGradient(W/2,H*.3,0,W/2,H*.3,W);g.addColorStop(0,'#1a1a25');g.addColorStop(1,'#0a060a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Decorative border
  ctx.strokeStyle='rgba(200,170,80,0.15)';ctx.lineWidth=2;
  ctx.strokeRect(8,8,W-16,H-16);
  dt('地下商城',W/2,30,22,'#fc4','center','bold');
  dt('金币: '+G.player.gold,W/2,54,14,'#fa0');
  // Find nearest shop
  const sh=G.mapShops[0];if(!sh){if(btn(W/2-60,H*.5,120,38,'离开','#888')&&mc){S.clk();G.state='explore'}return}
  let yStart=78;
  sh.items.forEach((item,i)=>{
    if(item.stock<=0)return;
    let name,desc,color;
    if(item.isCookware){
      const cw=COOKWARE[item.key];name=cw.n;desc=cw.desc;color='#fc8';
    }else if(item.isSeason){
      const sv=SEASONS[item.key];name=sv.n;desc=sv.eff;color='#fc8';
    }else{
      const ing=ING[item.key];name=ing.n;desc='+'+ing.dish.h+'HP';color=RARE_COL[ing.r]||'#ccc';
    }
    const bought=item._bought||false;
    const canAfford=G.player.gold>=item.price&&!bought;
    const iy=yStart+i*52;
    const hv=hitBtn(20,iy,W-40,46);
    rr(20,iy,W-40,46,8,hv?'rgba(45,35,20,.9)':'rgba(28,20,14,.85)',bought?'#444':(hv?_uiBdrHi:_uiBdr));
    dt(name,40,iy+20,13,bought?'#666':color,'left','bold');
    dt(desc,40,iy+38,10,'#888','left');
    dt(item.price+'金',W-60,iy+20,12,bought?'#444':(canAfford?'#fa0':'#f44'),'right','bold');
    dt(bought?'已购':(item.stock>1?'x'+item.stock:''),W-60,iy+38,9,'#666','right');
    if(hv&&mc&&canAfford&&!bought){
      mc=false;S.clk();G.player.gold-=item.price;item._bought=true;item.stock--;
      if(item.isCookware){
        G.cookware=item.key;showMsg('装备: '+name+'!',90);
      }else if(item.isSeason){
        G.seasons.push(item.key);showMsg('购买: '+name,60);
      }else{
        G.ings.push(item.key);showMsg('购买: '+name,60);
      }
    }
  });

  // V105: Card upgrade section — merge 2 same cards + gold → upgraded card
  const upgY=yStart+sh.items.length*52+8;
  ctx.strokeStyle='rgba(200,170,80,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(20,upgY);ctx.lineTo(W-20,upgY);ctx.stroke();
  dt('--- 卡牌强化 ---',W/2,upgY+16,12,'#fc4','center','bold');
  dt('消耗2张相同卡+金币升级(至多+3)',W/2,upgY+32,9,'#886','center');

  // Find upgradeable cards in deck (group by base+lv)
  const upgList=[];
  const deckCounts={};
  G.runDeck.forEach(id=>{
    const p=parseCardId(id);
    if(!UPGRADEABLE.includes(p.base))return;
    if(p.lv>=3)return; // max +3
    const key=p.base+'+'+p.lv;
    deckCounts[key]=(deckCounts[key]||0)+1;
  });
  for(const key in deckCounts){
    if(deckCounts[key]>=2){
      const parts=key.split('+');
      const base=parts[0],lv=parseInt(parts[1]);
      const ci=getCardInfo(key);
      const cost=UPGRADE_COST[lv];
      upgList.push({base,lv,cost,key,ci});
    }
  }

  if(upgList.length===0){
    dt('没有可强化的卡牌',W/2,upgY+52,11,'#666','center');
    dt('(需要2张相同的卡)',W/2,upgY+68,9,'#554','center');
  }else{
    upgList.forEach((u,i)=>{
      const uy=upgY+48+i*56;
      const hv=hitBtn(20,uy,W-40,48);
      const canAfford=G.player.gold>=u.cost;
      const nextLv=u.lv+1;
      const nextCi=getCardInfo(u.base+'+'+nextLv);
      rr(20,uy,W-40,48,8,hv?'rgba(45,35,20,.9)':'rgba(28,20,14,.85)',hv?_uiBdrHi:_uiBdr);
      // Current card name → upgraded card name
      dt(u.ci.n+' x2 → '+nextCi.n,30,uy+18,12,canAfford?'#fc4':'#886','left','bold');
      // Show stat change
      const oldV=u.ci.v,newV=nextCi.v;
      dt(u.ci.t==='atk'?(oldV+'→'+newV+'伤害'):(oldV+'→'+newV+'护甲'),30,uy+36,10,'#aaa','left');
      dt(u.cost+'金',W-60,uy+18,12,canAfford?'#fa0':'#f44','right','bold');
      dt('费用',W-60,uy+36,9,'#666','right');
      if(hv&&mc&&canAfford){
        mc=false;S.clk();
        // Remove 2 source cards from deck, add 1 upgraded card
        let removed=0;
        for(let di=G.runDeck.length-1;di>=0&&removed<2;di--){
          if(parseCardId(G.runDeck[di]).base===u.base&&parseCardId(G.runDeck[di]).lv===u.lv){
            G.runDeck.splice(di,1);removed++;
          }
        }
        if(removed===2){
          G.runDeck.push(u.base+'+'+nextLv);
          G.player.gold-=u.cost;
          showMsg('强化成功! '+nextCi.n,90);
        }
      }
    });
  }

  if(btn(W/2-60,H*.86,120,40,'离开商城','#888')&&mc){S.clk();G.state='explore';G.shopNear=true; // V103: keep shopNear=true so standing in shop area doesn't re-trigger
    // Push player away from shop to prevent immediate re-entry
    for(const sh of G.mapShops){
      const dx=G.px-(sh.x+0.5),dy=G.py-(sh.y+0.5);
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<1.5&&d>0.01){
        // Push player 2 tiles away from shop
        G.px+=(dx/d)*2.0;G.py+=(dy/d)*2.0;
        // Clamp to walkable tiles
        if(isWall(G.px,G.py)){G.px=sh.x+0.5+2.0*(dx/d);G.py=sh.y+0.5+2.0*(dy/d)}
      }
    }
  } // V102: moved up from H-56 to avoid bottom-edge touch dead zone
}

      if(seen){const img=getImg(e.ico);if(img&&img.complete){ctx.drawImage(img,x+35,y+5,45,45)}
        dt(e.n,x+52,y+60,11,'#fa0','center','bold');dt('HP'+e.hp+' ATK'+e.a,x+52,y+75,9,'#f88')
      }else{ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x+5,y+5,95,100);dt('???',x+52,y+50,16,'#444','center','bold')}
    });
  }
  if(btn(W/2-50,H-50,100,36,'返回','#888')&&mc){S.clk();G.state=G.prevState||'title'}
}

function rDead(t){
  ctx.fillStyle='#0a060a';ctx.fillRect(0,0,W,H);
  dt('你倒下了...',W/2,H*.28,26,'#f44','center','bold');
  dt('第 '+(G.floor+1)+' 层',W/2,H*.36,16,'#888');
  dt('金币: '+G.player.gold,W/2,H*.41,14,'#fa0');
  if(btn(W/2-80,H*.55,160,42,'重新开始','#cfa')&&mc){S.clk();newRun()}
  if(btn(W/2-80,H*.55+50,160,42,'标题','#888')&&mc){S.clk();G.state='title'}
}

function rWin(t){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  dt('胜利!',W/2,H*.22,30,'#cfa','center','bold');
  dt('你征服了地牢!',W/2,H*.3,18,'#cfa');
  dt('金币: '+G.player.gold,W/2,H*.39,14,'#fa0');
  G.meta.bestFloor=Math.max(G.meta.bestFloor||0,G.floor+1);
  if(G.floor+1>=4&&!((G.meta.titles||[]).includes('征服者'))){G.meta.titles=G.meta.titles||[];G.meta.titles.push('征服者');save()}
  dt('称号: '+((G.meta.titles||[]).join(', ')||'无'),W/2,H*.44,12,'#cfa');
  if(btn(W/2-80,H*.6,160,42,'新一局','#cfa')&&mc){S.clk();newRun()}
  if(btn(W/2-80,H*.6+50,160,42,'标题','#888')&&mc){S.clk();G.state='title'}
}

// ---- Game Loop ----
let lastT=0;
function loop(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  pU(dt);
  updateMovement(dt);
  // V97: Throttle game logic to every 100ms instead of every frame for smoother rendering
  if(!loop._lt||t-loop._lt>100){loop._lt=t;updateMapMons(dt);checkEncounters();checkChests();}
  render(t);
  requestAnimationFrame(loop);
}

// ---- Init ----
loadSave();
G.meta.days=(G.meta.days||0)+1;
const today=new Date().toDateString();
if(G.meta.lastLogin!==today){
  if(G.meta.lastLogin){const d=new Date(G.meta.lastLogin);const diff=Math.floor((new Date(today)-d)/86400000);if(diff===1)G.meta.streak=(G.meta.streak||0)+1;else G.meta.streak=1}
  else G.meta.streak=1;G.meta.lastLogin=today;
}
save();
// V99: Startup — textures already generated synchronously, just wait for sprite images
function _startGame(){
  _setPct(100,'准备完毕!');
  // Fade out splash screen
  var sp=document.getElementById('splash');
  if(sp){
    sp.style.transition='opacity 0.5s';
    sp.style.opacity='0';
    setTimeout(function(){sp.style.display='none';},500);
  }
  requestAnimationFrame(loop);
  if(G.settings.bgm)bgmOn();
  _allResReady=true;
}
if(_allSpriteReady){
  _startGame();
}else{
  _setPct(10,_ldTips[0]);
  var _initWait=setInterval(function(){
    var pct=10+Math.min(85,Math.round(_resCount/_resTotal*85));
    _setPct(pct,_ldTips[Math.min(_resCount,_ldTips.length-1)]);
    if(_allSpriteReady){
      clearInterval(_initWait);
      _startGame();
    }
  },100);
}
</script>
