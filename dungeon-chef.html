// V54m: Unified hands rendering — called after UI overlay
function drawHands(t){
  const handBob=Math.sin(t*0.008)*3;
  const torchFlame=0.85+Math.sin(t*0.02)*0.15+Math.sin(t*0.05)*0.05;
  const torchX=W*0.18;
  const wpnX=W*0.82;

  // ---- LEFT: forearm + fist + torch ----
  // Torch warm glow illuminating the hand area
  const lGlow=ctx.createRadialGradient(torchX+10,H*0.58+handBob,0,torchX+10,H*0.58+handBob,W*0.32);
  lGlow.addColorStop(0,'rgba(240,160,60,0.35)');
  lGlow.addColorStop(0.25,'rgba(200,120,40,0.18)');
  lGlow.addColorStop(0.6,'rgba(120,60,20,0.06)');
  lGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lGlow;ctx.fillRect(0,H*0.30,W*0.60,H*0.70);

  // Forearm — short wide cone, from elbow (bottom edge) to wrist
  const lElbowX=torchX, lElbowW=55; // elbow at bottom of screen, wide
  const lWristX=torchX+5, lWristY=H*0.68+handBob, lWristW=34; // wrist narrower
  // Dark outline
  ctx.fillStyle='#0a0604';
  ctx.beginPath();
  ctx.moveTo(lElbowX-lElbowW,H+8);
  ctx.lineTo(lElbowX+lElbowW,H+8);
  ctx.quadraticCurveTo(lElbowX+lElbowW*0.7,lWristY+20, lWristX+lWristW,lWristY);
  ctx.lineTo(lWristX-lWristW,lWristY);
  ctx.quadraticCurveTo(lElbowX-lElbowW*0.7,lWristY+20, lElbowX-lElbowW,H+8);
  ctx.closePath();ctx.fill();
  // Skin fill — warm tan, lit by torch
  const lSkinGrad=ctx.createLinearGradient(lElbowX-lElbowW,0,lElbowX+lElbowW,0);
  lSkinGrad.addColorStop(0,'#6a4830');
  lSkinGrad.addColorStop(0.3,'#9a7048');
  lSkinGrad.addColorStop(0.6,'#c49870');
  lSkinGrad.addColorStop(1,'#7a5035');
  ctx.fillStyle=lSkinGrad;
  ctx.beginPath();
  ctx.moveTo(lElbowX-lElbowW+4,H+8);
  ctx.lineTo(lElbowX+lElbowW-4,H+8);
  ctx.quadraticCurveTo(lElbowX+lElbowW*0.6,lWristY+18, lWristX+lWristW-3,lWristY);
  ctx.lineTo(lWristX-lWristW+3,lWristY);
  ctx.quadraticCurveTo(lElbowX-lElbowW*0.6,lWristY+18, lElbowX-lElbowW+4,H+8);
  ctx.closePath();ctx.fill();

  // Leather bracer at wrist — dark brown leather, clearly not metal
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath();
  ctx.ellipse(lWristX,lWristY+2,lWristW+2,12,0.08,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3018';
  ctx.beginPath();
  ctx.ellipse(lWristX,lWristY,lWristW-1,10,0.08,0,Math.PI*2);ctx.fill();
  // Leather straps
  ctx.strokeStyle='#1a0e06';ctx.lineWidth=2;
  for(let bi=0;bi<3;bi++){
    const by=lWristY-5+bi*5;
    ctx.beginPath();ctx.ellipse(lWristX,by,lWristW-1,2.5,0.08,0,Math.PI*2);ctx.stroke();
  }
  // Buckle
  ctx.fillStyle='#8a7a4a';
  ctx.fillRect(lWristX+lWristW*0.5,lWristY-3,5,6);

  // FIST — large rounded, clearly a human fist gripping a torch

  ctx.fillStyle='#0a0604';
  ctx.beginPath();ctx.ellipse(lFistX,lFistY,lFistR+3,lFistR*0.85+3,0.12,0,Math.PI*2);ctx.fill();
  // Skin fill — warm tan
  ctx.fillStyle='#a87850';
  ctx.beginPath();ctx.ellipse(lFistX,lFistY,lFistR,lFistR*0.85,0.12,0,Math.PI*2);ctx.fill();

  // Knuckle bumps — 4 rounded bumps across the fist, more prominent

    // Knuckle bump
    ctx.fillStyle='#c09060';
    ctx.beginPath();ctx.ellipse(kx,ky,lFistR*0.19,lFistR*0.15,0.12,0,Math.PI*2);ctx.fill();
    // Knuckle highlight
    ctx.fillStyle='rgba(245,175,95,0.50)';
    ctx.beginPath();ctx.ellipse(kx+1,ky-1,lFistR*0.10,lFistR*0.07,0.12,0,Math.PI*2);ctx.fill();
  }
  // Knuckle crease lines — deeper
  ctx.strokeStyle='#4a2818';ctx.lineWidth=2;
  for(let ki=0;ki<3;ki++){
    const kx=lFistX-lFistR*0.35+ki*(lFistR*0.38);
    ctx.beginPath();
    ctx.moveTo(kx,lFistY-lFistR*0.40);
    ctx.lineTo(kx+3,lFistY+lFistR*0.18);

  }
  // Finger tips — small arcs at bottom of fist suggesting curled fingers
  ctx.strokeStyle='#5a3520';ctx.lineWidth=1.5;
  for(let ki=0;ki<4;ki++){

  ctx.fillStyle='rgba(230,165,95,0.40)';
  ctx.beginPath();ctx.ellipse(lFistX-lFistR*0.82,lFistY+3,6,4,-0.4,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#1a0e06';ctx.lineWidth=1;
  ctx.strokeRect(torchStickX-4,torchStickBot-55,8,55);
  // Torch head (wrapped rags)
  ctx.fillStyle='#2a1a08';
  ctx.beginPath();ctx.ellipse(torchStickX,torchStickBot-58,14,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3018';
  ctx.beginPath();ctx.ellipse(torchStickX-2,torchStickBot-59,10,6,0,0,Math.PI*2);ctx.fill();

    ctx.moveTo(torchStickX,fy+fh);
    ctx.quadraticCurveTo(torchStickX-fw,fy+fh*0.3,torchStickX-fw*0.3,fy-fh*0.5);
    ctx.quadraticCurveTo(torchStickX,fy-fh,torchStickX+fw*0.3,fy-fh*0.5);
    ctx.quadraticCurveTo(torchStickX+fw,fy+fh*0.3,torchStickX,fy+fh);
    ctx.fill();
  }
  // White-hot core
  ctx.fillStyle=`rgba(255,240,180,${0.60*torchFlame})`;
  ctx.beginPath();ctx.ellipse(torchStickX,flameY,3,8*torchFlame,0,0,Math.PI*2);ctx.fill();

  // ---- RIGHT: forearm + fist + dagger ----
  // Subtle warm glow
  const rGlow=ctx.createRadialGradient(wpnX-10,H*0.55+handBob*0.5,0,wpnX-10,H*0.55+handBob*0.5,W*0.28);
  rGlow.addColorStop(0,'rgba(200,130,50,0.20)');
  rGlow.addColorStop(0.3,'rgba(150,80,30,0.10)');
  rGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rGlow;ctx.fillRect(W*0.40,H*0.25,W*0.60,H*0.75);

  const rWristX=wpnX-5, rWristY=H*0.62+handBob*0.5, rWristW=32;
  const rFistX=rWristX-4, rFistY=rWristY-20;
  const rFistR=28;
  // FIST — large rounded
  ctx.fillStyle='#0a0604';
  ctx.beginPath();ctx.ellipse(rFistX,rFistY,rFistR+3,rFistR*0.85+3,-0.10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a87850';
  ctx.beginPath();ctx.ellipse(rFistX,rFistY,rFistR,rFistR*0.85,-0.10,0,Math.PI*2);ctx.fill();
  // Highlight (top-left, towards torch light)
  ctx.fillStyle='rgba(220,165,100,0.55)';
  ctx.beginPath();ctx.ellipse(rFistX-7,rFistY-7,rFistR*0.65,rFistR*0.50,-0.10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(240,180,105,0.30)';
  ctx.beginPath();ctx.ellipse(rFistX-9,rFistY-9,rFistR*0.32,rFistR*0.22,-0.10,0,Math.PI*2);ctx.fill();
  // Shadow
  ctx.fillStyle='rgba(40,22,12,0.45)';
  ctx.beginPath();ctx.ellipse(rFistX+6,rFistY+10,rFistR*0.60,rFistR*0.35,-0.10,0,Math.PI*2);ctx.fill();
  // Knuckle bumps
  for(let ki=0;ki<4;ki++){
    const kx=rFistX-rFistR*0.55+ki*(rFistR*0.38);
    const ky=rFistY-rFistR*0.28;
    ctx.fillStyle='rgba(40,22,12,0.35)';
    ctx.beginPath();ctx.ellipse(kx,ky+3,rFistR*0.19,rFistR*0.12,-0.10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c09060';
    ctx.beginPath();ctx.ellipse(kx,ky,rFistR*0.19,rFistR*0.15,-0.10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(240,175,95,0.45)';
    ctx.beginPath();ctx.ellipse(kx+1,ky-1,rFistR*0.10,rFistR*0.07,-0.10,0,Math.PI*2);ctx.fill();
  }
  // Knuckle crease lines
  ctx.strokeStyle='#4a2818';ctx.lineWidth=2;
  for(let ki=0;ki<3;ki++){
    const kx=rFistX-rFistR*0.35+ki*(rFistR*0.38);
    ctx.beginPath();
    ctx.moveTo(kx,rFistY-rFistR*0.40);
    ctx.lineTo(kx-3,rFistY+rFistR*0.18);
    ctx.stroke();
  }
  // Finger tips
  ctx.strokeStyle='#5a3520';ctx.lineWidth=1.5;
  for(let ki=0;ki<4;ki++){
    const kx=rFistX-rFistR*0.50+ki*(rFistR*0.34);
    ctx.beginPath();ctx.arc(kx,rFistY+rFistR*0.30,rFistR*0.15,0.2,Math.PI-0.2);ctx.stroke();
  }
  // Thumb
  ctx.fillStyle='#0a0604';
  ctx.beginPath();ctx.ellipse(rFistX+rFistR*0.80,rFistY+5,12,8,0.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a87850';
  ctx.beginPath();ctx.ellipse(rFistX+rFistR*0.80,rFistY+5,10,7,0.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(220,160,95,0.35)';
  ctx.beginPath();ctx.ellipse(rFistX+rFistR*0.82,rFistY+3,6,4,0.4,0,Math.PI*2);ctx.fill();

  // Dagger — emerges from top of fist (grip hidden inside fist)
  const gripX=rFistX+2, gripBot=rFistY-rFistR*0.55;
  // Grip wrap (partially visible above fist)
  ctx.fillStyle='#3a2410';
  ctx.fillRect(gripX-5,gripBot-18,10,18);
  ctx.fillStyle='#5a3a1e';
  ctx.fillRect(gripX-4,gripBot-17,8,16);
  ctx.strokeStyle='#1a0e06';ctx.lineWidth=1;
  for(let gi=0;gi<3;gi++){
    ctx.beginPath();ctx.moveTo(gripX-4,gripBot-14+gi*5);ctx.lineTo(gripX+4,gripBot-12+gi*5);ctx.stroke();
  }
  // Crossguard
  ctx.fillStyle='#4a3a20';
  ctx.beginPath();
  ctx.moveTo(gripX-14,gripBot-18);
  ctx.lineTo(gripX+14,gripBot-18);
  ctx.lineTo(gripX+12,gripBot-20);
  ctx.lineTo(gripX-12,gripBot-20);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(120,90,50,0.5)';
  ctx.fillRect(gripX-12,gripBot-20,24,1.5);
  // Blade — dark iron, pointed, from guard upward
  const bladeBaseY=gripBot-20;
  const bladeLen2=H*0.16;
  const bladeW2=W*0.055;
  const bladeTipY=bladeBaseY-bladeLen2;
  ctx.fillStyle='#3a3a44';
  ctx.beginPath();
  ctx.moveTo(gripX-bladeW2,bladeBaseY-3);
  ctx.lineTo(gripX+bladeW2,bladeBaseY-3);
  ctx.lineTo(gripX+bladeW2*0.35,bladeBaseY-bladeLen2*0.65);
  ctx.lineTo(gripX,bladeTipY);
  ctx.lineTo(gripX-bladeW2*0.35,bladeBaseY-bladeLen2*0.65);
  ctx.closePath();ctx.fill();
  // Blade edge highlight
  ctx.strokeStyle='rgba(160,155,140,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(gripX-bladeW2*0.9,bladeBaseY-4);
  ctx.lineTo(gripX-bladeW2*0.3,bladeBaseY-bladeLen2*0.6);
  ctx.lineTo(gripX-0.5,bladeTipY+1);ctx.stroke();
  // Center ridge
  ctx.strokeStyle='#1a1a22';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(gripX,bladeBaseY-4);
  ctx.lineTo(gripX,bladeTipY+1);ctx.stroke();
  // Rust spots
  ctx.fillStyle='rgba(90,55,25,0.4)';
  ctx.beginPath();ctx.ellipse(gripX-3,bladeBaseY-bladeLen2*0.3,2.5,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(gripX+2,bladeBaseY-bladeLen2*0.6,2,3,0,0,Math.PI*2);ctx.fill();
}

function drawMinimap(t){
  const ms=Math.min(4,Math.max(2,4*G.miniZoom)); // V39: smaller minimap
  const mw=G.mapW*ms, mh=G.mapH*ms;
  const mx2=W-mw-6, my2=8;
  
  // V19: More transparent background
  rr(mx2-2,my2-2,mw+4,mh+4,3,'rgba(0,0,0,.35)','#223'); // V39: more transparent
  
  // Draw cells
  for(let y=0;y<G.mapH;y++)for(let x=0;x<G.mapW;x++){
    const cx=mx2+x*ms, cy=my2+y*ms;
    if(!G.explored[y][x]){ctx.fillStyle='#080808';ctx.fillRect(cx,cy,ms,ms);continue}
    const cell=G.map[y][x];
    if(cell===1){ctx.fillStyle='#334';ctx.fillRect(cx,cy,ms,ms)}
    else if(cell===2){ctx.fillStyle='#420';ctx.fillRect(cx,cy,ms,ms)}
    else{ctx.fillStyle='#221';ctx.fillRect(cx,cy,ms,ms)}
  }
  
  // Monsters on minimap (only if explored)
  for(const m of G.mapMons){
    if(!m.alive)continue;
    const mx3=Math.floor(m.x),my3=Math.floor(m.y);
    if(!G.explored[my3]||!G.explored[my3][mx3])continue;
    ctx.fillStyle=m.isElite?'#f80':'#f44';
    ctx.beginPath();ctx.arc(mx2+m.x*ms,my2+m.y*ms,ms*0.35,0,Math.PI*2);ctx.fill();
  }
  
  // Boss on minimap
  if(!G.bossFed){
    const bx=G.mapW-2,by=G.mapH-2;
    if(G.explored[by]&&G.explored[by][bx]){
      ctx.fillStyle=G.bossDefeated?'#fa0':'#f00';
      ctx.beginPath();ctx.arc(mx2+(bx+0.5)*ms,my2+(by+0.5)*ms,ms*0.5,0,Math.PI*2);ctx.fill();
    }
  }
  
  // Chests
  for(const c of G.mapChests){
    if(c.opened||!G.explored[c.y]||!G.explored[c.y][c.x])continue;
    ctx.fillStyle='#fd4';ctx.fillRect(mx2+c.x*ms+1,my2+c.y*ms+1,ms-2,ms-2);
  }
  
  // Player (arrow)
  const px2=mx2+G.px*ms, py2=my2+G.py*ms;
  ctx.fillStyle='#4f4';
  ctx.save();ctx.translate(px2,py2);ctx.rotate(G.pdir);
  ctx.beginPath();ctx.moveTo(ms*0.5,0);ctx.lineTo(-ms*0.3,-ms*0.3);ctx.lineTo(-ms*0.3,ms*0.3);ctx.closePath();ctx.fill();
  ctx.restore();
  
  // Zoom button
  const zH=hitBtn(W-30,my2+mh+4,22,18);
  rr(W-30,my2+mh+4,22,18,3,zH?'#334':'#222','#556');
  dt(G.miniZoom>1?'-':'+',W-19,my2+mh+17,14,'#889','center','bold');
  if(zH&&mc){mc=false;S.clk();G.miniZoom=G.miniZoom>1?1:2}
}

function drawJoystick(){
  const jx=60,jy=H-80,jr=45;
  if(G.joystick.active){
    // Draw base
    ctx.strokeStyle='rgba(120,80,160,.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(G.joystick.sx,G.joystick.sy,jr,0,Math.PI*2);ctx.stroke();
    // Draw knob
    ctx.fillStyle='rgba(180,100,200,.4)';
    ctx.beginPath();ctx.arc(G.joystick.cx,G.joystick.cy,20,0,Math.PI*2);ctx.fill();
    // Direction indicators
    dt('↑',G.joystick.sx,G.joystick.sy-jr-10,14,'rgba(200,255,200,.4)','center');
    dt('←',G.joystick.sx-jr-10,G.joystick.sy+4,14,'rgba(200,200,255,.4)','center');
    dt('→',G.joystick.sx+jr+10,G.joystick.sy+4,14,'rgba(200,200,255,.4)','center');
  } else {
    // Show hint
    ctx.strokeStyle='rgba(80,60,100,.2)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(jx,jy,jr,0,Math.PI*2);ctx.stroke();
    dt('移动',jx,jy-4,12,'#544','center','bold');
    dt('↑前进',jx,jy+12,9,'#433','center');
  }
  
  // Check touch in joystick area (left half of screen, bottom 40%)
  if(mc&&!G.joystick.active&&mx<W*0.4&&my>H*0.5){
    G.joystick.active=true;G.joystick.sx=mx;G.joystick.sy=my;
    G.joystick.cx=mx;G.joystick.cy=my;mc=false;
  }
  if(G.joystick.active){
    G.joystick.cx=mx;G.joystick.cy=my;
    // Deactivate if finger lifts (handled by touchend)
  }
}

// ---- Battle ----
function rBattle(t){
  ctx.setTransform(1,0,0,1,0,0);

  // First-person corridor background (shared renderer)
  renderFP(t,true);

  // Combo display
  if(G.combo>=2){const ca=Math.min(1,G.comboT/60);ctx.globalAlpha=ca;dt(COMBO_NAMES[Math.min(G.combo,10)]||G.combo+'连!',W/2,H*.12,22,'#ff0','center','bold');ctx.globalAlpha=1}

  // Top bar
  drawPlayerBattleBar();

  // Enemies — drawn in corridor perspective, closer = larger
  G.hEnemy=-1;
  const alive=G.enemies.filter(e=>!e.dead);
  const totalSlots=alive.length;
  G.enemies.forEach((e,i)=>{
    if(e.dead)return;
    const slotIdx=alive.indexOf(e);
    // Closer enemies (index 0) are larger and lower
    const perspective=1-(slotIdx/Math.max(totalSlots,2))*0.35;
    const ex=W/2+(slotIdx-(totalSlots-1)/2)*Math.min(90,W*0.25)*perspective;
    const ey=H*(0.18+0.12*(1-perspective))+8;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath();
    ctx.ellipse(ex,ey+55*perspective,38*perspective,8*perspective,0,0,Math.PI*2);
    ctx.fill();

    // Monster image — scaled by perspective depth
    const img=getImg(EDEF[e.key].ico);
    if(img&&img.complete&&img.naturalWidth>0){
      const bob=Math.sin(t*.003+i)*4;
      const baseSz=Math.min(130,110+(e.boss?35:0));
      const sz=baseSz*perspective;
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.6)';
      ctx.shadowBlur=10;
      ctx.drawImage(img,ex-sz/2,ey-sz/2+bob,sz,sz);
      ctx.restore();
    }
    // Name + HP bar
    const ew=80*perspective;
    const hby=ey+52*perspective;
    rr(ex-ew/2,hby,ew,10,3,'#1a0000','#300');
    rr(ex-ew/2+1,hby+1,(ew-2)*(e.hp/e.maxHp),8,2,'#c33');
    dt(e.hp+'/'+e.maxHp,ex,hby+8*perspective,9,'#fff');
    dt(e.n,ex,ey-46*perspective,12*perspective,e.boss?'#fa0':'#ddd','center','bold');
    // Intent
    if(G.turn==='p'){
      const iy=ey-26*perspective;
      const atkVal=e.baseA||e.a;
      dt('⚔'+atkVal+(e.boss?'+?':''),ex,iy,11*perspective,e.lifesteal?'#a6f':e.burnAtk?'#f60':e.poison?'#a0f':'#f44','center','bold');
    }
    // Status
    if(e.burn>0)dt('🔥'+e.burn,ex-30*perspective,ey-48*perspective,9,'#f60');
    if(e.poisonDmg>0)dt('☠'+e.poisonDmg,ex+30*perspective,ey-48*perspective,9,'#a0f');
    if(e.enraged)dt('狂暴!',ex,ey-60*perspective,10,'#f00','center','bold');
    // Targeting
    if(G.sel>=0&&G.turn==='p'){
      const c=CARDS[G.hand[G.sel]];if(c&&c.t==='atk'){
        const hv=Math.abs(mx-ex)<50*perspective&&Math.abs(my-ey)<55*perspective;
        ctx.strokeStyle=hv?'#ff0':'rgba(255,255,0,.3)';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(ex,ey+50*perspective,42*perspective,12*perspective,0,0,Math.PI*2);ctx.stroke();
        if(hv)G.hEnemy=i;
      }
    }
  });

  // Pet (bottom-left corner)
  if(G.pet){
    const px=W*.05,py=H*.5;
    rr(px-5,py-25,70,50,5,'rgba(20,15,5,.8)','#a80');
    const img=getImg(G.pet.ico);if(img&&img.complete){ctx.drawImage(img,px,py-15,30,30)}
    dt(G.pet.n,px+38,py-12,9,'#fa0','left');
    dt('HP'+G.pet.hp,px+38,py,8,'#f88','left');
  }

  // Action buttons row
  const actY=H*.55,actW=55,actH=30;
  const cH=hitBtn(W/2-actW-3,actY,actW,actH);
  const canCook=G.ings.length>0&&(G.cookedThisTurn||0)<COOK_PER_TURN&&G.dishes.length<MAX_DISHES;
  rr(W/2-actW-3,actY,actW,actH,5,cH&&canCook?'#332':'#1a1a1a','#fa0');
  dt('烹饪',W/2-actW/2-3,actY+actH/2+5,11,canCook?'#fa0':'#555','center','bold');
  if(cH&&mc&&canCook){mc=false;S.clk();startCook()}
  const eH=hitBtn(W/2+3,actY,actW,actH);
  const canEat=G.dishes.length>0&&(G.cookEatenThisTurn||0)<EAT_PER_TURN;
  rr(W/2+3,actY,actW,actH,5,eH&&canEat?'#1a2a1a':'#1a1a1a','#5c8');
  dt('吃菜',W/2+actW/2+3,actY+actH/2+5,11,canEat?'#5c8':'#555','center','bold');
  if(eH&&mc&&canEat){mc=false;S.clk();eatDish()}

  // Feed pet
  if(G.pet&&G.dishes.length>0&&hitBtn(8,actY,55,actH)&&mc){mc=false;S.clk();feedPet()}
  if(G.pet&&G.dishes.length>0){rr(8,actY,55,actH,5,'#2a2a1a','#a80');dt('喂宠',8+27,actY+actH/2+5,11,'#a80','center','bold')}

  // End turn
  const etW=66;
  const etH=hitBtn(W-etW-6,actY,etW,actH);
  rr(W-etW-6,actY,etW,actH,5,etH&&G.turn==='p'?'#3a1a1a':'#1a1a1a','#c44');
  dt('结束',W-etW/2-6,actY+actH/2+5,11,G.turn==='p'?'#c44':'#555','center','bold');
  if(etH&&mc&&G.turn==='p'){mc=false;S.clk();endTurn();if(!_etGuard){_etGuard=true;setTimeout(()=>enemyAct(),300)}}

  if(G.turn==='e')dt('敌人行动中...',W/2,actY+actH+16,13,'#f44','center','bold');

  // Hand cards
  drawHandUI();

  // Targeting prompt
  if(G.sel>=0&&G.turn==='p'){
    const c=CARDS[G.hand[G.sel]];
    if(c&&c.t==='atk'){
      const al=G.enemies.filter(e=>!e.dead);
      if(al.length===1)dt('(自动攻击)',W/2,H*.64,13,'#fa0','center','bold');
      else if(G.hEnemy>=0&&mc)playCard(G.sel,G.hEnemy);
      else dt('点击目标',W/2,H*.64,13,'#fa0','center','bold');
    }
  }
  // V54m: Draw hands on top of battle UI
  drawHands(t);
}

function drawHandUI(){
  const n=G.hand.length;if(n===0)return;
  const cw=Math.min(60,W/n-4),ch=Math.min(88,cw*1.45);
  const gap=4;const totalW=n*cw+(n-1)*gap;const sx=(W-totalW)/2;const cy=H-ch-8;
  G.hand.forEach((id,i)=>{
    const c=CARDS[id];if(!c)return;
    const cx=sx+i*(cw+gap);const sel=G.sel===i;const hv=hitBtn(cx,cy,cw,ch);
    const up=sel?-12:(hv?-6:0);
    rr(cx,cy+up,cw,ch,5,sel?'#2a1a0a':'#151515',c.col);
    ctx.fillStyle='#125';ctx.beginPath();ctx.arc(cx+10,cy+up+10,8,0,Math.PI*2);ctx.fill();
    dt(c.c,cx+10,cy+up+14,11,'#8cf');
    dt(c.n,cx+cw/2,cy+up+28,10,'#fff','center','bold');
    drawIco(c.ico,cx+cw/2,cy+up+46,16,c.col);
    const lines=wrap(c.d,cw-5,8);lines.slice(0,3).forEach((ln,li)=>dt(ln,cx+cw/2,cy+up+58+li*9,8,'#aaa'));
    dt(c.t==='atk'?'ATK':'DEF',cx+cw-5,cy+up+11,7,c.col,'right');
    if(G.player.energy<c.c){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(cx,cy+up,cw,ch)}
    if(sel){ctx.strokeStyle='#ff0';ctx.lineWidth=2;rr(cx-1,cy+up-1,cw+2,ch+2,6,null,'#ff0')}
    if(hv&&mc&&G.turn==='p'){S.clk();if(G.player.energy<c.c){mc=false;return}
      if(c.t==='atk'){const al=G.enemies.filter(e=>!e.dead);if(al.length===1){mc=false;playCard(i,0);return}G.sel=(G.sel===i)?-1:i;mc=false}
      else{mc=false;playCard(i,-1)}
    }
  });
}

function drawIco(type,cx,cy,sz,col){
  ctx.save();ctx.translate(cx,cy);const s=sz/32;ctx.scale(s,s);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  switch(type){
    case'sword':ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(8,6);ctx.moveTo(-6,8);ctx.lineTo(6,-4);ctx.stroke();break;
    case'shield':ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(10,-6);ctx.lineTo(6,8);ctx.quadraticCurveTo(0,12,-6,8);ctx.lineTo(-10,-6);ctx.closePath();ctx.stroke();ctx.globalAlpha=.2;ctx.fill();ctx.globalAlpha=1;break;
    case'flame':ctx.beginPath();ctx.moveTo(0,-12);ctx.quadraticCurveTo(8,-4,6,4);ctx.quadraticCurveTo(4,10,0,12);ctx.quadraticCurveTo(-4,10,-6,4);ctx.quadraticCurveTo(-8,-4,0,-12);ctx.fill();break;
  }
  ctx.restore();
}

// ---- Cooking ----
function rCook(t){
  ctx.setTransform(1,0,0,1,0,0);

  // Campfire & pot first-person view
  const g=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,W*0.8);
  g.addColorStop(0,'#1a0a05');
  g.addColorStop(0.5,'#0d0503');
  g.addColorStop(1,'#050203');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // Dungeon corridor dim background
  ctx.fillStyle='#0a0608';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(W,0);
  ctx.lineTo(W*0.75,H*0.35);
  ctx.lineTo(W*0.25,H*0.35);
  ctx.closePath();
  ctx.fill();

  // Fire glow — flickering
  const flicker=0.8+Math.sin(t*.012)*0.2+Math.sin(t*.03)*0.1;
  const fg=ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,160*flicker);
  fg.addColorStop(0,`rgba(255,120,30,${0.25*flicker})`);
  fg.addColorStop(0.5,`rgba(200,60,20,${0.12*flicker})`);
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg;
  ctx.fillRect(0,0,W,H);

  // Stone fire pit base
  ctx.fillStyle='#2a2218';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.58,70,18,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#1a1410';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.58,55,14,0,0,Math.PI*2);
  ctx.fill();

  // Pot (big cauldron)
  ctx.fillStyle='#3a3028';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.48,45,38,0,0,Math.PI*2);
  ctx.fill();
  // Pot rim
  ctx.fillStyle='#4a4035';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,48,12,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2a2218';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,42,9,0,0,Math.PI*2);
  ctx.fill();
  // Pot liquid surface
  ctx.fillStyle=`rgba(${100+30*flicker},${60+20*flicker},20,0.8)`;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.41,38,8,0,0,Math.PI*2);
  ctx.fill();
  // Bubbles
  for(let i=0;i<4;i++){
    const bx=W/2+Math.sin(t*.002+i*1.5)*20;
    const by=H*0.41+Math.cos(t*.003+i*1.2)*4;
    ctx.fillStyle=`rgba(255,${180+Math.sin(t*.01+i)*40},60,${0.3+0.2*Math.sin(t*.008+i*2)})`;
    ctx.beginPath();
    ctx.arc(bx,by,2+Math.sin(t*.01+i),0,Math.PI*2);
    ctx.fill();
  }

  // Fire flames
  for(let i=0;i<3;i++){
    const fx=W/2-15+i*15;
    const fh=30+Math.sin(t*.015+i)*10;
    const fy=H*0.52;
    const fgr=ctx.createLinearGradient(fx,fy-fh,fx,fy);
    fgr.addColorStop(0,`rgba(255,200,80,${0.6*flicker})`);
    fgr.addColorStop(0.5,`rgba(255,100,20,${0.5*flicker})`);
    fgr.addColorStop(1,'rgba(100,20,0,0)');
    ctx.fillStyle=fgr;
    ctx.beginPath();
    ctx.moveTo(fx-8,fy);
    ctx.quadraticCurveTo(fx,fy-fh*0.5,fx,fy-fh);
    ctx.quadraticCurveTo(fx+8,fy-fh*0.5,fx+8,fy);
    ctx.closePath();
    ctx.fill();
  }

  // Title
  dt('烹饪',W/2,30,22,'#fa0','center','bold');
  dt('停在绿色区域获得完美品质!',W/2,52,11,'#888');

  if(!G.cook)return;

  if(G.cook.ingIdx===null){
    dt('选择食材:',W/2,80,14,'#ccc');
    G.ings.forEach((ig,i)=>{
      const ing=ING[ig];if(!ing)return;
      const col=i%4,row=Math.floor(i/4);
      const iw=78,ih=58,gap=8;
      const sx2=(W-(Math.min(G.ings.length,4)*iw+3*gap))/2;
      const x=sx2+col*(iw+gap),y=95+row*(ih+gap);
      const hv=hitBtn(x,y,iw,ih);
      rr(x,y,iw,ih,6,hv?'#332':'#1a1a1a',RARE_COL[ing.r]||'#666');
      dt(ing.n,x+iw/2,y+22,10,'#ccc','center','bold');
      dt('+'+ing.dish.h+'HP',x+iw/2,y+40,9,'#888');
      if(hv&&mc){S.clk();selIng(i)}
    });
    if(btn(W/2-50,H-58,100,36,'取消','#888')&&mc){S.clk();G.cook=null;G.state=G.prevState||'explore'}
    return;
  }

  const ing=ING[G.ings[G.cook.ingIdx]];
  dt(ing.n+' -> '+ing.dish.n,W/2,80,13,'#fa0','center','bold');
  dt('+'+ing.dish.h+'HP'+(ing.dish.b?(' ('+BUFF_NAMES[ing.dish.b]+')'):''),W/2,98,11,'#aaa');

  // Timing bar — placed below the pot
  const barY=H*0.62,barW=Math.min(280,W-40),barX=(W-barW)/2,barH=22;
  rr(barX,barY,barW,barH,4,'#1a1a1a','#555');
  ctx.fillStyle='#4a1a1a';ctx.fillRect(barX+1,barY+1,barW*.2-1,barH-2);
  ctx.fillStyle='#3a3a1a';ctx.fillRect(barX+barW*.2,barY+1,barW*.2,barH-2);
  ctx.fillStyle='#1a3a1a';ctx.fillRect(barX+barW*.4,barY+1,barW*.2,barH-2);
  ctx.fillStyle='#3a3a1a';ctx.fillRect(barX+barW*.6,barY+1,barW*.2,barH-2);
  ctx.fillStyle='#4a1a1a';ctx.fillRect(barX+barW*.8,barY+1,barW*.2-1,barH-2);
  dt('糊',barX+barW*.1,barY+15,9,'#f66');dt('OK',barX+barW*.3,barY+15,9,'#cc6');
  dt('完美',barX+barW*.5,barY+15,9,'#6c6');dt('OK',barX+barW*.7,barY+15,9,'#cc6');dt('糊',barX+barW*.9,barY+15,9,'#f66');

  if(!G.cook.started){
    dt('点击开始',W/2,barY+40,14,'#fa0','center','bold');
    if(hitBtn(barX,barY+50,barW,36)&&mc){S.clk();G.cook.started=true}
  }else if(!G.cook.ready){
    G.cook.ptr+=G.cook.dir*G.cook.spd;
    if(G.cook.ptr>=1){G.cook.ptr=1;G.cook.dir=-1}if(G.cook.ptr<=0){G.cook.ptr=0;G.cook.dir=1}
    const px=barX+G.cook.ptr*barW;
    ctx.fillStyle='#fff';ctx.fillRect(px-2,barY-4,4,barH+8);
    if(hitBtn(W/2-55,barY+50,110,38)&&mc){S.clk();G.cook.ready=true;finishCook()}
    rr(W/2-55,barY+50,110,38,6,'#3a2a0a','#fa0');dt('停止!',W/2,barY+74,18,'#fa0','center','bold');
  }

  if(G.seasons.length>0&&!G.cook.ready){
    dt('调味(可选):',40,H*0.82,11,'#aaa','left');
    G.seasons.slice(0,4).forEach((s,i)=>{
      const sx=40+i*80,sy=H*0.85;
      const hv=hitBtn(sx,sy,75,36);const sv=SEASONS[s];
      rr(sx,sy,75,36,5,hv?'#332':'#1a1a1a','#fc8');
      dt(sv.n,sx+37,sy+15,11,'#fc8','center','bold');dt(sv.eff,sx+37,sy+28,8,'#888','center');
      if(hv&&mc){S.clk();G.cook.seasonSel=i}
      if(G.cook.seasonSel===i){ctx.strokeStyle='#ff0';ctx.lineWidth=2;rr(sx-1,sy-1,77,38,6,null,'#ff0')}
    });
  }

  if(btn(W/2-50,H-58,100,36,'取消','#888')&&mc){S.clk();G.cook=null;G.state=G.prevState||'explore'}
}

// ---- Reward ----

// ---- Boss story/ask/feed ----
function rBossStory(t){
  const g=ctx.createRadialGradient(W/2,H*.3,0,W/2,H*.3,W);g.addColorStop(0,'#1a1525');g.addColorStop(1,'#0a060a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const bk=G.lastBossKey||G.bossDishKey;const bd=BOSS_DISH[bk];const e=EDEF[bk];
  if(e){const img=getImg(e.ico);if(img&&img.complete){ctx.drawImage(img,W/2-60,H*.1,120,120)}}
  dt(e?e.n:'',W/2,H*.32,20,'#fa0','center','bold');
  if(bd){wrap(bd.story,W-60,14).forEach((ln,i)=>dt(ln,W/2,H*.4+i*20,14,'#ccc'));
    dt('菜谱: '+bd.n,W/2,H*.56,16,'#cfa','center','bold');

}

function rBossFeed(t){

    dt('(宠物会随战斗衰减,记得喂养!)',W/2,H*.51,11,'#888');
    if(btn(W/2-150,H*.6,140,42,'招募!','#cfa')&&mc){S.clk();tryRecruit();feedBoss();enterFloor(G.floor+1)}

// ---- Codex/Death/Win ----
function rCodex(t){
  ctx.fillStyle='#0a060a';ctx.fillRect(0,0,W,H);
  dt('图鉴',W/2,30,22,'#cfa','center','bold');
  const tabs=['mob','recipe','boss'],tabN=['怪物','食谱','Boss'];
  tabs.forEach((tab,i)=>{
    const tx=W/2-150+i*100,ty=50,tw=95;
    const hv=hitBtn(tx,ty,tw,28);rr(tx,ty,tw,28,5,G.codexTab===tab?'#2a2a0a':'#1a1a1a',G.codexTab===tab?'#cfa':'#444');
    dt(tabN[i],tx+tw/2,ty+19,12,G.codexTab===tab?'#cfa':'#888','center','bold');
    if(hv&&mc){S.clk();G.codexTab=tab}
  });
  const cy=88;
  if(G.codexTab==='mob'){
    Object.keys(EDEF).filter(k=>!EDEF[k].boss).forEach((k,i)=>{
      const col=i%3,row=Math.floor(i/3);const x=15+col*115,y=cy+row*88;
      const seen=(G.meta.seenMobs||[]).includes(k);const e=EDEF[k];
      rr(x,y,105,78,6,'#1a1a1a','#444');
      if(seen){const img=getImg(e.ico);if(img&&img.complete){ctx.drawImage(img,x+37,y+5,40,40)}
        dt(e.n,x+52,y+55,10,'#ccc','center','bold');dt('HP'+e.hp+' ATK'+e.a,x+52,y+68,9,'#888')
      }else{ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x+5,y+5,95,68);dt('???',x+52,y+40,16,'#444','center','bold')}
    });
  }else if(G.codexTab==='recipe'){
    Object.keys(ING).forEach((k,i)=>{
      const col=i%3,row=Math.floor(i/3);const x=15+col*115,y=cy+row*88;
      const seen=(G.meta.seenRecipes||[]).includes(k);const ing=ING[k];
      rr(x,y,105,78,6,'#1a1a1a','#444');
      if(seen){dt(ing.n,x+52,y+18,10,'#ccc','center','bold');dt(ing.dish.n+'+'+ing.dish.h+'HP',x+52,y+38,9,'#888');
        if(ing.dish.b)dt(BUFF_NAMES[ing.dish.b],x+52,y+52,8,'#aaa')
      }else{ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x+5,y+5,95,68);dt('???',x+52,y+40,16,'#444','center','bold')}
    });
  }else{
    Object.keys(BOSS_DISH).forEach((k,i)=>{
      const x=15+i*115,y=cy;const seen=(G.meta.seenBoss||[]).includes(k);const e=EDEF[k];
      rr(x,y,105,110,6,'#2a0a0a','#600');
      if(seen){const img=getImg(e.ico);if(img&&img.complete){ctx.drawImage(img,x+35,y+5,45,45)}
        dt(e.n,x+52,y+60,11,'#fa0','center','bold');dt('HP'+e.hp+' ATK'+e.a,x+52,y+75,9,'#f88')
      }else{ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x+5,y+5,95,100);dt('???',x+52,y+50,16,'#444','center','bold')}
    });
  }
  if(btn(W/2-50,H-50,100,36,'返回','#888')&&mc){S.clk();G.state=G.prevState||'title'}
}

function rDead(t){
  ctx.fillStyle='#0a060a';ctx.fillRect(0,0,W,H);
  dt('你倒下了...',W/2,H*.28,26,'#f44','center','bold');
  dt('第 '+(G.floor+1)+' 层',W/2,H*.36,16,'#888');
  dt('金币: '+G.player.gold,W/2,H*.41,14,'#fa0');
  if(btn(W/2-80,H*.55,160,42,'重新开始','#cfa')&&mc){S.clk();newRun()}
  if(btn(W/2-80,H*.55+50,160,42,'标题','#888')&&mc){S.clk();G.state='title'}
}

function rWin(t){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  dt('胜利!',W/2,H*.22,30,'#cfa','center','bold');
  dt('你征服了地牢!',W/2,H*.3,18,'#cfa');
  dt('金币: '+G.player.gold,W/2,H*.39,14,'#fa0');
  G.meta.bestFloor=Math.max(G.meta.bestFloor||0,G.floor+1);
  if(G.floor+1>=4&&!((G.meta.titles||[]).includes('征服者'))){G.meta.titles=G.meta.titles||[];G.meta.titles.push('征服者');save()}
  dt('称号: '+((G.meta.titles||[]).join(', ')||'无'),W/2,H*.44,12,'#cfa');
  if(btn(W/2-80,H*.6,160,42,'新一局','#cfa')&&mc){S.clk();newRun()}
  if(btn(W/2-80,H*.6+50,160,42,'标题','#888')&&mc){S.clk();G.state='title'}
}

// ---- Game Loop ----
let lastT=0;
function loop(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  pU(dt);
  updateMovement(dt);
  updateMapMons(dt);
  checkEncounters(); // check every frame
  checkChests(); // check every frame
  render(t);
  requestAnimationFrame(loop);
}

// ---- Init ----
loadSave();
G.meta.days=(G.meta.days||0)+1;
const today=new Date().toDateString();
if(G.meta.lastLogin!==today){
  if(G.meta.lastLogin){const d=new Date(G.meta.lastLogin);const diff=Math.floor((new Date(today)-d)/86400000);if(diff===1)G.meta.streak=(G.meta.streak||0)+1;else G.meta.streak=1}
  else G.meta.streak=1;G.meta.lastLogin=today;
}
save();
requestAnimationFrame(loop);
if(G.settings.bgm)bgmOn();
</script>
